	<div class="dim"></div>
	<div class="popInner titMini">
		<h1><span class="blind">계속 진행여부 확인</span></h1>

			<div class="popEventTxtBox">

				<p class="txtb1">그만하시겠어요? </p>
			</div>
		</div>
		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="" onclick="popClose(this);return false;" role="button">아니오</a>
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">네, 그만할래요</a>
			</div>
		</div>
	</div>
