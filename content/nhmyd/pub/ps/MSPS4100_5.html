<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NH Bank">
<meta name="format-detection" content="telephone=no">
<link rel="shortcut icon" href="#">
<title>기관상세(공공기관 : 정상, 만료예정) | 연결자산관리 | 설정관리</title>
<script type="text/javascript" src="../pub-assets/js/head.js"></script>
</head>
<body>
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1>기관 상세</h1>
		<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
		<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a>
	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] 기관상세 ### -->
	<!-- ###################################### -->
	<div class="container">
		<!-- -------------------------------------- -->
		<!-- [상단영역] 기관정보 -->
		<!-- -------------------------------------- -->
		<div class="boxTypeWrap">
			<div class="agencyDetail">
				<!-- <span class="imgWrap A1AABG0000"><span class="bankName">국민건강보험공단</span></span> -->
				<span class="imgWrap"> <!-- [2022-11-21] 사보현 : 로고 공통 이미지로 변경 -->
					<img src="../../images/logos/AABG0000.png" alt="국민건강보험공단 로고" class="imgLogo">
					<span class="bankName">국민건강보험공단</span>
				</span>
				<span class="tag bgGray">테그</span>
			</div>
		</div>

		<!-- -------------------------------------- -->
		<!-- [상품정보] -->
		<!-- -------------------------------------- -->
		<div class="boxTypeWrap">
			<ul class="agencyDetailList">
				<li>
					<a href="javascript:;" role="button">
						<div class="title">건강·장기 요양보험료 납부확인서(직장가입자)</div>
					</a>
				</li>
			</ul>
		</div>

		<!-- -------------------------------------- -->
		<!-- [연결정보] -->
		<!-- -------------------------------------- -->
		<div class="boxTypeWrap">
			<div class="dataDiscList">
				<dl>
					<dt>연결구분</dt>
					<dd>정기(월 1회)</dd>
				</dl>
				<!-- [2023 NH마이데이터 서비스 고도화] -->
				<dl>
					<dt>연결시작(연장)일자</dt>
					<dd>2022.06.23</dd>
				</dl>
				<!-- // -->
				<dl>
					<dt>연결종료(예정)일자</dt> <!-- [MD2408_067] 문구수정 -->
					<dd>YYYY.MM.DD</dd>
				</dl>
			</div>
		</div>

		<ul class="btnBoxWrap mt20">
			<li><button type="button"><span class="iconDel">해제/삭제</span></button></li>
			<li><button type="button" onclick="uiUpdateMotion(this)"><span class="iconUpdate">업데이트</span></button></li>
		</ul>	
		<div class="areaBodyBtnFlex mt20">
			<!-- [MD2411_092_v0.21] 자산연결 동의 절차 간소화(2.0반영) 텍스트 수정 -->
			<button type="button" class="btnBodyLine">정보변경</button>
			<button type="button" class="btnBodyLine">기간연장</button> <!-- [MD2408_067] 문구수정 -->
		</div>
		
		<div class="areaBtnDefault">
			<!-- [MD2411_092_v0.21] 자산연결 동의 절차 간소화(2.0반영) 텍스트 수정 -->
			<a href="javascript:;" class="btnPressPoint" role="button">자산연결 변경</a>
		</div>

	</div>
	<!-- ###################################### -->
</div>

<!-- ###################################### -->
<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script>
	//샘플 : 업데이트 버튼 클릭시 모션 추가
	function uiUpdateMotion(el){
		var _txt = $(el).find('> .iconUpdate').text();
		$(el).find('> .iconUpdate').addClass('ani').text('업데이트 중');

		setTimeout(function(){
			//업데이트 후 이벤트 샘플
			$(el).find('> .iconUpdate').removeClass('ani').text(_txt);
			tostpop();
		},4000)
	}

	//샘플 : 토스트팝업
	function tostpop(){
		var $tostCont = '<div class="tostpopupWrap" aria-live="assertive"><div class="tostMsg">업데이트가 완료되었습니다.</div></div>'
		$('.container').after($tostCont);
		setTimeout(function(){
			$('.tostpopupWrap').remove();
		},4000)
	}
</script>
<!-- ###################################### -->
</body>
</html>
