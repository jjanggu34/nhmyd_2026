<title>[P] PUSH설정 확인 안내</title>
<script src="../pub-assets/js/head.js"></script>
<script>
    $(document).ready(function(){
        slidePopConfirm();
    })  
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] PUSH설정 확인 안내 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner">
		<h1>PUSH설정 확인 안내</h1>
		<div class="popCont">
			<div class="transfer">
				<strong class="f16">일부 정보의 수집 주기가 "수시"로 되어있어 금융일정알림을 받을 수 없어요!</strong>
				<ul class="listDot pushInfo">
					<li class="pointColor03"><strong>자산연결 관리 화면에서 수집주기를 "정기"로 변경하면 알림을 받을 수 있습니다. </strong></li>
				</ul>
				<div class="areaBodyBtnFull mt20">
					<a href="javascript:;" class="btnBodyLine" role="button">수집주기 변경하기</a>
				</div>
			</div>
		</div>
		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="" role="button">다시 보지 않기</a>
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
</body>
