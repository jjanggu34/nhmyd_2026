<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NH Bank">
<meta name="format-detection" content="telephone=no">
<link rel="shortcut icon" href="#">
<title>자산연결</title>
<script type="text/javascript" src="../pub-assets/js/head.js"></script>

</head>
<body>
<!-- wrapper -->
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1>자산연결</h1>
		<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
		<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a>
	</div>
	<!-- //header -->
	<!-- container -->
	<div class="container">
		<div class="confirmMsg connectimgBg Type02">
			<p class="expainTxt">자산연결을 완료하였습니다</p>
			<p class="subTxt mt20">최신 자산정보가 반영되기까지 <br>최대 5분 정도의 시간이 소요될 수 있어요</p> <!-- [MD2408_067] 문구추가 -->
		</div>

		<div class="boxTypeWrap listBoxWrap addLine">
			 <div class="listNum">
			 	<span>성공 <em>3건</em>/</span>
				<span>실패 <em>1건</em></span>
							
				<!-- [MD2408_067] 툴팁추가 -->
				<div class="tooltipWrap w96">
					<button type="button" class="toolTipBtn" onclick="tooltipOpen($(this))"><span class="blind">연결실패안내 툴팁 열기</span></button>
					<div class="tooltipCont">
						<p>연결에 실패한 자산이 있어요. 정확한 자산 관리를 위해 아래 버튼을 눌러 다시 연결하기를 해보세요</p>
						<button type="button" class="close" onclick="tooltipClose($(this))"><span class="blind">연결실패안내 툴팁 닫기</span></button>
					</div>
				</div>
				<!-- // [MD2408_067] 툴팁추가 -->
			 </div>
			<!-- s:금융기관 리스트 -->
			<div class="connLine">
				<div class="totalTitWrap">
					<h2 class="listTitWrap noneTogg">
						<div class="titL">
							<!-- <span class="imgWrap AAAZ0000"><em class="blind">농축협</em></span> -->
							<span class="imgWrap"> <!-- [2022-11-21] 사보현 : 로고 공통 이미지로 변경 -->
								<img src="../../images/logos/AAAZ0000.png" alt="농축협 로고" class="imgLogo">
							</span>
							<span class="accTit">농축협</span>
						</div>
						<div class="titR">
							<span class="connectStatus sucessConn">성공</span>
						</div>
					</h2>
				</div>
			</div>

			<div class=" connLine">
				<div class="totalTitWrap">
					<h2 class="listTitWrap noneTogg">
						<div class="titL">
							<!-- <span class="imgWrap AAMC0000"><em class="blind">국민은행</em></span> -->
							<span class="imgWrap"> <!-- [2022-11-21] 사보현 : 로고 공통 이미지로 변경 -->
								<img src="../../images/logos/AAMC0000.png" alt="국민은행 로고" class="imgLogo">
							</span>
							<span class="accTit">국민은행</span>
						</div>
						<div class="titR">
							<span class="connectStatus sucessConn">성공</span>
						</div>
					</h2>
				</div>
			</div>

			<div class="assetTotalList toggleWrap connLine">
				<div class="totalTitWrap">
					<a href="javascript:;" class="toggleBtn"> 
						<h2 class="listTitWrap">
							<div class="titL">
								<!-- <span class="imgWrap AAMC0000"><em class="blind">국민은행</em></span> -->
								<span class="imgWrap"> <!-- [2022-11-21] 사보현 : 로고 공통 이미지로 변경 -->
									<img src="../../images/logos/AAMC0000.png" alt="국민은행 로고" class="imgLogo">
								</span>
								<span class="accTit">국민은행</span>
							</div>
							<div class="titR">
								<span class="connectStatus noConn">실패</span>
							</div>
						</h2>
					</a>
				</div>
				<div class="totalAccList toggleCont" style="display:none">
					<p class="garyBox">응답지연(80002E10)</p>
				</div>
			</div>

			<div class="connLine">
				<div class="totalTitWrap">
					<h2 class="listTitWrap noneTogg">
						<div class="titL">
							<!-- <span class="imgWrap AAMM0000"><em class="blind">기관명기관명기관명기관명기관명기관명기관명</em></span> -->
							<span class="imgWrap"> <!-- [2022-11-21] 사보현 : 로고 공통 이미지로 변경 -->
								<img src="../../images/logos/AAMM0000.png" alt="기관명 로고" class="imgLogo">
							</span>
							<span class="accTit">기관명기관명기관명기관명기관명기관명</span>
						</div>
						<div class="titR">
							<span class="connectStatus sucessConn">성공</span>
						</div>
					</h2>
				</div>
			</div>


			<!-- //e:금융기관 리스트 -->
		</div>

		
		<div class="areaBtnDefault half"> <!-- [MD2408_067] 클래스명(half) 추가 -->
			<a href="javascript:;" class="btnPressDefault" role="button">확인</a> <!-- [MD2408_067] 클래스명 변경 -->
			<a href="javascript:;" class="btnPressPoint" role="button">다시 연결하기</a> <!-- [MD2408_067] 버튼추가 -->
		</div>
	</div>
</div>
</body>
</html>
