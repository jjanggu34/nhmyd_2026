<!-- ###################################### -->
<!-- ### [팝업] NH마이데이터 PUSH 안내(스마트뱅킹) ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner">
		<h1>NH마이데이터 PUSH 안내</h1>
		<div class="popCont">
			<div class="transfer">
				<strong class="f16">
					NH마이데이터 서비스 PUSH 안내를 위하여<br>
					$상위채널명$의 PUSH 알림 동의가 필요합니다.<br>
					YYYY년 MM월 DD일 해당 내용에 동의하시겠습니까?
				</strong>
				<ul class="listDot pushInfo">
					<li class="pointColor03"><strong>필수 PUSH알림 수신동의</strong><br>(정기점검, 업데이트 등 주요정보 안내)</li>
					<li class="pointColor03"><strong>혜택정보 PUSH알림 수신동의</strong><br>(이벤트, 상품안내, 서비스안내 등 광고정보 안내)</li>
				</ul>
			</div>
		</div>
		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="" role="button">다시 보지 않기</a>
				<a href="javascript:;" class="confirmBtn" role="button">동의하기</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
