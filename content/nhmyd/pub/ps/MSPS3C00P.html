<div class="nhasset popWrap fullLayerPop" role="dialog">
	<div class="popInner">
		<h1>인증방식 선택</h1>
		<div class="popCont grayPop">
			<h2 class="defTit">자산연결을 위해<br><strong>본인인증방식을 선택</strong>하세요</h2>
			<ul class="listCerti">
				<li>
					<button type="button" class="publicCerti">
						<span>
							<strong class="title">공동인증서</strong>
							<!-- [CASE] 인증서 있는 경우 -->
							<span class="tag bgSky">있음</span>
							<span class="tag bgSky">최근사용</span>
							<!-- [CASE] 인증서 없는 경우 -->
							<span class="tag bgOrange">없음</span>
							<!-- // -->
						</span>
					</button>
				</li>
				<li>
					<button type="button" class="financeCerti">
						<span>
							<strong class="title">금융인증서</strong>
							<span class="tag bgSky">최근사용</span>
						</span>
					</button>
				</li>
				<li>
					<button type="button" class="naverCerti">
						<span>
							<strong class="title">네이버인증서</strong>
						</span>
					</button>
				</li>
			</ul>
			<!-- [MD2411_092_v0.16] [자산연결 동의 절차 간소화] 개별인증 삭제  -->

		<div class="popBtnWrap">
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
