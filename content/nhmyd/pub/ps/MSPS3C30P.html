<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">

<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">

<meta name="content" content="">
<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>[P] 자산연결 목록/상세조회 로딩</title>
<script type="text/javascript" src="../pub-assets/js/head.js"></script>
<script type="text/javascript">
$(function(){
    fullLayerPop();
});
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 자산연결 목록/상세조회 로딩 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap fullLayerPop" role="dialog">
	<div class="popInner">
		<h1 aria-hidden="true"></h1>
		<div class="popCont">
			<div class="assetLoadingWrap">
				<!-- [MD2411_092_v0.20] [자산연결 동의 절차 간소화] $목록$ 삭제 -->
				<div class="title"><span>$김농협$</span>님의<br>자산 내역을 가져오고 있어요</div>
				<p class="subTxt2 mt10">앱을 종료 하지 말고 기다려 주세요.</p>
				<div class="assetLoadingValue">
					<span><strong>100.00</strong>% 완료</span>
				</div>
			</div>			
		</div>
	</div>
</div>

<!-- ###################################### -->
<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script type="text/javascript">
	$(document).ready(function() {
		myCarCost();
	});
	function myCarCost() {
		var $thisCost = $('.assetLoadingValue strong');
		var memberCountContText = $thisCost.text()
		$({ val : 0}).animate({ val : memberCountContText}, {
			duration: 1500,//애니메이션 시간
			step: function(){
				var num = numberWithCommas(Math.floor(this.val));
				$thisCost.text(num);
			},
			complete: function(){
				var num = numberWithCommas(Math.floor(this.val));
				$thisCost.text(num);
			}
		});
		function numberWithCommas(x){
			return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
		}
	}
</script>
<!-- ###################################### -->
</body>
</html>
