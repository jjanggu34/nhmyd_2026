<!DOCTYPE html >

<head>

<meta name="apple-mobile-web-app-title" content="농협자산관리" />

<meta http-equiv="Expires" content="-1">
<title>[P] 스크래핑 데이터 로딩</title>
<script type="text/javascript" src="../pub-assets/js/head.js"></script>
<script type="text/javascript">
$(function(){
	fullLayerPop();
});
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 스크래핑 데이터 로딩 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap fullLayerPop" role="dialog">
	<div class="popInner">
		<h1 aria-hidden="true"></h1>
		<div class="popCont">
			<div class="assetLoadingWrap bgTypeAgency">
				<div class="title">선택한 기관으로부터<br>필요한 정보를 조회하고 있어요</div>
				<p class="subTxt2 mt10">앱을 종료 하지 말고 기다려 주세요.</p>
				<div class="assetLoadingValue">
					<span><strong>100.00</strong>% 완료</span>
				</div>
			</div>
		</div>
	</div>
</div>

<!-- ###################################### -->
<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script type="text/javascript">
	$(document).ready(function() {
		myCarCost();
	});
	function myCarCost() {
		var $thisCost = $('.assetLoadingValue strong');
		var memberCountContText = $thisCost.text()
		$({ val : 0}).animate({ val : memberCountContText}, {
			duration: 1500,//애니메이션 시간
			step: function(){
				var num = numberWithCommas(Math.floor(this.val));
				$thisCost.text(num);
			},
			complete: function(){
				var num = numberWithCommas(Math.floor(this.val));
				$thisCost.text(num);
			}
		});
		function numberWithCommas(x){
			return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
		}
	}
</script>
<!-- ###################################### -->
</body>
</html>
