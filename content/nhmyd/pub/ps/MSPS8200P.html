<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">

<meta name="content" content="">
<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">

<title>[P] 추가이용동의</title>
<script type="text/javascript" src="../pub-assets/js/head.js"></script>
<script>
	$(document).ready(function () {
		fullLayerPop();
	})
</script>
</head>
<body>
<!-- wrapper -->
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 추가이용동의 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap fullLayerPop">
	<div class="popInner">
		<h1>추가이용동의</h1>
		<div class="popCont grayPop">
			<!-- -------------------------------------- -->
			<!-- [SECTION] 상단문구 -->
			<!-- -------------------------------------- -->
			<h2 class="defTit">상품안내와 서비스 이용을 위해 <br><strong>추가 동의가 필요</strong>합니다.</h2>

			<!-- -------------------------------------- -->
			<!-- [SECTION] 동의내역 -->
			<!-- -------------------------------------- -->
			<div class="formWrap boxTypeWrap">
				<ul class="listLinkWrap2 addtype mt0">
					<!-- [CASE] 7번 동의서 -->
					<li class="mt0">
						<div class="agrLinkType">
							<div class="subject">개인(신용) 정보수집&middot;이용&middot;제공동의서 (상품서비스 안내 등)</div>
							<a href="javascript:;" role="button" title="약관 내용 보기" class="contBtn04">보기</a>
						</div>
						<div class="formHolder dsf">
							<span class="formHolder radio active">
								<input type="radio" checked id="radio_01" name="radio_00">
								<label class="radio" for="radio_01">동의하지 않음</label>
							</span>
							<span class="formHolder radio mt0">
								<input type="radio" id="radio_02" name="radio_00">
								<label class="radio" for="radio_02">동의함</label>
							</span>
						</div>
						<div class="agreeSubcont mt25">
							<div class="agreeSubTitle">
								<strong>상품 서비스 안내 방법</strong>
								<span class="formHolder check">
									<input type="checkbox" id="type_all001" class="chekTypeOther">
									<label class="check" for="type_all001"> 전체</label>
								</span>
							</div>
							<div class="boxRadio ">
								<div class="boxRadioInn">
									<span>
										<input id="productInfo01" type="checkbox" aria-label="상품 서비스 안내 방법(전화)">
										<label class="radio" for="productInfo01" aria-hidden="true">전화</label>
									</span>
								</div>
								<div class="boxRadioInn">
									<span>
										<input id="productInfo02" type="checkbox" aria-label="상품 서비스 안내 방법(문자메시지)">
										<label class="radio" for="productInfo02" aria-hidden="true">문자메시지</label>
									</span>
								</div>
							</div>
							<div class="boxRadio">
								<div class="boxRadioInn">
									<span>
										<input id="productInfo03" type="checkbox" aria-label="상품 서비스 안내 방법(우편물)">
										<label class="radio" for="productInfo03" aria-hidden="true">우편물</label>
									</span>
								</div>
								<div class="boxRadioInn">
									<span>
										<input id="productInfo04" type="checkbox" aria-label="상품 서비스 안내 방법(이메일)">
										<label class="radio" for="productInfo04" aria-hidden="true">이메일</label>
									</span>
								</div>
							</div>
						</div>
					</li>
					<!-- [CASE] 7-1번 동의서 -->
					<li class="bdLine">
						<div class="agrLinkType">
							<div class="subject">개인(신용)정보 수집&middot;이용 동의서(상품서비스 안내 등)(NH마이데이터)</div>
							<a href="javascript:;"  role="button" title="약관 내용 보기" class="contBtn04">보기</a>
						</div>
						<div class="formHolder dsf">
							<span class="formHolder radio active">
								<input type="radio" checked id="radio_11" name="radio_10">
								<label class="radio" for="radio_11">동의하지 않음</label>
							</span>
							<span class="formHolder radio mt0">
								<input type="radio" id="radio_12" name="radio_10">
								<label class="radio" for="radio_12">동의함</label>
							</span>
						</div>
					</li>
					<!-- [CASE] 제3자 동의서 -->
					<li>
						<div class="agrLinkType">
							<div class="subject">개인(신용)정보 제3자 제공 동의서(계열사 제공 &lt;NH마이데이터&gt;)</div>
							<a href="javascript:;" role="button" title="약관 내용 보기" class="contBtn04">보기</a>
						</div>
						<div class="formHolder dsf">
							<span class="formHolder radio active">
								<input type="radio" checked id="radio_21" name="radio_20">
								<label class="radio" for="radio_21">동의하지 않음</label>
							</span>
							<span class="formHolder radio mt0">
								<input type="radio" id="radio_22" name="radio_20">
								<label class="radio" for="radio_22">동의함</label>
							</span>
						</div>
					</li>
					<!-- // -->
				</ul>
			</div>
			<!-- -------------------------------------- -->
		</div>
		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" role="button">동의</a> <!-- [D] 비활성화 클래스명 (disabled) 및 aria-disabled="true" 추가 -->
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
</body>
</html>
