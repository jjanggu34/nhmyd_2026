<title>[P] 간편인증 요청</title>
<script src="../pub-assets/js/head.js"></script>
<script>
	$(document).ready(function () {
		fullLayerPop();
	})
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- [팝업] 간편인증 요청 -->
<div class="nhasset popWrap fullLayerPop">
	<div class="popInner">
		<h1>간편인증 요청</h1>
		<div class="popCont">
			<div class="infoBox3">
				<p class="bigTit"><span>카카오로</span><br><strong>간편인증 요청을 보냈습니다.</strong></p>
			</div>
			<div class="certiTimeWrap"><span class="certiTime" aria-label="인증 남은 시간">mm:ss</span></div>
			<div class="certiTimeWrap"><span class="certiTime count" aria-label="인증 남은 시간">mm:ss</span></div>

			<ol class="certStep">
				<li>
					<strong class="certStepTitle"><span class="num">1</span> 카카오톡 앱에서</strong>
					<p class="certStepPara">채팅 목록에서 ‘카카오톡 지갑’을 선택하세요.</p>
					<div class="certStepImg"><img src="../../images/img_certi_kakao01.png" alt="채팅 목록에서 ‘카카오톡 지갑’을 선택하세요."></div>
					<p class="certStepPara">카카오톡 지갑 인증 요청 안내 메시지에서 ‘인증하기’를 선택합니다.</p>
					<div class="certStepImg"><img src="../../images/img_certi_kakao02.png" alt="카카오톡 지갑 인증 요청 안내 메시지에서 ‘인증하기’를 선택합니다."></div>
				</li>
				<li>
					<strong class="certStepTitle"><span class="num">2</span> NH스마트뱅킹 앱에서</strong>
					<p class="certStepPara">인증 완료 후 아래 ‘인증완료’ 버튼을 선택하세요.</p>
				</li>
			</ol>
			
		</div>
		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" role="button">인증완료</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- // -->
</body>
</html>
