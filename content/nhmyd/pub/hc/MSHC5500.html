							</div>

							</div>
						</a>
					</div>
				</div>
				<div class="swiper-control">
					<div class="swiper-pagination"></div>
				</div>
				<a href="javascript:;" role="button" class="swiper-button-prev blind">이전슬라이드</a>
				<a href="javascript:;" role="button" class="swiper-button-next blind">다음슬라이드</a>

		<!-- -------------------------------------- -->

<!-- ###################################### -->
<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script>
	$(function () {
		var swiper1 = new Swiper('.htNewsBanner .swiper-container', {
			spaceBetween: 16,
			pagination: {
				el: '.swiper-pagination',
				type: 'fraction',
				clickable: true,
				bulletElement: 'a',
			},
			on: {
				init: function(){
					$('.htNewsBanner .swiper-slide').attr('aria-hidden','true');
					$('.htNewsBanner .swiper-slide-active').attr('aria-hidden','false');
				},
				slideChangeTransitionEnd : function(){
					var $shareBannerBtn = $(".htNewsBanner .swiper-pagination");
					$shareBannerBtn.find("a").attr('title','');
					$shareBannerBtn.find("a").eq(this.activeIndex).attr('title','선택됨');
					$('.swiper-slide').attr('aria-hidden','true');
					$('.swiper-slide-active').attr('aria-hidden','false');
				}
			}
		});

		var swiper = new Swiper('.htSubMainBanner.typeFat .swiper-container', {
			spaceBetween: 20,
			autoplay: {
				delay: 2500,
				disableOnInteraction: true,
				pauseOnMouseEnter: true,
			},
			pagination: {
				el: '.swiper-pagination',
				type: 'bullets',
				clickable: true,
				bulletElement: 'a',
			},
			on: {
				init: function(){
					$('.htSubMainBanner.typeFat .swiper-slide').attr('aria-hidden','true');
					$('.htSubMainBanner.typeFat .swiper-slide-active').attr('aria-hidden','false');
				},
				slideChangeTransitionEnd : function(){
					var $shareBannerBtn = $(".htSubMainBanner.typeFat .swiper-pagination");
					$shareBannerBtn.find("a").attr('title','');
					$shareBannerBtn.find("a").eq(this.activeIndex).attr('title','선택됨');
					$('.htSubMainBanner.typeFat .swiper-slide').attr('aria-hidden','true');
					$('.htSubMainBanner.typeFat .swiper-slide-active').attr('aria-hidden','false');
				}
			}
		});
		$('.htSubMainBanner.typeFat').find('.stopBtn').on('click', function () {
			$(this).parent('.swiper-autoBtn').removeClass('playing').find('a').focus();
			swiper.autoplay.stop();
			console.log('자동재생 멈춤');
		})
		$('.htSubMainBanner.typeFat').find('.playBtn').on('click', function () {
			$(this).parent('.swiper-autoBtn').addClass('playing').find('a').focus();
			swiper.autoplay.start();
			console.log('자동재생 시작');
		})
	})
</script>
<!-- ###################################### -->
</body>
