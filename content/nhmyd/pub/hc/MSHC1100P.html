<title>[P] 검진일 선택</title>
<script src="../pub-assets/js/head.js"></script>
<script>
	$(function(){
		slidePopConfirm();
	})
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 검진일 선택 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner">
		<h1>검진일 선택
			<div class="tooltipWrap">
				<button type="button" class="toolTipBtn" onclick="tooltipOpen($(this))"><span class="blind">검진일 안내 툴팁 열기</span></button>
				<div class="tooltipCont mt0">
					<p>국가건강검진 대상연도만 노출됩니다.</p>
					<button type="button" class="close" onclick="tooltipClose($(this))"><span class="blind">툴팁 닫기</span></button>
				</div>
			</div>
		</h1>
		<div class="popCont">
			<ul class="selectList selMonth">
				<li class="cs active"><a href="javascript:;" role="button" title="선택됨">2021년 11월 13일</a></li>
				<li><a href="javascript:;" role="button">2016년 12월 12일</a></li>
				<li><a href="javascript:;" role="button">2013년 12월 21일</a></li>
				<li><a href="javascript:;" role="button">2010년 11월 20일</a></li>
				<li><a href="javascript:;" role="button">2007년 11월 01일</a></li>
			</ul>
		</div>
		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
</body>
</html>
