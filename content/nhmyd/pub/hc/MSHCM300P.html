$(function(){
	slidePopConfirm();

<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 건강검진 연결 동의 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner">
		<h1>건강검진 연결 동의</h1>
		<div class="popCont">
			<div class="formWrap selectAll mt0 pt0">
				<div class="total">
					<div class="formHolder check">
						<input type="checkbox" id="type_all01" checked class="chekTypeOther">
						<label class="check" for="type_all01">전체동의</label>
					</div>
				</div>
				<div class="cont">
					<div class="formHolder check">
						<input type="checkbox" id="type01" checked>
						<label class="check" for="type01">[필수] 개인(신용)정보 수집·이용 동의</label>
						<a href="javascript:;" class="btnView" role="button" title="[필수] 개인(신용)정보 수집·이용 동의"><span class="blind">약관보기</span></a>
					</div>
					<div class="formHolder check">
						<input type="checkbox" id="type02" checked>
						<label class="check" for="type02">[필수] 건강iN 검진현황서비스 사용자 연동 이용 동의서
							<span class="subTxt2">이용약관 동의</span>
							<span class="subTxt2">건강iN 서비스 제공을 위한 개인정보 수집·이용 동의</span>
							<span class="subTxt2">건강iN 서비스 제공을 위한 민감정보 수집·이용 동의</span>
						</label>
						<a href="javascript:;" class="btnView" role="button"><span class="blind">약관보기</span></a>
					</div>
					<div class="formHolder check">
						<input type="checkbox" id="type03" checked class="chekTypeOther">
						<label class="check" for="type03">[선택] 개인(신용)정보 수집·이용 동의(상품 서비스 안내 등)</label>
						<a href="javascript:;" class="btnView" role="button" title="[필수] 개인(신용)정보 수집·이용 동의(상품 서비스 안내 등)"><span class="blind">약관보기</span></a>
					</div>
				</div>
			</div>
		</div>
		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">다음</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
</body>
