<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">

<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">

<meta http-equiv="Expires" content="-1">
<title>[P] 검색</title>
<script src="../pub-assets/js/head.js"></script>
<script>
	$(document).ready(function () {
		fullLayerPop();
	})
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 검색 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap fullLayerPop">
	<div class="popInner">
		<h1>검색</h1>
		<div class="popCont">
			<!-- -------------------------------------- -->
			<!-- [SECTION] 검색어입력 -->
			<!-- -------------------------------------- -->
			<div class="addrSrch">
				<div class="formWrap mt40">
					<ul>
						<li>
							<div class="inputList"> <!-- [D] 검색 오류일 경우 error on 추가 -->
								<input type="text" title="검색어" placeholder="검색어를 입력해주세요.">
								<a href="javascript:" class="btnReset" role="button">입력내용삭제</a>
								<button class="btnSearch"><span class="blind">찾기</span></button>
							</div>
							<p class="errorTxt" style="display:none;">검색어를 2자이상 입력해 주세요.</p>
						</li>
					</ul>
				</div>
			</div>

			<!-- -------------------------------------- -->
			<!-- [SECTION] 추천 검색어 -->
			<!-- -------------------------------------- -->
			<h2 class="totalCntTit">추천 검색어</h2>
			<div class="srchResult typeNor">
				<ul>
					<li>
						<a href="javascript:;" role="button">
							<span class="name">식품</span>
						</a>
					</li>
					<li>
						<a href="javascript:;" role="button">
							<span class="name">비만</span>
						</a>
					</li>
					<li>
						<a href="javascript:;" role="button">
							<span class="name">피부</span>
						</a>
					</li>
					<li>
						<a href="javascript:;" role="button">
							<span class="name">정신건강</span>
						</a>
					</li>
					<li>
						<a href="javascript:;" role="button">
							<span class="name">치아건강</span>
						</a>
					</li>
					<li>
						
						<a href="javascript:;" role="button">
							<span class="name">수면건강</span>
						</a>
					</li>
					<li>
						<a href="javascript:;" role="button">
							<span class="name">기타</span>
						</a>
					</li>
				</ul>
			</div>
			<!-- -------------------------------------- -->
		</div>
		<div class="popBtnWrap">
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
</body>
</html>
