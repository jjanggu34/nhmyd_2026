<!doctype html>
<html lang="ko">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">

<script>
	$(document).ready(function () {
		//tostpop();//토스트 팝업 호출 
	})

	function tostpop(){
		var $tostCont = '<div class="tostpopupWrap" aria-live="assertive"><div class="tostMsg">업데이트를 완료했습니다.</div></div>'
		$('.container').after($tostCont);
		setTimeout(function(){
			$('.tostpopupWrap').remove();
		},4000)
	}
</script>

<body>
<!-- wrapper -->
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1>병원방문내역</h1>
		<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
		<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a>
	</div>
	<!-- //header -->
	<!-- container -->
	<div class="container">
        <div class="boxTypeWrap">
			<div class="emptyMain">
				<h2 class="defTit"><strong>김농협</strong>님의 <strong>진료 내역이 없어요</strong>
                    <div class="tooltipWrap">
                        <button type="button" class="toolTipBtn" onclick="tooltipOpen($(this))"><span class="blind">조회 기준 안내 툴팁 열기</span></button><!-- [접근성_2024]  대체텍스트가 부적절하게 제공된 컨트롤 : 텍스트 변경 -->
                        <div class="tooltipCont">
                            <p>진료받은 내용은 조회한 날을 기준으로 최근 12개월 진료분을 확인할 수 있습니다.</p>
                            <button type="button" class="close" onclick="tooltipClose($(this))"><span class="blind">툴팁 닫기</span></button>
                        </div>
                    </div>
                </h2>
                <p>가족의 진료확인 서류를 소지하셨다면<br>대신 보험 청구가 가능합니다.</p> <!-- [2023-03-13] 문구 수정 -->
				<div class="imgBg02">
					<span class="blind">이미지</span>
				</div>
			</div>
		</div>
        <div class="areaBtnDefault">
            <a href="javascript:;" class="btnPressPoint" role="button">피보험자 보험청구하기</a>
