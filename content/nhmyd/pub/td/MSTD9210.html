	<script>
		function tdSwipe(){
			var swiper = new Swiper('.areaImg1.trend_areaImg1 .swiper-container', {
				slidesPerView: '1',
				spaceBetween: 12,
				centeredSlides: true,
				observer: true,
				observeParents: true,
				pagination: {
					el: '.swiper-pagination',
					type: 'fraction',
				},
				navigation: {
					nextEl: '.swiper-button-next',
					prevEl: '.swiper-button-prev',
				},
				observer: true,
				observeParents: true,
				on: {
					init: function () {
						$('.areaImg1.trend_areaImg1 .swiper-slide').attr('aria-hidden', 'true');
						$('.areaImg1.trend_areaImg1 .swiper-slide-active').attr('aria-hidden', 'false');
					},
					slideChangeTransitionEnd: function (index) {
						$('.areaImg1.trend_areaImg1 .swiper-slide').attr('aria-hidden', 'true');
						$('.areaImg1.trend_areaImg1 .swiper-slide-active').attr('aria-hidden', 'false');
						$('.swiper-slide').removeClass('active');

						if (!$('.swiper-slide').eq(this.activeIndex).hasClass('once')) {
							$('.swiper-slide').eq(this.activeIndex).addClass('active');
						} else if ($('.swiper-slide').hasClass('slideR3')) {
							$('.swiper-slide').eq(this.activeIndex).addClass('once');
						}
					},
				},
			});
		}
		tdSwipe()

		$('.enentBtn').on('click', function () {
			tdSwipe();
		})
