		</div>

		<!-- -------------------------------------- -->

		<!-- -------------------------------------- -->

<!-- ###################################### -->
<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script type="text/javascript">
	$(window).on('load', function(){
		setTimeout(function(){
			//[샘플] 탭버튼을 라디오버튼으로 변경함 : 탭버튼의 구조가 아닌 소팅 기능으로 변경
			$('.scAreaWrap ul, .scAreaWrap ul li').removeAttr('role');
			$('.scAreaWrap ul a').removeAttr('aria-selected').attr({'role':'radio','aria-checked':'false'});
			$('.scAreaWrap ul a.active').attr('aria-checked','true');
		},100);

		//[샘플] 클릭이벤트 재정의
		$(document).off('click', '.tabWrap a').on('click', '.tabWrap a', function() {
			var _parents = $(this).closest('.scAreaWrap');
			var _val = $(this).data('value');
			_parents.find('a').attr('aria-checked','false');
			$(this).attr('aria-checked','true');
			if(_val == 'all'){
				$('.thumbList li').show();
				$('.tabCont01 > p').text('총 3건');
			}else{
				$('.thumbList li').hide().eq(_val).show();
				$('.tabCont01 > p').text('총 1건');
			}
		});
	});

</script>
<!-- ###################################### -->
</body>
</html>
