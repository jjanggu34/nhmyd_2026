<div class="nhasset popWrap fullLayerPop">
	<div class="popInner">
		<h1>미납확인 서비스</h1>
		<div class="popCont">
			<div class="housingNoti">
				<div class="defTit addImg">고객님의 주택청약계좌에<br>최근 2개월 이상 입금내역이 없습니다.
					<p class="subTxt fwN">주택청약에 유리한 조건을 만들기 위해서 매월 1회차,10만원 납입을 권장해드리고 있습니다.</p>
				</div>
				<p class="subTxt">다음과 같은 이유로 자동이체가 되지 않을 수 있습니다.</p>
				<div class="grayBox2">
					<ul class="listBul disc">
						<li>출금계좌의 잔액 부족</li>
						<li>가입시 설정한 세금우대한도까지 잔액이 가득 찬 경우</li>
						<li>해당 계좌에 청약 당첨 이력이 있는 경우</li>
					</ul>
				</div>
				<p class="txtSmGray3 mt25">자세한 상담을 원하시는 경우 가까운 농협은행 영업점 내방 혹은 농협은행 고객행복센터 (1661-3000)으로 문의 주시기 바랍니다.</p>
			</div>
		</div>

		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
