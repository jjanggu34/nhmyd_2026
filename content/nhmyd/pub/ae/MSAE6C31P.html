<!-- ###################################### -->
<!-- ### [팝업] 장기주택 저당 차입금 (2012년 이후) ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner">
		<h1 class="le05">장기주택 저당 차입금 (2012년 이후)</h1>
		<div class="popCont">
			<div class="yapopArea">
				<div class="boxRadio">
					<div class="boxRadioInn">
						<span>
							<input name="rdo01" id="rdo01" type="radio" aria-label="고정금리" checked>
							<label for="rdo01" aria-hidden="true">고정금리</label>
						</span>
					</div>
					<div class="boxRadioInn">
						<span>
							<input name="rdo01" id="rdo02" type="radio" aria-label="기타">
							<label for="rdo02" aria-hidden="true">기타</label>
						</span>
					</div>
				</div>
				<div class="formWrap">
					<ul>
						<li>
							<strong class="formTit">차입금</strong>
							<div class="inputList unitMan2">
								<input type="text" title="차입금 입력" value="1,000,000" placeholder=""> 
								<span class="unit">원</span>
								<a href="javascript:" class="btnReset" role="button" style="display: none;">입력내용삭제</a>
							</div>
							 <p class="errorTxt" style="display:none;">30부터 9,999만원까지 입력 가능합니다.</p> 
						</li>
					</ul>
				</div>
			</div>
		</div>
		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
