<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">
<meta name="author" content="">
<meta name="content" content="">
<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>연소득금액 입력 | DSR 계산기 | 금융자산분석</title>
<script type="text/javascript" src="../pub-assets/js/head.js"></script>
</head>
<body>
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1>DSR 계산기</h1>
		<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
		<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a>
	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] 연소득금액 입력 ### -->
	<!-- ###################################### -->
	<div class="container">
		<h2 class="defTit">
			<strong>DSR 계산</strong>을 위해<br>
			<strong>소득정보</strong>를 입력해주세요
		</h2>

		<!-- -------------------------------------- -->
		<!-- [입력영역] -->
		<!-- -------------------------------------- -->
		<div class="formWrap boxTypeWrap">
			<div class="yeartexForm">
				<div class="formTit disInline flex">
					<strong>연 소득금액</strong> 
					<div class="tooltipWrap">
						<button type="button" class="toolTipBtn" onclick="tooltipOpen($(this))"><span class="blind">연 소득금액 조회 기준 안내 툴팁 열기</span></button><!-- [접근성_2024]  대체텍스트가 부적절하게 제공된 컨트롤 : 텍스트 변경 -->
						<div class="tooltipCont">
							<p>총 소득금액은 수집된 건강보험료 조회 기준으로 3개월 평균 월액을 기준으로 추정된 금액으로 실제와 다를 수 있습니다.</p>
							<button type="button" class="close" onclick="tooltipClose($(this))"><span class="blind">툴팁 닫기</span></button>
						</div>
					</div>
					<button type="button" class="contBtn02">불러오기</button>
				</div>
				<p class="addtxt">(1억원)</p>
				<div class="inputList">
					<input type="tel" title="올해의 연봉" value="100,000,000" placeholder="연 소득금액 입력">
					<span class="unit">원</span>
					<a href="javascript:" class="btnReset" role="button">입력내용삭제</a>
				</div>
				<div class="roundBtnWrap">
					<a href="javascript:;" role="button" title="10만원 추가">+10만</a>
					<a href="javascript:;" role="button" title="50만원 추가">+50만</a>
					<a href="javascript:;" role="button" title="100만원 추가">+100만</a>
					<a href="javascript:;" role="button" title="1000만원 추가">+1,000만</a>
				</div>
				<p class="errorTxt" style="display:none;">1원 이상 입력해주세요</p>
			</div>
		</div>

		<!-- -------------------------------------- -->
		<!-- [하단영역] -->
		<!-- -------------------------------------- -->
		<div class="areaBtnDefault">
			<a href="javascript:;" class="btnPressDefault" role="button">취소</a>
			<a href="javascript:;" class="btnPressPoint" role="button">다음</a>
		</div>
		<!-- -------------------------------------- -->
	</div>
	<!-- ###################################### -->
</div>
</body>
</html>
