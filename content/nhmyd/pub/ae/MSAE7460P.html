		fullLayerPop();

<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 미납확인 서비스(미등록자) ### -->
<!-- ###################################### -->
<div class="nhasset popWrap fullLayerPop">
	<div class="popInner">
		<h1>미납확인 서비스</h1>
		<div class="popCont">
			<div class="housingNoti">
				<div class="defTit">고객님의 주택청약계좌에<br>최근 2개월 이상 입금내역이 없습니다.
					<p class="subTxt fwN">주택청약에 유리한 조건을 만들기 위해서 매월 1회차,10만원 납입을 권장해드리고 있습니다.</p>
				</div>
				<div class="wrapTblDefault">
					<ul class="listBul disc mb10">
						<li>회차별 최대 납입인정금액은 10만원입니다.</li>
					</ul>
					<table class="thCenter">
						<caption>미납 납입인정금액 안내표(납입금액, 납입인정금액의 정보가 있음)</caption>
						<colgroup>
							<col width="50%">
							<col width="*">
						</colgroup>
						<thead>
							<tr>
								<th scope="col">납입 금액</th>
								<th scope="col">납입인정금액</th>
							</tr>
						</thead>
						<tbody>
							<tr>
								<td class="ac">2만원</td>
								<td class="ac">2만원</td>
							</tr>
							<tr>
								<td class="ac">10만원</td>
								<td class="ac">10만원</td>
							</tr>
							<tr>
								<td class="ac">15만원</td>
								<td class="ac">10만원</td>
							</tr>
						</tbody>
					</table>
				</div>
				<ul class="listBul disc mt10">
					<li>국민주택 신청 시, 가입기간, 납입회차, 회차별 인정금액이 순위 산정에 영향을 미칩니다.</li>
				</ul>
				<ul class="btnWrap">
					<li><a href="javascript:;" class="linkType3">즉시 이체</a></li>
					<Li><a href="javascript:;" class="linkType3">자동이체 신청</a></Li>
				</ul>
			</div>
		</div>

		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
