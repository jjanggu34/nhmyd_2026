<!-- ###################################### -->
<!-- ### [팝업] 저축 금액 선택 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopOption">
	<div class="dim"></div>
	<div class="popInner">
		<h1>저축 금액 선택</h1>
		<div class="popCont">
			<div class="formWrap msaeType">
				<div class="boxRadio rowType msaeType mt20">
					<ul class="pickList psHopeRdo">
						<li>
							<input type="radio" name="rdo01" id="rdo011" checked="checked" aria-label="매월 30만원" value="30">
							<label for="rdo011" class="rdoCheck" aria-hidden="true">매월 30만원</label>
						</li>
						<li>
							<input type="radio" name="rdo01" id="rdo012" aria-label="매월 50만원" value="50">
							<label for="rdo012" class="rdoCheck" aria-hidden="true">매월 50만원 </label>
						</li>
						<li>
							<input type="radio" name="rdo01" id="rdo013"  aria-label="매월 100만원" value="100">
							<label for="rdo013" class="rdoCheck" aria-hidden="true">매월 100만원 </label>
						</li>
						<li>
							<input type="radio" name="rdo01" id="rdo014"  aria-label="매월 200만원" value="200">
							<label for="rdo014" class="rdoCheck" aria-hidden="true">매월 200만원 </label>
						</li>
						<li class="inptType">
							<div class="inputList"> 
								<input type="tel" title="예상 저축금액" placeholder="직접입력">
								<a href="javascript:" class="btnReset" role="button" style="display: none;">입력내용삭제</a>
							</div>
						</li>
					</ul>
				</div>
			</div>
		</div>	
		
		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>

<!-- ###################################### -->
<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script>
	var iptActive = function(){
	var $inpT = "input[type='tel']";
	$(document)
		.on('blur, focusout', function(e) {
			// $(li > input[type='radio']).addClass('a');		
		})
		.on('focus, focusin',  function(e){
			$("li > input[type='radio']").prop("checked" , false);
		})
	} 

	iptActive();
</script>
