<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NH Bank">
<meta name="format-detection" content="telephone=no">
<link rel="shortcut icon" href="#">
<title>[P] PUSH안내_미납확인/신규청약</title>
<script type="text/javascript" src="../pub-assets/js/head.js"></script>
<script>
	$(function() {
		popCenter();
	});
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] PUSH안내_미납확인/신규청약 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap centerLayer">
	<div class="dim"></div>
	<div class="dimCloseArea" role="button" tabindex="0" onclick="popClose(this);return false;">터치 시 해당 창을 닫습니다.</div>

	<div class="popInner">
		<h1 class="ac"><img src="../../images/popTitle.png" alt="NH 스마트뱅킹"></h1>
		<div class="popCont">
			<div class="confirmMsg type02">
				<p>미납확인 서비스를 이용하기 위해서는<br>마이데이터 PUSH알림을 동의하셔야 합니다.</p>
				<p>신규 청약공고 알림을 이용하기 위해서는<br>마이데이터 PUSH알림을 동의하셔야 합니다.</p>
			</div>
		</div>

		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="" role="button">다음에</a>
				<a href="javascript:;" class="confirmBtn" role="button">PUSH알림 설정</a>
			</div>
		</div>
	</div>
</div>

<!-- ###################################### -->
<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script type="text/javascript">
	$(document).ready(function(){
		//샘플 : 케이스 화면 정의
		var a = ['미납확인(MSAE7410P)', '신규청약(MSAE7420P)']; // 케이스 명
		var b = ['MSAE7410P', 'MSAE7420P']; // 함수 명
		var num = a.length; // 케이스 수
		uiCaseMenu(a,b,num);
		uiCaseMSAE7410P();
	});

	//샘플 : 케이스 : 미납확인
	function uiCaseMSAE7410P(){
		$('.confirmMsg.type02 p').eq(0).show();
		$('.confirmMsg.type02 p').eq(1).hide();
	}

	//샘플 : 케이스 : 신규청약
	function uiCaseMSAE7420P(){
		$('.confirmMsg.type02 p').eq(0).hide();
		$('.confirmMsg.type02 p').eq(1).show();
	}
</script>
<!-- ###################################### -->
</body>
</html>
