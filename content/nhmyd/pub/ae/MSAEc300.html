<title>STEP3. 로딩 화면 | 신용점수 올리기 | 신용관리 | 금융자산분석</title>
<script src="../pub-assets/js/head.js"></script>
</head>
<body>
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1>신용점수 올리기</h1>
		<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
		<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a>
	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] 신용점수 올리기  로딩 ### -->
	<!-- ###################################### -->
	<div class="container">
		<div class="assetLoadingWrap type03">
			<div class="title">NICE에 정보 제출하고<br>신용점수 올리는 중</div>
			<p class="subTxt2 mt10">앱을 종료하지 말고 기다려 주세요.</p>
			<div class="assetLoadingValue">
				<span><strong>100.00</strong>% 완료</span>
			</div>
		</div>
	</div>
	<!-- ###################################### -->
</div>

<!-- ###################################### -->
<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script type="text/javascript">
	//동적 컨텐츠일 경우 : uiSetLottie(); 호출 //애니메이션 적용

	$(document).ready(function() {
		myCarCost();
	});
	function myCarCost() {
		var $thisCost = $('.assetLoadingValue strong');
		var memberCountContText = $thisCost.text()
		$({ val : 0}).animate({ val : memberCountContText}, {
			duration: 1500,//애니메이션 시간
			step: function(){
				var num = numberWithCommas(Math.floor(this.val));
				$thisCost.text(num);
			},
			complete: function(){
				var num = numberWithCommas(Math.floor(this.val));
				$thisCost.text(num);
			}
		});
		function numberWithCommas(x){
			return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
		}
	}
</script>
<!-- ###################################### -->
</body>
</html>
