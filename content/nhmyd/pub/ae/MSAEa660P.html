<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">

<title>[P] 다른 사람 선택</title>
<script src="../pub-assets/js/head.js"></script>
<script>
	$(document).ready(function(){
		slidePopOption();
	})
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 다른 사람 선택 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopOption">
	<div class="dim"></div>
	<div class="popInner">
		<h1>다른 사람 선택</h1>
		<div class="popCont">
			<div class="formWrap formListBox03">
				<div class="formBoxTit">
					나의 씀씀이를 비교하고 싶은 그룹의<br>
					성별과 소득을 선택해주세요.
				</div>
				<ul>
					<li>
						<strong class="formTit">성별</strong>
						<div class="boxRadio">
							<div class="boxRadioInn">
								<span>
									<input name="rdo14" id="rdo40" type="radio" aria-label="성별(20대 남자)" checked="checked">
									<label for="rdo40" aria-hidden="true">20대 남자</label>
								</span>
							</div>
							<div class="boxRadioInn">
								<span>
									<input name="rdo14" id="rdo41" type="radio" aria-label="성별(20대 여자)">
									<label for="rdo41" aria-hidden="true">20대 여자</label>
								</span>
							</div>
							<div class="boxRadioInn">
								<span>
									<input name="rdo14" id="rdo42" type="radio" aria-label="성별(20대 전체)">
									<label for="rdo42" aria-hidden="true">20대 전체</label>
								</span>
							</div>
						</div>
					</li>
					<li>
						<strong class="formTit">월 소득</strong>
						<div class="boxRadio">
							<div class="boxRadioInn">
								<span>
									<input name="rdo13" id="rdo30" type="radio" aria-label="월 소득(150만원 미만)" checked="checked">
									<label for="rdo30" aria-hidden="true">150만원 미만</label>
								</span>
							</div>
							<div class="boxRadioInn">
								<span>
									<input name="rdo13" id="rdo31" type="radio" aria-label="월 소득(150~300만원)">
									<label for="rdo31" aria-hidden="true">150~300만원 </label>
								</span>
							</div>
							<div class="boxRadioInn">
								<span>
									<input name="rdo13" id="rdo32" type="radio" aria-label="월 소득(300~500만원)">
									<label for="rdo32" aria-hidden="true">300~500만원</label>
								</span>
							</div>
							<div class="boxRadioInn">
								<span>
									<input name="rdo13" id="rdo33" type="radio" aria-label="월 소득(500~800만원)">
									<label for="rdo33" aria-hidden="true">500~800만원 </label>
								</span>
							</div>
							<div class="boxRadioInn">
								<span>
									<input name="rdo13" id="rdo34" type="radio" aria-label="월 소득(800~1000만원)">
									<label for="rdo34" aria-hidden="true">800~1000만원</label>
								</span>
							</div>
							<div class="boxRadioInn">
								<span>
									<input name="rdo13" id="rdo35" type="radio" aria-label="월 소득(1000만원 이상)">
									<label for="rdo35" aria-hidden="true">1000만원 이상 </label>
								</span>
							</div>
						</div>
						<div class="mes2">선택하신 월 소득은 ‘카드리포트 또래비교’에도 반영됩니다.</div>
					</li>
				</ul>
			</div>
		</div>

		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다."><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>

	</div>
</div>
<!-- ###################################### -->
</body>
</html>
