<script type="text/javascript">
	function popup(){
		var _html; 
		_html = '<div class="nhasset popWrap fullLayerPop">',
		_html += '<div class="popInner">',
		_html += '<div class="popCont">',
		_html += '<div class="assetLoadingWrap type03">',
		_html += '	<div class="title">NICE에 정보 제출하고<br>신용점수 올리는 중</div>',
		_html += '	<p class="subTxt2 mt10">앱을 종료하지 말고 기다려 주세요.</p>',
		_html += '	<div class="assetLoadingValue">',
		_html += '		<span><strong>100.00</strong>% 완료</span>',
		_html += '	</div>',
		_html += '</div>',
		_html += '</div>',
		_html += '</div>',
		_html += '</div>'

		$('body').append(_html);
		fullLayerPop();
		uiSetLottie(); //동적 컨테츠일 경우 함수 호출
		myCarCost();
	}
	function myCarCost() {
		var $thisCost = $('.assetLoadingValue strong');
		var memberCountContText = $thisCost.text()//.replace(/,/g,'');
		$({ val : 0}).animate({ val : memberCountContText}, {
			duration: 1500,//애니메이션 시간
			step: function(){
				var num = numberWithCommas(Math.floor(this.val));
				//var num = numberWithCommas(this.val.toFixed(2));
				$thisCost.text(num);
			},
			complete: function(){
				var num = numberWithCommas(Math.floor(this.val));
				//var num = numberWithCommas(this.val.toFixed(2));
				$thisCost.text(num);
			}
		});
		function numberWithCommas(x){
			return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
		}
	}
</script>

</body>
