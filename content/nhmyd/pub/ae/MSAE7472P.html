	</script>

<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 부양가족 선택 ### -->

<div class="nhasset popWrap slidePopOption">
	<div class="dim"></div>
	<div class="popInner">
		<h1>부양가족 선택</h1>
		<div class="popCont">
			<ul class="selectList">
				<li class="active"><a href="javascript:;" title="선택됨">0명 (5점)</a></li>
				<li><a href="javascript:;">1명 (10점)</a></li>
				<li><a href="javascript:;">2명 (15점)</a></li>
				<li><a href="javascript:;">3명 (20점)</a></li>
				<li><a href="javascript:;">6명 이상 (35점)</a></li>
			</ul>
		</div>

		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
