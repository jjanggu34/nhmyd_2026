<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">

<body>
<!-- wrapper -->
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1>지난 연말정산 확인</h1>
		<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
		<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a>
	</div>
	<!-- //header -->
	<!-- container -->
	<div class="container">
		<div class="imitationBg">
			<span class="blind">정산 결과 확인</span>
        </div>
        <!-- 2023-11-17 수정 -->
        <!-- 환급금이 없을 때-->
        <h2 class="defTit mt0 txtC"><strong>$스크래핑년도$</strong> 13월의 월급은<br> 돌려받은 금액이 없어요.</h2>
        <!-- // 2023-11-17 수정 -->

		<div class="boxTypeWrap">

			<ul class="detailList garphitemWrap mt0"> <!--08.18 mt0 추가-->
				<li class="item pt0 pb10">
					<span class="tit">총 급여</span>
					<span class="dataValue value">69,999,999<em class="won">원</em></span>
				</li>
				<li class="item pt0 pb10">
					<span class="tit">결정세액</span>
					<span class="dataValue value"><strong class="dataValue">150,000</strong><em class="won">원</em></span>
				</li>
				<li class=" pt0 pb10">
					<span class="tit">납부세액</span>
					<span class="dataValue value"><strong class="dataValue">150,000</strong><em class="won">원</em></span>
				</li>
			</ul>

			<div class="grayBox yaType"><!--08.26 타이틀 및 class 수정-->
				<span class="statusTit">환급액</span>
				<span class="dataValue statusVal pointColor">11,970,000<em class="won">원 환급</em></span>
			</div>
			<div class="ar">
				<a href="javascript:;" class="linkTxt">상세보기</a>
			</div>
		</div>
        <!-- 2023-11-17 추가 -->
        <div class="yatexbtnWrap mt20"><!--2022-11-17 버튼 추가-->
            <a href="javascript:;" class="setBtn" title="연말정산 최신정보 불러오기" aria-haspopup="true">최신정보 불러오기</a>
        </div>
        <!-- // 2023-11-17 추가 -->
		
	
		<div class="areaBtnDefault">
			<a href="javascript:;" class="btnPressPoint" role="button">닫기</a>
		</div>
