<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script>
	$(document).ready(function(){
		$('[type="checkbox"]').each(function(i,obj){
			if($(obj).prop('checked')) uiSelCityAdd(obj)
		}).on('change',function(){
			if($(this).prop('checked')) uiSelCityAdd(this);
			else uiSelCityDel($(this).attr('id'));
		});

		$(document).on('click.city','.areaWordList a', function(){
			$('#' + $(this).data('name')).trigger('click');
		});
	});

	//선택한 지역
	function uiSelCityAdd(el){
		var _txt = $(el).next('label').text();
		var _id = $(el).attr('id');
		$('.areaWordList').append('<a href="javascript:;" role="button" class="areaTagBtn" data-name="'+_id+'"><span class="tag">#'+_txt+'</span></a>');
		heightChk();
	}

	//삭제한 지역
	function uiSelCityDel(el){
		$('.areaWordList a[data-name="'+ el +'"]').remove();
		heightChk();
	}

	//선택한 지역이 노출될 경우 상단영역 padding값 변경
	function heightChk(){
		var $topHeight = $(".nhasset .areaTopCont").height();
		$(".nhasset .areaTabWrap").css('padding-top',$topHeight);
	};
</script>
