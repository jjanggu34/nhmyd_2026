	$(document).ready(function(){
		slidePopConfirm();
	})
</script>

<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 마이데이터 제출정보상세 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner">
		<h1>마이데이터 제출정보상세</h1>
		<div class="popCont">
			<div class="tblData1">
				<table>
					<caption>마이데이터 제출정보상세(업권 구분, 변경 가능 정보)</caption>
					<colgroup>
						<col style="width:40%">
						<col style="width:60%">
					</colgroup>
					<thead>
						<tr>
							<th scope="col">업권 구분</th>
							<th scope="col">반영 가능 정보</th>
						</tr>
					</thead>
					<tbody>
						<tr>
							<td>은행</td>
							<td>계좌구분코드, 계좌상태코드, 저축방법코드, 현재잔액</td>
						</tr>
						<tr>
							<td>증권(금융투자)</td>
							<td>계좌종류코드, 납부총액, 기출금액</td>
						</tr>
						<tr>
							<td>보험</td>
							<td>보험종류구분코드, 계약상태, 만기일자, 보험가입금액, 납입기간구분코드, 납입주기코드, 총납입횟수</td>
						</tr>
						<tr>
							<td>통신</td>
							<td>통신비 납부정보, 통신비 납부년월, 통신비 납부 금액</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

		<div class="popBtnWrap">
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
</body>
</html>
