<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<title>[P] 희망 생활비 선택</title>
<script src="../pub-assets/js/head.js"></script>
<script>
$(document).ready(function(){
	slidePopOption();
})
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 희망 생활비 선택 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopOption">
	<div class="dim"></div>
	<div class="popInner">
		<h1>희망 생활비 선택</h1>
		<div class="popCont">
			<div class="formWrap msaeType">
				<p class="msaeTxtType02">개인 적정 노후생활비는 월 167만원 입니다.<br>
					<span class="addTxt">국민연금관리공단 및 통계청 가계동향조사 기준</span>
				</p>
				<div class="boxRadio rowType msaeType mt20">
					<ul class="pickList psHopeRdo">
						<li>
							<input type="radio" name="rdo01" id="rdo011" checked aria-label="절약하며 118만원">
							<label for="rdo011" class="rdoCheck" aria-hidden="true"><span>절약하며 </span><span class="value">118만원</span></label>
						</li>
						<li>
							<input type="radio" name="rdo01" id="rdo012" aria-label="적정하게 167만원">
							<label for="rdo012" class="rdoCheck" aria-hidden="true"><span>적정하게 </span><span class="value">167만원</span></label>
						</li>
						<li>
							<input type="radio" name="rdo01" id="rdo013" aria-label="여유롭게 329만원">
							<label for="rdo013" class="rdoCheck" aria-hidden="true"> <span>여유롭게 </span><span class="value">329만원</span> </label>
						</li>
						<li class="inptType">
							<div class="inputList unitMan">
								<input type="tel" placeholder="직접입력" aria-label="희망생활비 직접입력">
								<a href="javascript:" class="btnReset" role="button" style="display: none;">입력내용삭제</a>
							</div>
						</li>
					</ul>
				</div>
			</div>
		</div>

		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="" onclick="popClose(this);return false;" role="button">취소</a>
				<a href="javascript:;" class="confirmBtn disabled" aria-disabled="true" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>

<!-- ###################################### -->
<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script>
	var iptActive = function(){
		var $inpT = "input[type='tel']";
		$(document)
		.on('blur, focusout', function(e) {
			// $(li > input[type='radio']).addClass('a');
		})
		.on('focus, focusin',  function(e){
			$("li > input[type='radio']").prop("checked" , false);
		})
	}
	iptActive();

	//[샘플] 확인버튼 활성화
	//[접근성이슈] 레이어팝업 오픈시 : 처음 선택된 값을 재 선택 했을 경우 확인 버튼 비활성화
	var _preId = $('[name="rdo01"]:checked').attr('id');
	var _preInput = $('[type="tel"]').val();
	$('[name="rdo01"]').on('change',function(){
		var _id = $(this).attr('id');
		if(_id != _preId) $('.confirmBtn').removeClass('disabled').removeAttr('aria-disabled');
		else $('.confirmBtn').addClass('disabled').attr('aria-disabled',true);
		if($('[type="tel"]').closest('.inputList').hasClass('on')) $('[type="tel"]').closest('.inputList').removeClass('on');
	});
	if(_preInput != '') $('[type="tel"]').closest('.inputList').addClass('on');
	$('input[type="tel"]').on('focus input',function(){
		if($(this).val() != _preInput) $('.confirmBtn').removeClass('disabled').removeAttr('aria-disabled');
		else $('.confirmBtn').addClass('disabled').attr('aria-disabled',true);
	});
</script>
<!-- ###################################### -->
</body>
</html>
