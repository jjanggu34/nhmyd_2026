<title>[P] 여유자금 선택</title>
<script src="../pub-assets/js/head.js"></script>
<script>
	$(document).ready(function(){
		slidePopConfirm();
	})  
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 여유자금 선택 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner">
		<h1>여유자금 선택</h1>
		<div class="popCont">
			<div class="formWrap msaeType">
				<!-- [MD2509_107] 조기은퇴진단 공적연금적립액 및 저축금액 안내 개선 텍스트 수정 -->
				<p class="msaeTxtType">여유자금이란 비상상황 발생 시 바로 현금화 할 수 있는 ‘유동성 자산’을 의미합니다. 나의 여유자금에 포함할 자산을 선택하세요.</p>
				<div class="boxRadio rowType msaeType mt20">
					<ul class="pickList">
						<li>	
							<input type="checkbox" name="rdo01" id="rdo011" checked="checked" aria-label="입출금 (마이너스 대출은 제외)">	
							<label for="rdo011" class="rdoCheck" aria-hidden="true">입출금 (마이너스 대출은 제외)</label>
						</li>
						<li>	
							<input type="checkbox" name="rdo01" id="rdo012" checked="checked" aria-label="예적금">	
							<label for="rdo012" class="rdoCheck" aria-hidden="true"> 예적금 </label>
						</li>
						<li>	
							<input type="checkbox" name="rdo01" id="rdo013"  aria-label="투자">	
							<label for="rdo013" class="rdoCheck" aria-hidden="true"> 투자 </label>
						</li>
					</ul>
				</div>
			</div>
		</div>	
		
		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
</body>
</html>
