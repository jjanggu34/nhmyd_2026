<!-- ### [팝업] 주소검색 ### -->

<div class="nhasset popWrap fullLayerPop">
	<div class="popInner">
		<h1>주소검색</h1>
		<div class="popCont grayPop">
			<div class="formWrap">
				<div class="boxTypeWrap mt0">
					<div class="titListBox">
						<ul>
							<li class="addrSrch">
								<div class="formTitN"><strong>주소를 검색해주세요.</strong></div>
								<div class="inputList">
									<input type="text" title="지역명+단지명 또는 지번주소 입력" placeholder="지역명+단지명 또는 지번주소 입력">
									<a href="javascript:" class="btnReset" role="button" style="display: none;">입력내용삭제</a>
									<button class="btnSearch"><span class="blind">찾기</span></button>
								</div>
								<div class="infoGrayBox">
									오피스텔은 주택분 재산세 과세대상으로 가정하여 재산세 및 종합부동산세가 계산됩니다.
								</div>
								<hr class="divLine3" aria-hidden="true">
							</li>
							<!-- [D] 주소 검색 결과-->
							<li>
								<a href="javascript:;" class="btnAddress" role="button">의왕시 포일동 인덕원푸르지오엘센트로</a>
								<a href="javascript:;" class="btnAddress" role="button">의왕시 포일동 인덕원푸르지오엘센트로</a>
							</li>
							<!-- [D] 세부주소 선택 : 주소 검색 결과 버튼 클릭시 노출 -->
							<li>
								<div class="formTitN"><strong>세부주소 선택</strong></div>
								<div class="grayBox mb0">
									<ul>
										<li>
											<div class="formTitN"><strong>단지</strong></div>
											<div class="inputList">
												<a href="javascript:;" title="단지" aria-haspopup="true" onclick="slidePopOption();return false;">
													<span class="selectValue">선택</span>
													<span class="selectBtn"></span>
												</a>
												<select name="" title="선택해주세요">
													<option></option>
												</select>
											</div>
										</li>
										<li class="mt20">
											<div class="formTitN"><strong>동</strong></div>
											<div class="inputList">
												<a href="javascript:;" title="동" aria-haspopup="true" onclick="slidePopOption();return false;">
													<span class="selectValue">선택</span>
													<span class="selectBtn"></span>
												</a>
												<select name="" title="선택해주세요">
													<option></option>
												</select>
											</div>
										</li>
										<li class="mt20">
											<div class="formTitN"><strong>호</strong></div>
											<div class="inputList">
												<a href="javascript:;" title="호" aria-haspopup="true" onclick="slidePopOption();return false;">
													<span class="selectValue">선택</span>
													<span class="selectBtn"></span>
												</a>
												<select name="" title="선택해주세요">
													<option></option>
												</select>
											</div>
										</li>
									</ul>
								</div>
							</li>
							<!-- [D] 조회결과 : 세부주소 선택 후 노출 -->
							<li>
								<div class="formTitN"><strong>조회결과</strong></div>
								<div class="grayBox">
									<ul class="detailList">
										<li>
											<strong class="tit">면적</strong>
											<strong class="value">59.98㎡</strong>
										</li>
										<li>
											<strong class="tit">2021년 공시가격</strong>
											<strong class="value">192,000,000원</strong>
										</li>
										<li>
											<strong class="tit">2023년 공시가격</strong>
											<strong class="value">281,000,000원</strong>
										</li>
									</ul>
								</div>
							</li>
							<!-- // -->
						</ul>
					</div>
				</div>
			</div>
		</div>
		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
