				<h2>공공기관</h2>
				<ul class="yaInstList">
					<li>
						<span class="imgWrap"><img src="../../images/logos/Institution000.png" alt="" class="imgLogo"></span>

							<p class="tit">국민건강보험공단</p>

					</li>
					<li>

					</li>
				</ul>

		</div>

				<a href="javascript:;" class="" role="button">괜찮아요</a> 
				<a href="javascript:;" class="confirmBtn" role="button">연결하기</a>
			</div>
