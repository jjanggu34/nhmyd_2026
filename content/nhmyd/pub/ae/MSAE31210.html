<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">
<meta name="author" content="">
<meta name="content" content="">
<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>상담내용 입력(step 4) | 영업점방문상담신청 | VIP금융컨설팅 | 금융자산분석</title>
<script src="../pub-assets/js/head.js"></script>
</head>
<body>
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" role="button" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1>VIP 금융컨설팅</h1>
		<!-- [MD2509_104] 프로세스 진행 화면 헤더 영역 변경 -->
		<a href="javascript:;" role="button" class="btnCancle"><span class="blind">취소</span></a>
	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] 상담내용 입력 ### -->
	<!-- ###################################### -->
	<div class="container">
		<!-- -------------------------------------- -->
		<!-- [정보영역] 신청정보 -->
		<!-- -------------------------------------- -->
		<div class="boxTypeWrap">
			<div class="titWrap mt0">
				<h2 class="defSubTit1">신청정보입력</h2>
			</div>
			<ul class="detailList mt20 mb5">
				<li>
					<span class="tit">이름</span>
					<span class="value">김농협</span> 
				</li>
				<li>
					<span class="tit">투자성향등급</span>
					<span class="value">위험중립형(21.08.08 까지)</span>
				</li>
				<li>
					<span class="tit">상담 유형</span>
					<span class="value">$모바일 화상상담OR영업점방문$</span>
				</li>
				<li>
					<span class="tit">은퇴 희망나이</span>
					<span class="value">만 55세</span> 
				</li>
				<li>
					<span class="tit">휴대폰번호</span>
					<span class="value">휴대폰번호</span> 
				</li>
				<li>
					<span class="tit">신청영업점</span>
					<span class="value">본점영업부</span> 
				</li>
				<li>
					<span class="tit">상담희망일</span>
					<span class="value">2020년 09월 01일 10:00</span> 
				</li>
			</ul>	
		</div>

		<!-- -------------------------------------- -->
		<!-- [입력영역] 상담내용 -->
		<!-- -------------------------------------- -->
		<div class="boxTypeWrap">
			<div class="formWrap mt5">
				<ul>
					<li>
						<strong class="formTit">원하시는 상담 종류를 선택해주세요.</strong>
						<div class="boxRadio wrapType">
							<div class="boxRadioInn">
								<span>
									<input name="rdo13" id="rdo18" type="radio" aria-label="상담 종류(종합자산관리)">
									<label for="rdo18" aria-hidden="true">종합자산관리</label>
								</span>
							</div>
							<div class="boxRadioInn">
								<span>
									<input name="rdo13" id="rdo19" type="radio" aria-label="상담 종류(세무)">
									<label for="rdo19" aria-hidden="true">세무</label>
								</span>
							</div>
							<div class="boxRadioInn">
								<span>
									<input name="rdo13" id="rdo20" type="radio" aria-label="상담 종류(부동산)">
									<label for="rdo20" aria-hidden="true">부동산</label>
								</span>
							</div>
						</div>
					</li>
					<li class="borderTop mt25">
						<strong class="formTit mt25">상담내용</strong>
						<textarea title="상담내용" placeholder="상담 받을 내용을 입력해 주세요."></textarea>
						<p class="ar subTxt2">0/60</p>
					</li>
				</ul>
			</div>
		</div>

		<!-- -------------------------------------- -->
		<!-- [하단버튼] -->
		<!-- -------------------------------------- -->
		<div class="areaBtnDefault">
			<a href="javascript:;" class="btnPressDefault" role="button">이전</a>
			<a href="javascript:;" class="btnPressPoint disabled" aria-disabled="true" role="button">신청</a><!-- [D] 활성화시 disabled 삭제 / aria-disabled="true" 삭제  -->
		</div>
		<!-- -------------------------------------- -->
	</div>
	<!-- ###################################### -->
</div>
</body>
</html>
