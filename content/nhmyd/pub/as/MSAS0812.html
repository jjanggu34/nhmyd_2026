<body>
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" class="btnBack" role="button"><span class="blind">이전화면으로</span></a>
		<h1>지급신청</h1>
		<!-- [MD2509_104] 프로세스 진행 화면 헤더 영역 변경 -->
		<a href="javascript:;" role="button" class="btnCancle"><span class="blind">취소</span></a>
	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] STEP2) 휴면예금 유의사항 ### -->
	<!-- ###################################### -->
	<div class="container">
		<!-- -------------------------------------- -->
		<!-- [SECTION] 스텝 영역 -->
		<!-- -------------------------------------- -->
		<div class="infoStep1">
			<ol>
				<li> <!-- [D] 현재 스텝 li : aria-current="step" 노출 -->
					<i aria-hidden="true">1</i>
					<span>지급방법 선택</span>
				</li>
				<li aria-current="step">
					<i aria-hidden="true">2</i>
					<span>$휴면예금$ 유의사항</span>
				</li>
				<li>
					<i aria-hidden="true">3</i>
					<span>서비스 이용동의</span>
				</li>
			</ol>
		</div>

		<!-- -------------------------------------- -->
		<!-- [SECTION] $휴면예금$ 유의사항 STEP2 영역 -->
		<!-- -------------------------------------- -->
		<div class="boxTypeWrap t1">
			<h2 class="agr_title_info mt0">
				<strong>
					<span class="text-highlight-y"><span>$휴면예금$</span> 지급 신청시</span> 유의사항을 모두 확인해주세요.
				</strong>
			</h2>
			<!-- 유의사항 체크 checkCaution 클래스 추가 -->
			<div class="formWrapArea checkCaution">
				<div class="formWrap">
					<div class="tit">유의사항 체크</div>
					<div class="cont">
						<div class="formHolder check">
							<input type="checkbox" id="type01" class="chekTypeOther" />
							<label class="check" for="type01">지급이 완료된 이후 취소가 불가능합니다.</label>
						</div>
						<div class="formHolder check">
							<input type="checkbox" id="type02" class="chekTypeOther" />
							<label class="check" for="type02">원천징수세액을 차감한 금액이 지급되며, 세액 관련 세부사항은 해당 금융회사에서 상세하게 확인 하실 수 있습니다.</label>
						</div>
						<div class="formHolder check">
							<input type="checkbox" id="type03" class="chekTypeOther" />
							<label class="check" for="type03">전액을 이전시에만 지급신청이 가능합니다.</label>
						</div>
						<div class="formHolder check">
							<input type="checkbox" id="type04" class="chekTypeOther" />
							<label class="check" for="type04">입금 받으시는 계좌가 정상거래가 불가한 상태인 경우 휴면예금 지급이 취소될 수 있습니다.</label>
						</div>
						<div class="formHolder check">
							<input type="checkbox" id="type05" class="chekTypeOther" />
							<label class="check" for="type05">일부 이자∙세금 등이 반영되지 않은 금액으로 실지급금액과 다를 수 있습니다.</label>
						</div>
						<div class="formHolder check">
							<input type="checkbox" id="type06" class="chekTypeOther" />
							<label class="check" for="type06">압류 및 가압류 계좌로 지급신청 할 경우 해당 계좌로 입금된 잔고는 되찾으실 수 없습니다.</label>
						</div>
						<!-- [MD2504_052_v0.06] (서금원)휴면예금조회·지급서비스(2.0반영) 체크박스 추가 -->
						<div class="formHolder check">
							<input type="checkbox" id="type07" class="chekTypeOther" />
							<label class="check" for="type07">서민금융진흥원의 확인 절차에 따라 실제 지급까지 시간이 소요될 수 있으며, 지급이 완료되지 않는 경우에는 다음 영업일 영업시간 중 확인 절차 후 지급될 수 있습니다.</label>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- -------------------------------------- -->
		<!-- [SECTION] 하단버튼 -->
		<!-- -------------------------------------- -->
		<div class="areaBtnDefault">
			<a href="javascript:;" class="btnPressPoint" role="button">다음</a> <!-- [D] 비활성화 클래스명 (disabled) 및 aria-disabled="true" 추가 -->
		</div>
		<!-- -------------------------------------- -->
	</div>
	<!-- ###################################### -->
</div>

</html>
