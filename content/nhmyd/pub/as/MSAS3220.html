<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">
<meta name="author" content="">
<meta name="content" content="">
<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>카드대출상세(단기대출) | 자산현황(대출) | 자산</title>
<script src="../pub-assets/js/head.js"></script>
</head>
<body>
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1>카드대출 상세</h1>
		<a href="javascript:;" class="btnAcAdmin"><span class="blind">관리</span></a>
	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] 카드대출상세(단기대출) ### -->
	<!-- ###################################### -->
	<div class="container">
		<!-- -------------------------------------- -->
		<!-- [레이어팝업] 메세지 : 순자산 포함 안된 자산일 경우 노출 -->
		<!-- -------------------------------------- -->
		<div class="layerMsgWrap">
			<p>순자산 금액에 포함되지 않은 자산이에요.</p>
			<button type="button" class="layerMsgClose"><span class="blind">닫기</span></button>
		</div>

		<!-- -------------------------------------- -->
		<!-- [상단영역] 대출정보 -->
		<!-- -------------------------------------- -->
		<div class="boxWrapShadow">
			<!-- [대출기본내용] -->
			<div class="boxTypeWrap delShadow">
				<!-- // -->
				<div class="accTopInfo mt0">
					<h2 class="accName">
						별명 또는 상품명
						<img src="../../images/logos/AAAH0000.png" alt="우리카드" class="imgLogo">
					</h2>
					<dl class="totalBalance">
						<dt>대출잔액</dt>
						<dd><strong>1,000,000</strong>원</dd>
					</dl>
					<div class="etcInfo">
						금리 <strong class="dataValue">00.00</strong><em class="won">%</em>
					</div>
				</div>
				<!-- // -->

				<hr class="divLine">

				<!-- // -->
				<div class="accInfoDetail">
					<ul class="detailList">
						<li>
							<span class="tit">유형</span>
							<span class="value">
								카드대출&gt;단기대출
							</span>
						</li>
						<li>
							<span class="tit">상품명</span>
							<span class="value">상품명</span>
						</li>
					</ul>
				</div>
				<!-- // -->
			</div>

			<!-- [대출상세정보] -->
			<div class="moreInfoArea">
				<div class="moreInfoWrap toggleWrap">
					<div class="moreInfo toggleCont" style="display: none;">
						<hr class="divLine2" aria-hidden="true">
						<ul class="detailList">
							<li>
								<span class="tit">신청일자</span>
								<span class="value">2020.07.21</span>
							</li>
							<li>
								<span class="tit">이용금액</span>
								<span class="value"><strong class="dataValue">1,000,000</strong><em class="won">원</em></span>
							</li>
							<li>
								<span class="tit">결제예정일</span>
								<span class="value">YYYY.MM.DD</span>
							</li>
							<li>
								<span class="tit">자동이체기관</span>
								<span class="value">NH농협</span>
							</li>
							<li>
								<span class="tit">자동이체계좌</span>
								<span class="value">125485472258</span>
							</li>
						</ul>
					</div>
					<button type="button" class="moreOpenBtn toggleBtn"><span class="toggleTxt07">상세정보 보기</span></button>
				</div>
			</div>
			<!-- // -->
		</div>
		<!-- -------------------------------------- -->
	</div>
	<!-- ###################################### -->
</div>

<!-- ###################################### -->
<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script type="text/javascript">
	//[샘플] 레이어팝업 닫기 클릭 이벤트
	$('.layerMsgClose').click(function(){
		$(this).closest('.layerMsgWrap').hide();
	});
</script>
<!-- ###################################### -->
</body>
</html>
