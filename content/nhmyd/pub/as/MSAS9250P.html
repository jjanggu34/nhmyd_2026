<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">
<meta name="author" content="">
<meta name="content" content="">
<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>[P] 보유 현금 관리</title>
<script src="../pub-assets/js/head.js"></script>
<script>
	$(function(){
		fullLayerPop();
	})
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 보유 현금 관리 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap fullLayerPop">
	<div class="popInner">
		<h1>보유 현금 관리</h1>
		<div class="popCont">
			<!-- -------------------------------------- -->
			<!-- [입력영역] -->
			<!-- -------------------------------------- -->
			<div class="formWrap realAsset">
				<ul>
					<li>
						<strong class="formTit">명칭</strong>
						<div class="inputList">
							<input type="text" title="명칭" value="비상금" placeholder="명칭을 입력해주세요.">
							<a href="javascript:" class="btnReset" role="button">입력내용삭제</a>
						</div>
						<p class="errorTxt" style="display:none;">특수문자[!@#$*()-=|;:,./]만 입력 가능합니다.</p>
					</li>
					<li>
						<!-- [MD2502_011] 실물자산 영역 개선 및 현금 수기 자산 등록 기능 추가 텍스트 수정 -->
						<strong class="formTit">금액</strong>
						<div class="inputList unitMan">
							<input type="tel" title="금액" value="100" placeholder="금액을 입력해주세요.">
							<span class="unit">만원</span>
							<a href="javascript:" class="btnReset" role="button" style="display: inline;">입력내용삭제</a>
						</div>
						<div class="roundBtnWrap">
							<a href="javascript:;" role="button" title="10만원 추가">+10만</a>
							<a href="javascript:;" role="button" title="50만원 추가">+50만</a>
							<a href="javascript:;" role="button" title="100만원 추가">+100만</a>
							<a href="javascript:;" role="button" title="300만원 추가">+300만</a>
						</div>
						<p class="errorTxt" style="display:none;">1부터 9,999,999만원까지 입력 가능합니다.</p>
					</li>
				</ul>
			</div>

			<!-- -------------------------------------- -->
			<!-- [정보영역] -->
			<!-- -------------------------------------- -->
			<div class="grayBgLine mt30">
				<ul class="detailList">
					<li>
						<span class="tit">등록일</span>
						<span class="value">2020.07.31</span>
					</li>
				</ul>
			</div>
			<!-- -------------------------------------- -->
		</div>
		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="btnPressDefault" role="button">삭제</a> 
				<a href="javascript:;" class="confirmBtn" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
</body>
</html>
