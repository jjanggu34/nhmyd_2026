<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">
<meta name="author" content="">
<meta name="content" content="">
<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>원화 | 가상자산 상세(API연결) | 자산현황(가상자산) | 자산</title>
<script src="../pub-assets/js/head.js"></script>
</head>
<body>
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1>가상자산 상세</h1>
		<a href="javascript:;" class="btnAcAdmin"><span class="blind">관리</span></a>
	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] 가상자산 상세(API연결_원화) ### -->
	<!-- ###################################### -->
	<div class="container">
		<!-- -------------------------------------- -->
		<!-- [레이어팝업] 메세지 : 순자산 포함 안된 자산일 경우 노출 -->
		<!-- [D] 상세페이지내 공통으로 노출되는 메세지 영역으로 변경 -->
		<!-- -------------------------------------- -->
		<div class="layerMsgWrap">
			<p>순자산 금액에 포함되지 않은 자산이에요.</p>
			<button type="button" class="layerMsgClose"><span class="blind">닫기</span></button>
		</div>
		<!--  [D] 개발 소스에는 아무 기능이 없음
		<div class="layerMsgWrap">
			<p>내 가상자산을 확인해보세요!</p>
			<button type="button" class="layerMsgClose"><span class="blind">닫기</span></button>
		</div>
		-->

		<!-- -------------------------------------- -->
		<!-- [상단영역] 가상자산정보 -->
		<!-- -------------------------------------- -->
		<div class="boxWrapShadow">
			<!-- [가상자산 기본정보] -->
			<div class="boxTypeWrap delShadow">
				<!-- [D] 운영에 반영된 소스 -->
				<div class="accTopInfo">
					<h2 class="accName">
						<span>원화</span>
						<img src="../../images/logos/ABAA0000.png" alt="빗썸 로고" class="imgLogo">
					</h2>
					<dl class="totalBalance">
						<dt>평가금액
							<!-- // -->
							<div class="tooltipWrap">
								<button type="button" class="toolTipBtn" onclick="tooltipOpen($(this))"><span class="blind">연결오류 툴팁 열기</span></button>
								<div class="tooltipCont">
									<p>투자내역이 없는 경우, 평가금액이 0원으로 표시됩니다.</p>
									<button type="button" class="close" onclick="tooltipClose($(this))"><span class="blind">툴팁 닫기</span></button>
								</div>
							</div>
							<!-- // -->
						</dt>
						<dd><strong>1,000,000</strong>원</dd>
					</dl>
				</div>
				<!-- // -->

				<hr class="divLine">

				<!-- // -->
				<div class="accInfoDetail">
					<ul class="detailList">
						<li>
							<span class="tit">유형</span>
							<span class="value">가상자산 </span>
						</li>
						<li>
							<span class="tit">가상자산명</span>
							<span class="value">원화</span>
						</li>
						<!-- [CASE1] 메모내용이 없을 경우 -->
						<li>
							<span class="tit">메모</span>
							<span class="value"><a href="javascript:;" class="underline">미입력</a></span>
						</li>
						<!-- [CASE2] 메모내용이 있을 경우 -->
						<li>
							<span class="tit">메모</span>
							<span class="value">
								<span>메모내용이 노출됩니다.</span>
								<button type="button" class="contBtn01" title="메모 수정">수정</button>
							</span>
						</li>
						<!-- // -->
					</ul>
				</div>
				<!-- // -->
			</div>

			<!-- [가상자산 상세정보] -->
			<div class="moreInfoArea">
				<div class="moreInfoWrap toggleWrap">
					<div class="moreInfo toggleCont" style="display:none;">
						<hr class="divLine2" aria-hidden="true">
						<ul class="detailList">
							<li>
								<span class="tit">거래소</span>
								<span class="value pointColor">빗썸</span>
							</li>
						</ul>
					</div>
					<button type="button" class="moreOpenBtn toggleBtn"><span class="toggleTxt07">상세정보 보기</span></button>
				</div>
			</div>
			<!-- // -->
		</div>
		<!-- -------------------------------------- -->
	</div>
	<!-- ###################################### -->
</div>

<!-- ###################################### -->
<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script type="text/javascript">
	$('.layerMsgClose').click(function(){
		$(this).closest('.layerMsgWrap').hide();
	});
</script>
<!-- ###################################### -->
</body>
</html>
