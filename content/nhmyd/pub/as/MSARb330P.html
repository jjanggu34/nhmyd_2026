$(function(){
    slidePopConfirm();
});
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 금융상품몰 이동 알림 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner">
		<h1>금융상품몰 이동 알림</h1>
		<div class="popCont">
			<div class="transfer">
				<p class="subTxt">선택하신 상품의 상세페이지로 이동하여<br>상품가입을 진행하시겠습니까?</p>
				<p class="mt10">상품가입 진행 시 투자시뮬레이션은 종료됩니다.</p>
			</div>
		</div>

		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="" onclick="popClose(this);return false;" role="button">아니오</a>
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">이동</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
