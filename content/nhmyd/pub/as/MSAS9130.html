<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">
<meta name="author" content="">
<meta name="content" content="">
<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>외화 등록 | 실물 등록 | 자산현황(실물)</title>
<script src="../pub-assets/js/head.js"></script>
</head>
<body>
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<!-- [MD2509_104] 프로세스 진행 화면 헤더 영역 변경 -->
		<a href="javascript:;" role="button" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1>외화 등록</h1>
		<!-- [MD2509_104] 프로세스 진행 화면 헤더 영역 변경 -->
		<a href="javascript:;" role="button" class="btnCancle"><span class="blind">취소</span></a>
	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] 금 등록 ### -->
	<!-- ###################################### -->
	<div class="container bgWhite">
		<!-- -------------------------------------- -->
		<!-- [입력영역] -->
		<!-- -------------------------------------- -->
		<div class="formWrap realAsset">
			<ul>
				<li>
					<strong class="formTit">명칭</strong>
					<div class="inputList">
						<input type="text" title="명칭" value="" placeholder="명칭을 입력해주세요.">
						<a href="javascript:" class="btnReset" role="button">입력내용삭제</a>
					</div>
					<div class="roundChkWrap mt10">
						<ul>
							<li>
								<span class="roundChk">
									<input type="radio" name="sample00" id="sample01" aria-label="여행">
									<label for="sample01" aria-hidden="true">여행</label>
								</span>
							</li>
							<li>
								<span class="roundChk">
									<input type="radio" name="sample00" id="sample02" aria-label="재테크">
									<label for="sample02" aria-hidden="true">재테크</label>
								</span>
							</li>
							<li>
								<span class="roundChk">
									<input type="radio" name="sample00" id="sample03" aria-label="출장">
									<label for="sample03" aria-hidden="true">출장</label>
								</span>
							</li>
							<li>
								<span class="roundChk">
									<input type="radio" name="sample00" id="sample04" aria-label="유학">
									<label for="sample04" aria-hidden="true">유학</label>
								</span>
							</li>
						</ul>
					</div>
					<p class="errorTxt" style="display:none;">특수문자[!@#$*()-=|;:,./]만 입력 가능합니다.</p>
				</li>
				<li>
					<strong class="formTit">외화종류선택</strong>
					<div class="stList">
						<a href="javascript:;" title="외화종류선택" aria-haspopup="true">
							<span class="selectValue placeholder">USD(미국달러)</span> <!-- [D] value 값이 들어오면 class placeholder 삭제 -->
							<span class="selectBtn"></span>
						</a>
						<select name="" title="선택해주세요">
							<option value=""></option>
						</select>
					</div>
				</li>
				<li>
					<strong class="formTit">보유금액</strong>
					<div class="inputList unitMan">
						<input type="tel" title="보유금액" value="" placeholder="금액을 입력해주세요.">
						<span class="unit">USD</span>
						<a href="javascript:" class="btnReset" role="button">입력내용삭제</a>
					</div>
				</li>
			</ul>
		</div>

		<!-- -------------------------------------- -->
		<!-- [안내문구] -->
		<!-- -------------------------------------- -->
		<div class="grayBgLine mt30">
			<ul class="detailList">
				<li>
					<span class="tit">원화환산금액은 자산현황에서 확인하실 수 있습니다.</span>
				</li>
			</ul>
		</div>

		<!-- -------------------------------------- -->
		<!-- [하단영역] 액션버튼 -->
		<!-- -------------------------------------- -->
		<div class="areaBtnDefault">
			<a href="javascript:;" class="btnPressPoint" role="button">등록하기</a>
		</div>
		<!-- -------------------------------------- -->
	</div>
	<!-- ###################################### -->
</div>
</body>
</html>
