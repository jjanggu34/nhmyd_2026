<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">
<meta name="author" content="">
<meta name="content" content="">
<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>전세 | 부동산 상세(기타) | 자산현황(부동산)</title>
<script src="../pub-assets/js/head.js"></script>
</head>
<body>
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1>부동산 상세</h1>
		<a href="javascript:;" class="btnAcAdmin"><span class="blind">관리</span></a>
	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] 부동산 상세(기타)_전세 ### -->
	<!-- ###################################### -->
	<div class="container">
		<!-- -------------------------------------- -->
		<!-- [레이어팝업] 메세지 : 순자산 포함 안된 자산일 경우 노출 -->
		<!-- -------------------------------------- -->
		<div class="layerMsgWrap ty02">
			<p>순자산 금액에 포함되지 않은 자산이에요.</p>
			<button type="button" class="layerMsgClose"><span class="blind">닫기</span></button>
		</div>

		<!-- -------------------------------------- -->
		<!-- [상단영역] 부동산정보 -->
		<!-- -------------------------------------- -->
		<div class="boxTypeWrap">
			<!-- [부동산기본정보] -->
			<div class="accTopInfo">
				<h2 class="accName">
					<span>강남파라곤</span>
					<img src="../../images/ico_etcAsset02.png" alt="" class="imgLogo">
				</h2>
				<dl class="totalBalance">
					<dt>나의 보증금</dt>
					<dd><strong>100,000,000</strong>원
						<div class="wrapTag">
							<span class="tag green">전세</span>
						</div>
					</dd>
				</dl>
			</div><hr class="divLine">

			<!-- [부동산상세정보] -->
			<div class="moreInfoWrap mt0">
				<div class="moreInfo">
					<ul class="detailList mt0">
						<li>
							<span class="tit">부동산 정보</span>
							<span class="value">
								<div class="estateInfo">
									<span>기타 부동산</span>
								</div>
							</span>
						</li>
						<li>
							<span class="tit">계약기간</span>
							<span class="value">2020.07.31 ~ 2020.07.31</span>
						</li>
						<li>
							<span class="tit">등록일</span>
							<span class="value">2020.07.31</span>
						</li>
						<li>
							<span class="tit">메모</span>
							<span class="value">작성한 메모가 노출됩니다. 메모가 없을 경우 히든 처리 됩니다.</span>
						</li>
					</ul>
				</div>
			</div>
			<!-- // -->
		</div>

		<!-- -------------------------------------- -->
		<!-- [관련대출] -->
		<!-- -------------------------------------- -->
		<div class="boxTypeWrap pt0">
			<div class="accListWrap mt0">
				<p class="totalCnt totalTitWrap typeB ">관련대출 총 <strong>N</strong>개</p>
				<ul class="accList">
					<li>
						<div class="accInfoWrap">
							<span class="accTit">[기관명] 상품명</span>
							<div class="accInfo">
								<span class="accNum">계좌번호</span>
								<span class="accValue"><strong class="dataValue">10,000,000,000</strong><em class="won">원</em></span>
							</div>
						</div>
					</li>
					<li>
						<div class="accInfoWrap">
							<span class="accTit">[농협은행] 주택담보대출</span>
							<div class="accInfo">
								<span class="accNum">123-45-67-8900</span>
								<span class="accValue"><strong class="dataValue">10,000,000,000</strong><em class="won">원</em></span>
							</div>
						</div>
					</li>
				</ul>
			</div>
			<div class="listMoreBtn">
				<a href="javascript:;" title="항목 더보기">더보기</a>
			</div>
		</div>
		<!-- -------------------------------------- -->
	</div>
	<!-- ###################################### -->
</div>

<!-- ###################################### -->
<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script type="text/javascript">
	//[샘플] 레이어팝업 닫기 클릭 이벤트
	$('.layerMsgClose').click(function(){
		$(this).closest('.layerMsgWrap').hide();
	});
</script>
<!-- ###################################### -->
</body>
</html>
