<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">

<title>[P] 목표</title>
<script src="../pub-assets/js/head.js"></script>
<script>
	$(document).ready(function () {
		fullLayerPop();
	})
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 목표(추천목표) ### -->
<!-- ###################################### -->
<div class="nhasset popWrap fullLayerPop">
	<div class="popInner">
		<h1>목표</h1>
		<div class="popCont grayPop">
			<!-- -------------------------------------- -->
			<!-- [상단영역] -->
			<!-- -------------------------------------- -->
			<div class="totalBalance obpopTit">
				<p class="defTxt">
					잠깐만요!<br />목표달성 지름길 보고가실래요?
				</p>
			</div>

			<!-- -------------------------------------- -->
			<!-- [추천상품] 챌린지 달성을 위한 추천상품 -->
			<!-- -------------------------------------- -->
			<div class="boxTypeWrap bgType02 oblistbg02 addShadow">
				<div class="visualSubWrap">
					<div class="visualSub type01">챌린지 달성을 위한 추천상품
						<div class="tooltipWrap">
							<button type="button" class="toolTipBtn" onclick="tooltipOpen($(this))"><span class="blind">챌린지 달성을 위한 추천상품 안내툴팁</span></button>
							<div class="tooltipCont">
								<p>6개월 기간동안 자동으로 목표금액을 모아주는 논스톱 목표달성 기능입니다.</p>
								<button type="button" class="close" onclick="tooltipClose($(this))"><span class="blind">툴팁 닫기</span></button>
							</div>
						</div>
					</div>
					<p class="visualSubPara">상품가입 시 실제 금리와 다를 수 있습니다.</p>
				</div>
				<ul class="prodListWrap">
					<li>
						<a href="javascript:;" role="button">
							<!-- [MD2411_100] 수신상품추천 배너 관련 화면(서비스) 변경 : 마크업 변경 -->
							<div class="prodRecomWrap t1">
								<strong class="prodTit">NH올원e 미니적금</strong>
								<div class="prodRecomVal dsf">
									<span class="dataValueWrap">
										<span class="data1"><strong class="dataValue">1.80</strong><em class="per">%</em></span>
										<span class="data1"><strong class="dataValue">3.42</strong><em class="per">%</em></span>
									</span>
									<div class="prodVal ty01">(연/세전, 12개월)</div>
								</div>
								<div class="data2">목적자금 마련을 위한 단기 소액 적금</div>
								<span class="hashWrap">
									<em class="hastag bg03">#목돈모으기</em>
									<em class="hastag bg01">#여행</em>
									<em class="hastag bg02">#초단기</em>
								</span>
							</div>
							<!-- // [MD2411_100] 수신상품추천 배너 관련 화면(서비스) 변경 : 마크업 변경 -->
						</a>
					</li>
				</ul>
			</div>

			<!-- -------------------------------------- -->
			<!-- [하단영역] 바로가기 링크 -->
			<!-- -------------------------------------- -->
			<a href="javascript:;" class="linkType2 mt30 fr">기존계좌 연결하기</a>
			<!-- -------------------------------------- -->
		</div>
		<div class="popBtnWrap">
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
</body>
</html>
