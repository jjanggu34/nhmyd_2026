<title>[P] 회차정보 상세</title>

	$(document).ready(function() {
		fullLayerPop();
	});
</script>

<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 회차정보 상세 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap fullLayerPop">
	<div class="popInner">
		<h1>회차정보 상세</h1>
		<div class="popCont">
			<div class="viewBoxArea">
				<!-- [회차내역] -->
				<div class="popIRP openType">
					<!-- [반복] -->
					<div>
						<div class="agreeTit">10회차</div>
						<div class="toggleCont">
							<ul class="detailList">
								<li>
									<span class="tit">신규일자</span>
									<span class="value">2027.07.21</span>
								</li>
								<li>
									<span class="tit">만기일자</span>
									<span class="value">2027.07.21</span>
								</li>
								<li>
									<span class="tit">금리</span>
									<span class="value"><strong class="dataValue">0.70</strong><em class="won">%</em></span>
								</li>
								<li>
									<span class="tit">잔액</span>
									<span class="value"><strong class="dataValue">10,000,000</strong><em class="won">원</em></span>
								</li>
							</ul>
						</div>
					</div>
					<!-- // -->
					<div>
						<div class="agreeTit">9회차</div>
						<div class="toggleCont">
							<ul class="detailList">
								<li>
									<span class="tit">신규일자</span>
									<span class="value">2027.07.21</span>
								</li>
								<li>
									<span class="tit">만기일자</span>
									<span class="value">2027.07.21</span>
								</li>
								<li>
									<span class="tit">금리</span>
									<span class="value"><strong class="dataValue">0.70</strong><em class="won">%</em></span>
								</li>
								<li>
									<span class="tit">잔액(USD)</span>
									<span class="value"><strong class="dataValue">20,000</strong></span>
								</li>
								<li>
									<span class="tit">적용환율</span>
									<span class="value"><strong class="dataValue">1USD=1123.12</strong><em class="won">원</em></span>
								</li>
								<li>
									<span class="tit">적용환율</span>
									<span class="value">미제공</span>
								</li>
							</ul>
						</div>
					</div>
					<!-- // -->
				</div>

				<!-- [더보기] -->
				<div class="listMoreBtn">
					<a href="javascript:;" title="항목 더보기">더보기</a>
				</div>
				<!-- // -->
			</div>
		</div>

		<div class="popBtnWrap">
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
</body>
</html>
