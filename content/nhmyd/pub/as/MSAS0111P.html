<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">
<meta name="author" content="">
<meta name="content" content="">
<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>[P] 회차정보 상세</title>
<script src="../pub-assets/js/head.js"></script>
<script>
	$(document).ready(function() {
		fullLayerPop();
	});
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 회차정보 상세 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap fullLayerPop">
	<div class="popInner">
		<h1>회차정보 상세</h1>
		<div class="popCont">
			<!-- -------------------------------------- -->
			<!-- [상단영역] 계좌정보 -->
			<!-- -------------------------------------- -->
			<div class="accTopInfo t1">
				<h2 class="accName">$상품명$</h2>
				<p class="accNum">3021417655471</p>
			</div>

			<!-- -------------------------------------- -->
			<!-- [목록영역] 회차정보 -->
			<!-- -------------------------------------- -->
			<div class="boxTypeWrap line pt0 pb0">
				<div class="moreListTit t1">
					<h3>1회차</h3>
					<p class="sub"><strong class="dataValue">1,000,000</strong> <em class="won">원</em></p>
				</div>
				<div class="popIRP openType">
					<div>
						<div class="toggleCont">
							<ul class="detailList">
								<li>
									<span class="tit">소멸시효 완성일</span>
									<span class="value">2024.09.03</span>
								</li>
							</ul>
						</div>
					</div>
				</div>
			</div>
			<div class="boxTypeWrap line pt0 pb0">
				<div class="moreListTit t1">
					<h3>2회차</h3>
					<div class="sub">
						<strong class="dataValue">10,000,000</strong><em class="won">원</em>

						<!-- // -->
						<div class="tooltipWrap w96">
							<button type="button" class="toolTipBtn" onclick="tooltipOpen($(this))"><span class="blind">계좌잔액 외화 안내 툴팁 열기</span></button>
							<div class="tooltipCont">
								<p>계좌잔액이 외화인 경우, 전일 매매기준율로 환산합니다.</p>
								<button type="button" class="close" onclick="tooltipClose($(this))"><span class="blind">툴팁 닫기</span></button>
							</div>
						</div>
						<!-- // -->
					</div>
				</div>
				<div class="popIRP openType">
					<div>
						<div class="toggleCont">
							<ul class="detailList">
								<li>
									<span class="tit">소멸시효 완성일</span>
									<span class="value">2024.09.03</span>
								</li>
								<li>
									<span class="tit">잔액(USD) </span>
									<span class="value"><strong class="dataValue">2,099</strong></span>
								</li>
								<li>
									<span class="tit">적용환율</span>
									<span class="value">1USD=<strong class="dataValue">1234.12</strong><em class="won">원</em></span>
								</li>
							</ul>
						</div>
					</div>
				</div>
			</div>

			<!-- [더보기] -->
			<div class="listMoreBtn">
				<a href="javascript:;" title="항목 더보기">더보기</a>
			</div>
			<!-- -------------------------------------- -->
		</div>

		<div class="popBtnWrap">
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
</body>
</html>
