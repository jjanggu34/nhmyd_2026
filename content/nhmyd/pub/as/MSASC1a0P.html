	$(document).ready(function(){
		slidePopConfirm();
	})  
</script>

<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 맞춤상품추천(외화예금 안내) ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner">
		<h1>맞춤상품추천</h1>
		<div class="popCont">   
			<div class="transfer">
				<!-- -------------------------------------- -->
				<!-- [상품추천] 일반 빅데이터 상품 -->
				<!-- -------------------------------------- -->
				<div class="boxTypeWrap bgType04 pt0 mt0">
					<h2 class="prodListTit img14">해외 투자 자금, 유리한 환율로 <br>우대 받고 미리 준비해볼까요?</h2>
					<p class="subTxt4">상품가입 시 실제 금리와 다를 수 있습니다.</p>
					<ul class="prodListWrap">
						<li>
							<a href="javascript:;" role="button">
								<div class="prodRecomWrap">
									<strong class="prodTit">하나로외화자유적립예금</strong>
									<em class="prodRecommInfo">자유롭게 수시적립 가능한 목돈마련 상품</em>
								</div>
								<div class="prodInfoWrap">	
									<span class="hashWrap">
										<em class="hastag bg01">#월단위</em>
										<em class="hastag bg02">#자유적립</em>
									</span>
								</div>
							</a>
						</li>
					</ul>
				</div>
				
				<!-- -------------------------------------- -->
				<!-- [상품추천] 선택약관(7-1번) 미동의한 고객의 경우 -->
				<!-- -------------------------------------- -->
				<div class="boxTypeWrap bgType02 addShadow">
					<h2 class="prodListTit img14">해외 투자 자금, 유리한 환율로 <br>우대 받고 미리 준비해볼까요?</h2>
					<p class="subTxt4">상품가입 시 실제 금리와 다를 수 있습니다.</p>
					<ul class="prodListWrap">
						<li>
							<div class="disagree">
								<a href="javascript:;" role="button">
									<p class="disagreeP"><strong>나만 알고 싶은 추천상품</strong></p>
								</a>
							</div>
						</li>
					</ul>
				</div>
				<!-- -------------------------------------- -->
			</div>
		</div>

		<div class="popBtnWrap">
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다."><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
