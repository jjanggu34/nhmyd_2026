<body>
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
        <a href="javascript:;" class="btnBack" role="button"><span class="blind">이전화면으로</span></a>
		<h1>상세 조회</h1>
		<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
		<a href="javascript:;" class="btnNav" role="button"><span class="blind">전체메뉴</span></a>
	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] 상세 조회 ### -->
	<!-- ###################################### -->
	<div class="container">
		<!-- -------------------------------------- -->
		<!-- [SECTION] 결과조회 목록영역  -->
		<!-- -------------------------------------- -->
		<div class="boxTypeWrap detailStepWrap">
			<div class="stepListWrap">
				<ul class="stepList">
					<li>
						<span class="imgWrap">
							<img src="../../images/logos/AAER0000.png" alt="신한은행" class="imgLogo">
						</span>
						<div  class="detailTxt">
							<strong class="tit">신한은행</strong>
							<span class="account">76539512126314</span>
						</div>
					</li>
					<li>
						<span class="imgWrap">
							<img src="../../images/logos/AAOW0000.png" alt="서민금융진흥원" class="imgLogo">
						</span>
						<div class="dataBox">
							<ul>
								<li>
									<span class="date">YYYY.MM.DD</span>
									<span class="txt">서민금융진흥원에 기부했어요.</span>
								</li>
							</ul>
						</div>
					</li>
				</ul>
				<em class="tag mint">지급완료</em>
			</div>
			<div class="grayBox">
				<h2 class="defSubTit2 t1">
					<strong>지급금액</strong>
					<span class="sub"><strong class="Value">1,000,000</strong><span class="won">원</span></span>
				</h2>
			</div>
			<ul class="detailList">
				<li>
					<div class="tit">지급일시</div>
					<span class="value"><strong>YYYY.MM.DD</strong></span>
				</li>
			</ul>
			<hr class="divLine3">
			<ul class="detailList">
				<li>
					<div class="tit">(+)출연원금</div>
					<span class="value"><strong>1,000,000원</strong></span>
				</li>
				<li>
					<div class="tit">(+)지급이자</div>
					<span class="value"><strong>0원</strong></span>
				</li>
				<li>
					<div class="tit">(-)세금</div>
					<span class="value"><strong>0원</strong></span>
				</li>
			</ul>
		</div>
		
		<!-- -------------------------------------- -->
	</div>
	<!-- ###################################### -->
</div>
