<div class="wrapper nhasset">
	<!-- header -->
	<!-- [D] 2022년 고도화 버전 : 운영은 아래와 같이 노출됨
	<div class="header">
		<h1>실물 종류 선택</h1>

	 -->
	<div class="header">
		<a href="javascript:;" class="btnBack" role="button"><span class="blind">이전화면으로</span></a>
		<!-- [MD2502_011] 실물자산 영역 개선 및 현금 수기 자산 등록 기능 추가 텍스트 수정 -->
		<h1>기타 자산 등록</h1>

	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] 실물 종류 선택 ### -->
	<!-- ###################################### -->
	<div class="container">
		<div class="formWrap boxTypeWrap pt0">
			<ul>
				<li>
					<!-- [MD2502_011] 실물자산 영역 개선 및 현금 수기 자산 등록 기능 추가 텍스트 수정 -->
					<p class="defTit mt20"><strong>보유하신 기타 자산 종류</strong>를<br />선택해주세요.</p>
					<!-- [MD2502_011] 실물자산 영역 개선 및 현금 수기 자산 등록 기능 추가 S -->
					<ul class="as selectCerti mt20">
						<li class="w50p" role="button" tabindex="0" aria-label="자동차"> <!-- [D] 버튼기능을 추가하여 라디오버튼 기능 해제 -->
							<input type="radio" id="selCerti01" name="selCerti00">
							<label for="selCerti01">
								<div class="logoArea"><img src="../../images/ico_as_car_new.png" alt="자동차" style="width:112px;"></div>
								<div class="title">자동차</div>
							</label>
						</li>
						<li class="w50p" role="button" tabindex="0" aria-label="금"> <!-- [D] 버튼기능을 추가하여 라디오버튼 기능 해제 -->
							<input type="radio" id="selCerti02" name="selCerti00">
							<label for="selCerti02">
								<div class="logoArea"><img src="../../images/ico_as_gold.png" alt="금" style="width:96px"></div>
								<div class="title">금</div>
							</label>
						</li>
					</ul>
					<ul class="as selectCerti mt20">
						<li class="w50p" role="button" tabindex="0" aria-label="외화"> <!-- [D] 버튼기능을 추가하여 라디오버튼 기능 해제 -->
							<input type="radio" id="selCerti03" name="selCerti00">
							<label for="selCerti03">
								<div class="logoArea"><img src="../../images/ico_as_coin.png" alt="외화" style="width:88px;min-height:65px"></div>
								<div class="title">외화</div>
							</label>
						</li>
						<li class="w50p" role="button" tabindex="0" aria-label="외화"> <!-- [D] 버튼기능을 추가하여 라디오버튼 기능 해제 -->
							<input type="radio" id="selCerti03" name="selCerti00">
							<label for="selCerti03">
								<div class="logoArea"><img src="../../images/ico_as_cash.png" alt="보유 현금/빌린 현금" style="width:95px;"></div>
								<div class="title">보유 현금/빌린 현금</div>
							</label>
						</li>
					</ul>
					<!-- //[MD2502_011] 실물자산 영역 개선 및 현금 수기 자산 등록 기능 추가 E -->
				</li>

				<a href="javascript:;" class="linkType2">+ 다른자산</a>
