<!-- ### [팝업] 미청구 보험금 상세내역 ### -->

<div class="nhasset popWrap fullLayerPop">
	<div class="popInner">
		<!--  [MD2408_068_v0.11] 텍스트 띄어쓰기 수정 -->
		<h1>미청구보험금 상세내역</h1>

			<div class="moreTopInfo">

			<!-- -------------------------------------- -->
			<!-- [목록영역] 미청구 보험금 -->
			<!-- -------------------------------------- -->
			<!-- [CASE] 원화 -->
			<div class="boxTypeWrap line pt0 pb0">
				<div class="moreListTit t1">
					<h3>만기보험금</h3>
					<p class="sub"><strong class="dataValue">1,000,000</strong> <em class="won">원</em></p>
				</div>
				<div class="popIRP openType">
					<div>
						<div class="toggleCont">
							<ul class="detailList">
								<li>
									<span class="tit">원금산출기준일</span>

								<li>

									<span class="value">YYYY.MM.DD</span>
								</li>
								<li>
									<span class="tit">계약체결일</span>
									<span class="value">YYYY.MM.DD</span>

								<li>
									<span class="tit">부가정보</span>

								</li>
							</ul>
						</div>
					</div>
				</div>
			</div>
			<!-- [CASE] 외화 -->
			<div class="boxTypeWrap line pt0 pb0">
				<div class="moreListTit t1">
					<h3>만기보험금</h3>
					<p class="sub"><strong class="dataValue">1,000,000</strong> <em class="won">원</em></p>
				</div>
				<div class="popIRP openType">
					<div>
						<div class="toggleCont">
							<ul class="detailList">
								<!-- [D] 외화일 경우 노출 -->

									<span class="tit">미청구보험금액</span>

								<li>
									<span class="tit">적용환율</span>
									<span class="value">1USD=<strong class="dataValue">1234.12</strong><em class="won">원</em></span>

								<li>
