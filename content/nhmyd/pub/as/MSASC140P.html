<script src="../pub-assets/js/head.js"></script>
<script>
	$(document).ready(function(){
		slidePopConfirm();
	})  
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 맞춤상품추천(선불페이 이용꿀팁) ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner">
		<h1>맞춤상품추천</h1>
		<div class="popCont">
			<!-- -------------------------------------- -->
			<!-- [상단영역] 선불페이 총 잔액 -->
			<!-- -------------------------------------- -->
			<div class="as totalPopWrap">  
				<div class="totalTit">선불페이 총 잔액</div>
				<div class="totalAmnt"><strong class="dataValue">10,000,000,000</strong><em class="won">원</em></div>
			</div>

			<!-- -------------------------------------- -->
			<!-- [추천상품] -->
			<!-- -------------------------------------- -->
			<div class="transfer">
				<div class="boxTypeWrap bgType04 pt0 mt0">
					<h2 class="prodListTit img04">
						선불페이를 자주 이용하는 당신 <br>꿀 혜택 상품을 추천 드려요!
					</h2>
					<p class="subTxt4">상품가입 시 실제 금리와 다를 수 있습니다.</p>

					<!-- [일반 빅데이터 상품추천] -->
					<ul class="prodListWrap">
						<li>
							<a href="javascript:;">
								<!-- [MD2411_100] 수신상품추천 배너 관련 화면(서비스) 변경 : 마크업 변경 -->
								<div class="prodRecomWrap t1">
									<strong class="prodTit">NH페이모아통장</strong>
									<div class="prodRecomVal dsf">
										<span class="dataValueWrap">
											<span class="data1"><strong class="dataValue">1.80</strong><em class="per">%</em></span>
											<span class="data1"><strong class="dataValue">3.42</strong><em class="per">%</em></span>
										</span>
										<div class="prodVal ty01">(연/세전, 12개월)</div>
									</div>
									<div class="data2">간편결제 이용 고객님을 위한 입출식 특화상품</div>
									<div class="data3">※ 우대금리는 일별 잔액 100만원 이하에 적용</div> <!-- [MD2411_100] v0.04 : 내용추가 -->
									<span class="hashWrap">
										<em class="hastag bg01">#1인1계좌</em>
									</span>
								</div>
								<!-- // [MD2411_100] 수신상품추천 배너 관련 화면(서비스) 변경 : 마크업 변경 -->
							</a>
						</li>
					</ul>

					<!-- [선택약관(7-1번) 미동의한 고객의 경우] -->
					<ul class="prodListWrap mt10">
						<li>
							<div class="disagree">
								<a href="javascript:;" role="button">
									<p class="disagreeP"><strong>나만 알고 싶은 추천상품</strong></p>
								</a>
							</div>
						</li>
					</ul>
					<!--// -->
				</div>
			</div>
			<!-- -------------------------------------- -->
		</div>

		<div class="popBtnWrap">
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다."><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
</body>
