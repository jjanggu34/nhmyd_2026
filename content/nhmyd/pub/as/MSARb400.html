<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">
<meta name="author" content="">
<meta name="content" content="">
<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>STEP 1 | 가상으로 선택 | 그때그랬다면 | 자산</title>
<script src="../pub-assets/js/head.js"></script>
</head>
<body>
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1>그때 그랬다면</h1>
		<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
		<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a>
	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] STEP 1) 그때 이랬다면 어땠을까 ### -->
	<!-- ###################################### -->
	<div class="container">
		<!-- -------------------------------------- -->
		<!-- [상단영역] -->
		<!-- -------------------------------------- -->
		<div class="maybeOther">
			<span class="step">STEP 1</span>
			<p>그때 다른데<strong>투자했으면 어땠을까?</strong></p>
		</div>

		<!-- -------------------------------------- -->
		<!-- [선택영역] -->
		<!-- -------------------------------------- -->
		<div class="boxTypeWrap">
			<ul class="maybeOtherList">
				<li><a href="javascript:;">그때 차를 바꾸지 않았더라면?</a></li>
				<li><a href="javascript:;">명품백을 사지 않았더라면?</a></li>
				<li><a href="javascript:;">주식 투자를 하지 않았더라면?</a></li>
				<li><a href="javascript:;">유럽여행을 가지 않았더라면?</a></li>
				<li>
					<a href="javascript:;" class="directInputBtn">직접 입력할게요</a>
					<div class="directInputArea" style="display:none">
						<div class="inputList">
							<input type="text" class="inputDirect" title="직접입력" value="" placeholder="최대 15자까지 입력 가능합니다.">
							<a href="javascript:;" role="button" class="edit">수정</span>
							<a href="javascript:" class="btnReset" role="button">입력내용삭제</a>
						</div>
						<div class="mt10 ar"><a href="javascript:;" class="contBtn02">입력완료</a></div>
					</div>
				</li>
			</ul>
		</div>
		<!-- -------------------------------------- -->
	</div>
	<!-- ###################################### -->
</div>

<!-- ###################################### -->
<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script type="text/javascript">
	//[샘플] 직접입력 클릭 이벤트
	$('.directInputBtn').click(function(){
		$(this).hide();
		$(this).next('.directInputArea').show().find('input').focus();
	});

	//[샘플] 수정버튼 클릭 이벤트
	$('.inputList .edit').click(function(){
		$(this).siblings('input').focus();
	});

	//[샘플] 입력폼 포커스 아웃 이벤트
	$('.inputDirect').on('focusout',function(e){
		var $this = $(this).val();
		if ($this < 1) {
			$('.directInputBtn').show();
			$('.directInputArea').hide();
			//$(this).next('.edit').hide()
		}else{
			$(this).next('.edit').show()
		}
	});
</script>
<!-- ###################################### -->
</body>
</html>
