<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">
<meta name="author" content="">
<meta name="content" content="">
<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>운용리스 상세 | 자산현황(대출) | 자산</title>
<script src="../pub-assets/js/head.js"></script>
</head>
<body>
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1>운용리스 상세</h1>
		<a href="javascript:;" class="btnAcAdmin"><span class="blind">관리</span></a>
	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] 운용리스 상세 ### -->
	<!-- ###################################### -->
	<div class="container">
		<!-- -------------------------------------- -->
		<!-- [상단영역] 리스정보 -->
		<!-- -------------------------------------- -->
		<div class="boxWrapShadow">
			<!-- [리스기본내용] -->
			<div class="boxTypeWrap delShadow">
				<!-- // -->
				<div class="accTopInfo mt0">
					<h2 class="accName">
						별명 또는 상품명
						<img src="../../images/logos/AAHC0000.png" alt="오케이파이낸셜대부" class="imgLogo">
					</h2>
					<div class="etcInfo">만기일 <em>D-000</em></div>
					<div class="etcInfo">만기완료</div>
				</div>
				<!-- // -->

				<hr class="divLine">

				<!-- // -->
				<div class="accInfoDetail">
					<ul class="detailList">
						<li>
							<span class="tit">유형</span>
							<span class="value">운용리스 </span>
						</li>
						<li>
							<span class="tit">상품명</span>
							<span class="value">상품명</span>
						</li>
					</ul>
				</div>
				<!-- // -->
			</div>

			<!-- [리스상세정보] -->
			<div class="moreInfoArea">
				<div class="moreInfoWrap toggleWrap">
					<div class="moreInfo toggleCont" style="display:none">
						<hr class="divLine2" aria-hidden="true">
						<ul class="detailList">
							<li>
								<span class="tit">대출일자</span>
								<span class="value">2020.08.13</span>
							</li>
							<li>
								<span class="tit">만기일자</span>
								<span class="value">2020.08.13</span>
							</li>
							<li>
								<span class="tit">상환일</span>
								<span class="value">매월 20일</span>
							</li>
							<li>
								<span class="tit">상환방식</span>
								<span class="value">원금균등분할상환</span>
							</li>
							<li>
								<span class="tit">자동이체기관</span>
								<span class="value">농협은행</span>
							</li>
							<li>
								<span class="tit">자동이체계좌</span>
								<span class="value">3021417655471</span>
							</li>
							<li>
								<span class="tit">다음 납입 예정일</span>
								<span class="value">2020.08.21</span>
							</li>
						</ul>
					</div>
					<button type="button" class="moreOpenBtn toggleBtn"><span class="toggleTxt07">상세정보 보기</span></button>
				</div>
			</div>
			<!-- // -->
		</div>

		<!-- -------------------------------------- -->
		<!-- [목록영역] 거래내역 -->
		<!-- -------------------------------------- -->
		<div class="boxTypeWrap pt0">
			<!-- [CASE1] 내역이 있는 경우 -->
			<div class="inoutListWrap longTit">
				<!-- [날짜별 반복] -->
				<div class="inoutListInn">
					<p class="date bdtNone">2020년 7월 31일</p>
					<ul class="inoutList">
						<li>
							<div class="inoutTit dsfSpace">
								<span class="use">일부상환</span>
								<div class="amount outColor"><strong class="dataValue">000,000</strong><em class="won">원</em></div>
							</div>
							<div class="inoutCont">
								<div class="timeWrap">
									<span class="time">00:00</span>
								</div>
							</div>
						</li>
					</ul>
				</div>
				<!-- // -->
			</div>
			<!-- 더보기 -->
			<div class="listMoreBtn">
				<a href="javascript:;" title="항목 더보기">더보기</a>
			</div>

			<!-- [CASE2] 내역이 없는 경우 -->
			<div class="noResultWrap">
				<p>거래내역이 없습니다.</p>
			</div>
			<!-- // -->
		</div>
		<!-- -------------------------------------- -->
	</div>
	<!-- ###################################### -->
</div>
</body>
</html>
