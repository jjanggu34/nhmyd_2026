<DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">
<meta name="author" content="">
<meta name="content" content="">
<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>[P] 대출상품 선택</title>
<script src="../pub-assets/js/head.js"></script>
<script>
	$(function(){
		slidePopOption();
	});
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 대출상품 선택 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopOption">
	<div class="dim"></div>
	<div class="popInner">
		<h1>대출상품 선택</h1>
		<div class="popCont">
			<ul class="selectList">
				<li>
					<a href="javascript:;">
						<strong class="fwN">[기관명] 대출상품명</strong>
						<div class="ob divingTxt fcGray"><span>만기일 0000.00.00</span></div>
						<div class="accInfo">
							<span class="accValue"><strong class="dataValue">1,000,000,000</strong><em class="won">원</em></span>
						</div>
					</a>
				</li>
				<!-- [CASE] 선택함 -->
				<li class="active">
					<a href="javascript:;" role="button" title="선택됨">
						<strong class="fwN">[삼성화재] 보험계약대출</strong>
						<div class="ob divingTxt fcGray"><span>만기일 2020.07.31</span></div>
						<div class="accInfo">
							<span class="accValue"><strong class="dataValue">1,000,000,000</strong><em class="won">원</em></span>
						</div>
					</a>
				</li>
				<!-- [CASE] 다른 목표에서 설정한 대출 -->
				<li class="select">
					<a href="javascript:;">
						<strong class="fwN">[한국장학재단] 대출상품명</strong>
						<div class="ob divingTxt fcGray"><span>만기일 9999.12.31</span></div>
						<div class="accInfo">
							<div class="wrapTag"><span class="type02">연결중</span></div>
							<span class="accValue"><strong class="dataValue">1,000,000,000</strong><em class="won">원</em></span>
						</div>
					</a>
				</li>
				<!-- [CASE] 연결할 수 없는 대출 -->
				<li>
					<p class="selInfoTxt">아래 계좌는 연결할 수 없어요.</p>
				</li>
				<li class="disabled">
					<a href="javascript:;" aria-disabled="true">
						<strong class="fwN">[하나은행] 마이너스 대출</strong>
						<div class="ob divingTxt fcGray"><span>만기일 2020.07.31</span></div>
						<div class="accInfo">
							<div class="wrapTag"><span class="type05">1개월 미만</span></div>
							<span class="accValue"><strong class="dataValue">1,000,000,000</strong><em class="won">원</em></span>
						</div>
					</a>
				</li>
				<!-- // -->
			</ul>
		</div>

		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" role="button">연결하기</a> <!-- [D] 비활성화 시 disabled 추가 -->
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다."><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
</body>
</html>
