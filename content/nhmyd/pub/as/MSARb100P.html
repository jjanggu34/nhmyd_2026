<!-- ### [팝업] 자산연결 ### -->

<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner">
		<h1 class="ac otherHeight"><span class="blind">자산연결</span></h1>
		<div class="popCont">
			<div class="maybeNone">
				<p class="maybeNonePara2">선택 가능한 자산이 없어요!<br>새로운 자산을 연결해볼까요?</p>
				<p class="subtxt2 mt5">단, 입출금, 청약저축, 장기보유 등<br>일부 자산은 서비스 대상에서 제외됩니다.</p>
			</div>
		</div>

		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="" onclick="popClose(this);return false;" role="button">다시하기</a>
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">확인</a>
			</div>
		</div>
	</div>
</div>
