<title>[P] 상세내용(대출(할부금융))</title>

	$(document).ready(function() {
		fullLayerPop();
	});
</script>

<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 상세내용(대출(할부금융)) ### -->
<!-- ###################################### -->
<div class="nhasset popWrap fullLayerPop">
	<div class="popInner">
		<h1>상세내용</h1>
		<div class="popCont grayPop">
			<!-- -------------------------------------- -->
			<!-- [정보영역] -->
			<!-- -------------------------------------- -->
			<div class="boxTypeWrap plannerDetail">
				<div class="planFlagWrap"><span class="planType unerColor-g">출금예정</span> </div>

				<!-- ### 대출정보 ### -->
				<div class="accTopInfo">
					<h2 class="accName"><span class="titHiglight">현대캐피탈</span> 신차구입대출<img src="../../images/logos/AADE0000.png" class="imgLogo" alt=""></h2>
					<p class="accNum">1234-3453123-0211</p>
					<dl class="totalBalance">
						<dt>(예상)금액</dt>
						<dd><strong>6,399,000</strong>원</dd>
					</dl>
				</div><hr class="divLine" aria-hidden="true">
				
				<!-- ### 대출상세정보 ### -->
				<div class="accInfoDetail">
					<ul class="detailList">
						<li>
							<span class="tit">대출일</span>
							<span class="value">YYYY.MM.DD</span>
						</li>
						<li>
							<span class="tit">만기일</span>
							<span class="value">YYYY.MM.DD</span>
						</li>
						<li>
							<span class="tit">대출원금</span>
							<span class="value">20,000,000원</span>
						</li>
						<li>
							<span class="tit">계좌구분</span>
							<span class="value">기타 담보대출</span>
						</li>
						<li>
							<span class="tit">상환방식</span>
							<span class="value">원금균등분할상환</span>
						</li>
						<li>
							<span class="tit">잔액</span>
							<span class="value">5,000,000원</span>
						</li>
					</ul>
				</div>
				<!-- ### // ### -->
			</div>

			<!-- -------------------------------------- -->
			<!-- [버튼영역] 삭제 -->
			<!-- -------------------------------------- -->
			<div class="ar mt10 mb20"><a href="javascript:;" class="linkType1" aria-haspopup="true">삭제하기</a></div>
			<!-- -------------------------------------- -->
		</div>

		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
</body>
</html>
