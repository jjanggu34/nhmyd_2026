<script>
	$(document).ready(function() {
		fullLayerPop();
	});
</script>

<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 상세내용(지로(통합사회보험료)) ### -->
<!-- ###################################### -->
<div class="nhasset popWrap fullLayerPop">
	<div class="popInner">
		<h1>상세내용</h1>
		<div class="popCont grayPop">
			<!-- -------------------------------------- -->
			<!-- [정보영역] -->
			<!-- -------------------------------------- -->
			<div class="boxTypeWrap plannerDetail">
				<div class="planFlagWrap"><span class="planType unerColor-g">출금예정</span> </div>

				<!-- ### 공과금 금액 정보 ### -->
				<div class="accTopInfo">
					<h2 class="accName">[통합사회보험료] 건강보험 서울강남지사<img src="../../images/icon_planner_01.png" class="imgLogo" alt=""></h2>
					<dl class="totalBalance">
						<dt>금액</dt>
						<dd><strong>6,399,000</strong>원</dd>
					</dl>
				</div><hr class="divLine" aria-hidden="true">
				
				<!-- ### 공과금 상세정보 ### -->
				<div class="accInfoDetail">
					<ul class="detailList">
						<li>
							<span class="tit">구분</span>
							<span class="value">통합사회보험료</span>
						</li>
						<li>
							<span class="tit">기관명</span>
							<span class="value">-</span>
						</li>
						<li>
							<span class="tit">전자납부번호</span>
							<span class="value">$NNNNNNN$</span>
						</li>
						<li>
							<span class="tit">공과금내용  </span>
							<span class="value">$공과금내용$</span>
						</li>
						<li>
							<span class="tit">지사명 </span>
							<span class="value">$지사명$ </span>
						</li>
						<li>
							<span class="tit">보험구분</span>
							<span class="value">$보험구분$</span>
						</li>
						<li>
							<span class="tit">부과년월 </span>
							<span class="value">YYYY.MM</span>
						</li>
						<li>
							<span class="tit">납부금액 </span>
							<span class="value">$NNN,NNN$원</span>
						</li>
						<li>
							<span class="tit">납기내후구분 </span>
							<span class="value">납기내 기한</span>
						</li>
						<li>
							<span class="tit">납부기한 </span>
							<span class="value">~ YYYY.MM.DD</span>
						</li>
						<li>
							<span class="tit">고지형태 </span>
							<span class="value">모바일</span>
						</li>
					</ul>
				</div>
				<!-- ### // ### -->
			</div>

			<!-- -------------------------------------- -->
			<!-- [버튼영역] 삭제 -->
			<!-- -------------------------------------- -->
			<div class="ar mt10 mb20"><a href="javascript:;" class="linkType1" aria-haspopup="true">삭제하기</a></div>
			<!-- -------------------------------------- -->
		</div>

		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
