<div class="nhasset popWrap slidePopOption">
	<div class="dim"></div>
	<div class="popInner">

		<h1>납부예정 항목 선택</h1>
		<div class="popCont">
			<div class="formWrap msaeType">
				<div class="boxRadio rowType msaeType">
					<ul class="pickList">
						<li>	
							<input type="checkbox" name="rdo01" id="rdo011" checked aria-label="[직접등록] 학원비">	
							<label for="rdo011" class="rdoCheck" aria-hidden="true">
								<span class="withdrawList">

								</span>
							</label>
						</li>
						<li>	
							<input type="checkbox" name="rdo01" id="rdo012" aria-label="[농협생명보험] 실속만점 1234567890123">	
							<label for="rdo012" class="rdoCheck" aria-hidden="true"> 
								<span class="withdrawList">
									<span class="title">[농협생명보험] 실속만점</span>
									<span class="accNum al">1234567890123</span>

							</label>
						</li>
						<li>	
							<input type="checkbox" name="rdo01" id="rdo013"   checked aria-label="[지방세] 주민세 7979352222">

								<span class="withdrawList">
									<span class="title">[지방세] 주민세</span>

						</li>
						<li>

									<span class="title">[SK텔레콤] 휴대폰</span>
									<span class="accNum al">010*95**1****</span>

				</div>
			</div>
		</div>	
		
		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">확인</a>
