<!-- ###################################### -->
<!-- ### [팝업] 상세내용(보험) ### -->
<!-- ###################################### -->
<div class="nhasset popWrap fullLayerPop">
	<div class="popInner">
		<h1>상세내용</h1>
		<div class="popCont grayPop">
			<!-- -------------------------------------- -->
			<!-- [정보영역] -->
			<!-- -------------------------------------- -->
			<div class="boxTypeWrap plannerDetail">
				<div class="planFlagWrap"><span class="planType unerColor-g">출금예정</span> </div>

				<!-- ### 보험 금액 정보 ### -->
				<div class="accTopInfo">
					<h2 class="accName"><span class="titHiglight">현대해상</span> 자동차보험 <img src="../../images/logos/AAAL0000.png" class="imgLogo" alt=""></h2>
					<dl class="totalBalance">
						<dt>금액</dt>
						<dd><strong>6,399,000</strong>원</dd>
					</dl>
				</div><hr class="divLine" aria-hidden="true">

				
				<!-- ### 보험 상세정보 ### -->
				<div class="accInfoDetail">
					<ul class="detailList">
						<li>
							<span class="tit">기관명</span>
							<span class="value">현대해상</span>
						</li>
						<li>
							<span class="tit">증권번호</span>
							<span class="value">1121214213214</span>
						</li>
						<li>
							<span class="tit">보험종류구분</span>
							<span class="value">건강보험(무배당)</span>
						</li>
						<li>
							<span class="tit">계약체결일</span>
							<span class="value">YYYY.MM.DD</span>
						</li>
						<li>
							<span class="tit">만기일</span>
							<span class="value">YYYY.MM.DD</span>
						</li>
						<li>
							<span class="tit">보험가입금액</span>
							<span class="value">10,000,000원</span>
						</li>
						<li>
							<span class="tit">납입주기 </span>
							<span class="value">매월</span>
						</li>
						<li>
							<span class="tit">납입보험료 </span>
							<span class="value">1,000,000원</span>
						</li>
						<li>
							<span class="tit">납입종료일자 </span>
							<span class="value">2025.12.31</span>
						</li>
					</ul>
				</div>
				<!-- ### // ### -->
			</div>

			<!-- -------------------------------------- -->
			<!-- [안내문구] -->
			<!-- -------------------------------------- -->
			<!-- [현행화_2024] 운영에서는 노출 안됨
			<ul class="listDash mt25">
				<li>해당 금액은 청구금액으로 실제 출금금액과 차이가 생길 수 있습니다</li>
			</ul>
			-->

			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
