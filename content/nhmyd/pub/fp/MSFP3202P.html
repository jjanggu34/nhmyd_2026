<head>

    slidePopConfirm();
});
</script>

<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 일정삭제 ### -->

<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner">
		<h1>일정삭제</h1>
		<div class="popCont">
			<div class="fpPopWrap">
				<p class="Title"><strong>일정을 삭제할까요? </strong></p>
				더 이상 캘린더에서 해당 일정이 보이지 않아요.
			</div>
		</div>

		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">네, 삭제할게요</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
