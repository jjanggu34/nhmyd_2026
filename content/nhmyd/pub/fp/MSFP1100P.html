		slidePopConfirm();
	});

<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 수집 주기 변경 안내 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner">
		<h1>수집 주기 변경 안내</h1>
		<div class="popCont">
			<div class="transfer">
				<p>일부 정보의 수집 주기가 “수시” 로 되어있어 금융 일정 알림을 받을 수 없어요!</p>
				<ul class="listDash mt15">
					<li>자산연결관리 화면에서 수집 주기를 “정기” 로 변경하면 알림을 받을 수 있습니다.</li>
				</ul>
			</div>
			
		</div>

		<div class="popBtnWrap">
			<div class="popBtn btnHalf">
				<a href="javascript:;" class="" onclick="popClose(this);return false;" role="button">일주일간 보지 않기</a>
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">수집 주기 변경</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
