<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">

<meta name="content" content="">

<title>[P] 금융 일정 선택</title>
<script src="../pub-assets/js/head.js"></script>
<script>
	$(document).ready(function () {
		fullLayerPop();
	})
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 금융 일정 선택 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap fullLayerPop">
	<div class="popInner">
		<h1>금융 일정 선택</h1>
		<div class="popCont grayPop">
			<div class="formWrap">
				<!-- -------------------------------------- -->
				<!-- [입력영역] -->
				<!-- -------------------------------------- -->
				<h2 class="defTit msaeBannerWrap04">조회를 원하는 금융일정을<br />선택해보세요.</h2>
				<div class="boxTypeWrap mt0">
					<div class="titListBox">
						<div class="assetSelectLlistAll">
							<span><input type="checkbox" id="listAll" class="chekTypeOther" name="" ><label for="listAll">전체선택</label></span>
						</div>
						<hr class="divLine mt15" aria-hidden="true">
						<div class="boxRadio">
							<div class="boxRadioInn">
								<span>
									<input name="rdo01" id="rdo001" type="checkbox" aria-label="만기예정" checked>
									<label for="rdo001" aria-hidden="true">만기예정</label>
								</span>
							</div>
							<div class="boxRadioInn">
								<span>
									<input name="rdo01" id="rdo002" type="checkbox" aria-label="납부예정">
									<label for="rdo002" aria-hidden="true">납부예정</label>
								</span>
							</div>
						</div>
						<div class="boxRadio">
							<div class="boxRadioInn">
								<span>
									<input name="rdo01" id="rdo003" type="checkbox" aria-label="출금예정">
									<label for="rdo003" aria-hidden="true">출금예정</label>
								</span>
							</div>
							<div class="boxRadioInn">
								<span>
									<input name="rdo01" id="rdo004" type="checkbox" aria-label="공모주">
									<label for="rdo004" aria-hidden="true">공모주</label>
								</span>
							</div>
						</div>
						<div class="boxRadio">
							<div class="boxRadioInn">
								<span>
									<input name="rdo01" id="rdo005" type="checkbox" aria-label="주택청약">
									<label for="rdo005" aria-hidden="true">주택청약</label>
								</span>
							</div>
							<div class="boxRadioInn">
								<span>
									<input name="rdo01" id="rdo006" type="checkbox" aria-label="직접등록 일정">
									<label for="rdo006" aria-hidden="true">직접등록 일정</label>
								</span>
							</div>
						</div>
					</div>
				</div>
				<!-- -------------------------------------- -->

				<!-- [하단영역] 알아두세요 -->
				<!-- -------------------------------------- -->
				<!-- [MD2503_029_v0.06] 금융플래너 공모주 설정 및 출금예정관련 UX 개선 알아두세요 추가 -->
				<div class="info_area">
					<strong class="info_area_title">알아두세요</strong>
					<ul class="listBul disc">
						<li>공모주 일정을 선택하시면 해당 선택이 저장되며,<br /> 일정 안내를 위한 PUSH알림 또한 자동으로 설정됩니다.</li>
					</ul>
				</div>
			</div>
		</div>
		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->

<!-- ###################################### -->
<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script type="text/javascript">
	$(document).ready(function(){
		$("#listAll").click(function(){
			if($("#listAll").is(":checked")){
				$("input[name=rdo01]").prop("checked",true);
			}else{
				$("input[name=rdo01]").prop("checked",false);
			}
		});
		$("input[name=rdo01]").click(function(){
			var total = $("input[name=rdo01]").length;
			var checked = $("input[name=rdo01]:checked").length;
			if(total != checked) {
				$("#listAll").prop("checked",false);
			}else {
				$("#listAll").prop("checked",true);
			}
		});
	});
</script>
<!-- ###################################### -->
</body>
</html>
