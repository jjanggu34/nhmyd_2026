<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">
<meta name="author" content="">
<meta name="content" content="">
<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>[P] 상세내용(마이너스 대출)</title>
<script src="../pub-assets/js/head.js"></script>
<script>
	$(document).ready(function() {
		fullLayerPop();
	});
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 상세내용(마이너스 대출) ### -->
<!-- ###################################### -->
<div class="nhasset popWrap fullLayerPop">
	<div class="popInner">
		<h1>상세내용</h1>
		<div class="popCont grayPop">
			<!-- -------------------------------------- -->
			<!-- [정보영역] -->
			<!-- -------------------------------------- -->
			<div class="boxTypeWrap plannerDetail">
				<div class="planFlagWrap"><span class="planType unerColor-g">출금예정</span> </div>

				<!-- ### 대출정보 ### -->
				<div class="accTopInfo">
					<h2 class="accName"><span class="titHiglight">농협은행</span> 마이너스대출<img src="../../images/logos/AABG0000.png" class="imgLogo" alt=""></h2>
					<p class="accNum">1234-3453123-0211</p>
					<dl class="totalBalance">
						<dt>(예상)금액</dt>
						<dd><strong>6,399,000</strong>원</dd>
					</dl>
					<p class="accDate">(yyyy.mm.dd 기준)</p>
				</div><hr class="divLine" aria-hidden="true">
				
				<!-- ### 대출상세정보 ### -->
				<div class="accInfoDetail">
					<ul class="detailList">
						<li>
							<span class="tit">상품명</span>
							<span class="value">NH주거래우대통장</span>
						</li>
						<li>
							<span class="tit">대출일</span>
							<span class="value">YYYY.MM.DD</span>
						</li>
						<li>
							<span class="tit">만기예정일</span>
							<span class="value">YYYY.MM.DD</span>
						</li>
						<li>
							<span class="tit">계좌구분</span>
							<span class="value">마이너스대출</span>
						</li>
						<li>
							<span class="tit">최종적용금리</span>
							<span class="value">3.3%</span>
						</li>
						<li>
							<span class="tit">현재 잔액</span>
							<span class="value">-18,957,000원</span>
						</li>
					</ul>
				</div>
				<!-- ### // ### -->
			</div>

			<!-- -------------------------------------- -->
			<!-- [안내문구] -->
			<!-- -------------------------------------- -->
			<div class="info_area">
				<strong class="info_area_title">알아두세요</strong>
				<ul class="listBul disc">
					<li>예상이자금액은 <span>$YYYY년 MM월 DD일$</span>을 기준으로(적용금리 : <span>X.XX</span>%) 작성되었으며, 이후 한도사용금액 및 금리변동에 따라 실제와 다를 수 있습니다.</li>
				</ul>
			</div>

			<!-- -------------------------------------- -->
			<!-- [버튼영역] 삭제 -->
			<!-- -------------------------------------- -->
			<div class="ar mt10 mb20"><a href="javascript:;" class="linkType1" aria-haspopup="true">삭제하기</a></div>
			<!-- -------------------------------------- -->
		</div>

		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
</body>
</html>
