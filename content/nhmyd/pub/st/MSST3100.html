<!DOCTYPE html >
<html lang="ko">
<head>

<meta http-equiv="Content-Script-Type" content="text/javascript">

<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">

<meta name="description" content="농협자산관리">

<meta http-equiv="Expires" content="-1">
<title>MY정보 | MY</title>
<script src="../pub-assets/js/head.js"></script>
</head>
<body>
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1>MY정보</h1>
		<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
		<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a>
	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] MY정보 ### -->
	<!-- ###################################### -->
	<div class="container">
		<h2 class="defTit">
			가족정보와 관심사를 등록하시면<br>
			<strong>정부 지원금과 다양한 정보</strong>를<br>
			확인할 수 있어요
		</h2>

		<!-- -------------------------------------- -->
		<!-- [SECTION] 가족정보 -->
		<!-- -------------------------------------- -->
		<div class="boxTypeWrap">
			<h3 class="defSubTit2">가족정보</h3>
			<!-- [CASE] 가족정보가 있는 경우 -->
			<div class="wrapTblDefault mt10">
				<table class="tdCenter thCenter">
					<caption>가족정보 안내(구분, 출생년도)</caption>
					<colgroup>
						<col width="40%">
						<col width="*">
					</colgroup>
					<thead>
						<tr>
							<th scope="col">구분</th>
							<th scope="col">출생년도</th>
						</tr>
					</thead>
					<tbody>
						<tr>
							<td>부</td>
							<td>1955년</td>
						</tr>
						<tr>
							<td>모</td>
							<td>1955년</td>
						</tr>
						<tr>
							<td>배우자</td>
							<td>1980년</td>
						</tr>
						<tr>
							<td>자녀</td>
							<td>2009년</td>
						</tr>
					</tbody>
				</table>
			</div>

			<!-- [CASE] 가족정보가 없는 경우 -->
			<div class="noResultWrap">
				<p>등록된 가족정보가 없습니다.</p>
			</div>
			<!-- // -->
			<div class="areaBodyBtnFull">
				<a href="javascript:;" class="btnBodyLine" role="button">가족정보 변경하기</a>
			</div>
		</div>

		<!-- -------------------------------------- -->
		<!-- [SECTION] 나의 관심사 -->
		<!-- -------------------------------------- -->
		<div class="boxTypeWrap">
			<h3 class="defSubTit2">나의 관심사</h3>  
			<!-- [CASE] 관심사가 있는 경우 -->
			<div class="tagWrap mt20">
				<span class="tag gray1">#종잣돈마련</span>
				<span class="tag gray1">#내집마련</span>
				<span class="tag gray1">#결혼</span>
				<span class="tag gray1">#대출줄이기</span>
				<span class="tag gray1">#여행가기</span>
				<span class="tag gray1">#건강/뷰티</span>
			</div>

			<!-- [CASE] 관심사가 없는 경우 -->
			<div class="noResultWrap">
				<p>등록된 관심사가 없습니다.</p>
			</div>
			<!-- // -->
			<div class="areaBodyBtnFull">
				<a href="javascript:;" class="btnBodyLine" role="button">나의 관심사 설정</a>
			</div>
		</div>

		<!-- -------------------------------------- -->
		<!-- [SECTION] 배너 영역 -->
		<!-- -------------------------------------- -->
		<div class="yabannerArea mt20">
			<a href="javascript:;" role="button" title="혜택플러스 이동">
				<div class="yabanner mission">
					<span class="subTxt">고객님의 NH포인트! 알고계신가요?</span>
					<p>미션에 참여하고 포인트 획득하기</p>
				</div>
			</a>
		</div>
		<!-- -------------------------------------- -->
	</div>
	<!-- ###################################### -->
</div>

<!-- ###################################### -->
<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script type="text/javascript">
	//샘플 : 케이스 화면 정의
	$(document).ready(function(){
		var a = ['등록된정보있음(MSST3100)', '등록된정보없음(MSST3200)']; // 케이스 명
		var b = ['MSST3100', 'MSST3200']; // 함수 명
		var num = a.length; // 케이스 수
		uiCaseMenu(a,b,num);
		uiCaseMSST3100();
	});

	//샘플 : 케이스 : 등록된정보있음
	function uiCaseMSST3100(){uiCase(1)}

	//샘플 : 케이스 : 등록된정보없음
	function uiCaseMSST3200(){uiCase(2)}

	//샘플 : 케이스
	function uiCase(a){
		$('.wrapTblDefault, .tagWrap, .noResultWrap').show();
		if(a == 1){
			$('.noResultWrap').hide();
		}else{
			$('.wrapTblDefault, .tagWrap').hide();
		}
	}
</script>
<!-- ###################################### -->
</body>
</html>
