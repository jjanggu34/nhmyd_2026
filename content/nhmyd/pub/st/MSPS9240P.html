	$(function() {
		slidePopConfirm();
	});
</script>

<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 안내_자산연결 안내 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner">
		<h1>자산연결 안내</h1>
		<div class="popCont notiSlidePop template04">
			<div class="popNotice">
				<div class="notiBox">
					<img src="../../images/notice/bg_template04_02.png">
					<p class="cont"><strong>조회할 수 있는 상품이 늘었어요.<br>새로운 자산조회를 위해<br>자산연결을 다시 해주세요.</strong></p>
				</div>
			</div>
			<ul class="notiSlideBtns">
				<li>
					<span class="chkbtnWrap">
						<input type="checkbox" id="todayClose" class="chekTypeOther" name="" title="하루동안 팝업 닫힘">
						<label for="todayClose">하루동안 보지 않기</label>
					</span>
				</li>
				<li><a href="javascript:;" onclick="popClose(this);return false;" class="under" title="해당 창을 닫습니다.">자세히보기</a></li>
			</ul>
		</div>
		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="" onclick="popClose(this);return false;" role="button">닫기</a>
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">자산 연결하러 가기</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
</body>
