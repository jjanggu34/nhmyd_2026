		<h1>이벤트 상세</h1>

	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] 이벤트 상세(친구추천) ### -->
	<!-- ###################################### -->
	<div class="container">
		<div class="formWrap mt0">
			<div class="boxTypeWrap">
				<!-- [이벤트 제목] -->
				<div class="eventViewTitle">
					<span class="title">NH마이데이터 오픈 서비스 이벤트</span>

				<!-- [친구추천 정보] -->
				<div class="recomCont">
					<div class="mainBox">
						<span class="resultTit">내 추천으로 가입한 친구</span>
						<span class="resultVal"><span class="pointColor">4명</span></span>
					</div>
					<div class="subBox">
						<span class="resultTit">나보다 많이 추천한 사람은?</span>
						<span class="resultVal"><span class="pointColor">1명</span></span>
					</div>
				</div>
				<!-- // -->
			</div>
		</div>

		<!-- [카카오톡 추천하기] -->
		<div class="areaBodyBtnFlex mt20">
			<button type="button" class="btnBodyLine">카카오톡 추천하기</button>
		</div>

		<!-- [응모하기] -->
		<div class="areaBtnDefault">
			<a href="javascript:;" class="btnPressPoint" role="button">응모하기</a>
