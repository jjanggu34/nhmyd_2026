		<div class="boxTypeWrap">
			<!-- -------------------------------------- -->

			<div class="eventViewTitle">

			</div>

			<!-- -------------------------------------- -->
			<!-- [SECTION] 이벤트 내용 -->
			<!-- -------------------------------------- -->
			<div class="eventCont">
				<!-- [D] 클래스명 정의
					1) 빙고 타입 : item3x3 : 3x3 빙고, item4x4 : 4x4 빙고
					2) 빙고 색상 : ty01 : 갈색빙고, ty02 : 보라빙고, ty03 : 초록빙고, ty04 : 파랑빙고
				-->
				<div class="bingo item3x3 ty01">
					<p class="eventTit">
						<strong class="bigTit02">NH마이데이터<br>우리 모두 BINGO하자!</strong>
					</p>
					<div class="bingoBoard">
						<div class="bingoCont">
							<button class="bingCell active" disabled>마이데이터<br>가입 <!-- [D] 완료 시 active 클래스, disabled 추가 -->
								<span class="bingStamp">미션 완료</span>
							</button>
							<button class="bingCell active" disabled>내 차<br>등록하기
								<span class="bingStamp">미션 완료</span>
							</button>
							<button class="bingCell active" disabled>청약일정<br>알림 ON
								<span class="bingStamp">미션 완료</span>
							</button>
							<button class="bingCell active" disabled>연말정산<br>결과 리뷰
								<span class="bingStamp">미션 완료</span>
							</button>
							<button class="bingCell active" disabled>건강검진<br>내역 보기
								<span class="bingStamp">미션 완료</span>
							</button>
							<button class="bingCell active" disabled>은행<br>자산연결
								<span class="bingStamp">미션 완료</span>
							</button>
							<button class="bingCell active" disabled>카드<br>가맹점정보<br>수집 동의
								<span class="bingStamp">미션 완료</span>
							</button>
							<button class="bingCell active" disabled>정기지출<br>관리
								<span class="bingStamp">미션 완료</span>
							</button>
							<button class="bingCell active" disabled>PUSH<br>알림 동의
								<span class="bingStamp">미션 완료</span>
							</button>
							<!-- 빙고 라인 -->
							<div class="bingLine dia01" style="display:block;"></div> <!-- 왼쪽 대각선줄 : dia01 -->
							<div class="bingLine dia02" style="display:block;"></div> <!-- 오른쪽 대각선줄 : dia02 -->
							<div class="bingLine ver01" style="display:block;"></div> <!-- 세로 첫번째줄 : ver01 -->
							<div class="bingLine ver02" style="display:block;"></div> <!-- 세로 두번째줄 : ver02 -->
							<div class="bingLine ver03" style="display:block;"></div> <!-- 세로 세번째줄 : ver03 -->
							<div class="bingLine hor01" style="display:block;"></div> <!-- 가로 첫번째줄 : hor01 -->
							<div class="bingLine hor02" style="display:block;"></div> <!-- 가로 두번째줄 : hor02 -->
							<div class="bingLine hor03" style="display:block;"></div> <!-- 가로 세번째줄 : hor03 -->
						</div>
						<div class="allBingo" style="display:block;"><span class="blind">bingo 완성</span></div> <!-- 모두 완료 시 display:block -->
					</div>
					<p class="rrNum">
						<span class="rrNumTit">완성된 빙고</span>
						<strong class="rrNumBox">1줄</strong>
					</p>
				</div>
			</div>

		<!-- -------------------------------------- -->
		<!-- [SECTION] BINGO미션 TIP -->
		<!-- -------------------------------------- -->

			<p class="defSubTit2"><strong class="bold">BINGO미션 TIP!</strong></p>

		<!-- -------------------------------------- -->

		<!-- -------------------------------------- -->

					</li>

						<a href="javascript:;" role="button">
							<span class="event-link">링크 복사하기</span>
						</a>
					</li>
				</ul>
			</div>
		</div>

<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script type="text/javascript">
	//샘플 : 케이스 화면 정의
	$(document).ready(function(){
		var a = ['타입1(MSHT7100)', '타입2(MSHT7100_B)', '타입3(MSHT7100_C)', '타입4(MSHT7100_D)']; // 케이스 명
		var b = ['MSHT7100', 'MSHT7100B', 'MSHT7100C', 'MSHT7100D']; // 함수 명
		var num = a.length; // 케이스 수
		uiCaseMenu(a,b,num);
		uiCaseMSHT7100();
	});

	//샘플 : 케이스 : 타입1
	function uiCaseMSHT7100(){uiCase('ty01')}

	//샘플 : 케이스 : 타입2
	function uiCaseMSHT7100B(){uiCase('ty02')}

	//샘플 : 케이스 : 타입3
	function uiCaseMSHT7100C(){uiCase('ty03')}

	//샘플 : 케이스 : 타입4
	function uiCaseMSHT7100D(){uiCase('ty04')}

	//샘플 : 케이스
	function uiCase(a){
		$('.bingo').removeClass('ty01 ty02 ty03 ty04').addClass(a);
		if(a != 'ty01'){
			$('.bingCell:not(:nth-child(1)):not(:nth-child(5)):not(:nth-child(9))').removeAttr('disabled').removeClass('active');
			$('.bingLine:not(.dia01), .allBingo').hide();
		}else{
			$('.bingCell').attr('disabled',true).addClass('active');
			$('.bingLine, .allBingo').show();
		}
	}
</script>
