<div class="nhasset popWrap fullLayerPop">
	<div class="popInner">
		<h1>공지사항</h1>
		<div class="popCont">
			<div class="eventViewTitie">
				<span class="title">NH마이데이터 서비스 일시 중단 안내</span>
				<div class="date">2021.08.04</div>
			</div>
			<div class="eventViewCont">
				<div class="eventImg template01">
                    <h2 class="nhLogo"><span class="blind">농협은행</span></h2>
                    <div class="titArea">
                        <span class="name">NH마이데이터</span>
                        <span class="txt">신규서비스 오픈 안내</span>
                    </div>
				</div>
				<p class="alarmDate">
					시스템 점검 기간
					<span>2022.08.01 00:00 ~ 2022.08.31 00:00</span>
				</p>
				<p>안녕하세요.</p>
				<p>NH마이데이터 서비스를 이용해 주셔서 감사합니다.</p>
				<p>해당 기관의 시스템 점검으로 인해 서비스가 원활하지 않을 수 있으니 이용에 참고해 주시기 바랍니다.</p>
				<p>감사합니다.</p>
			</div>
		</div>
		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
