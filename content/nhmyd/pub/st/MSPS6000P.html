<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 조회기간 설정 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner">
		<h1>조회조건 설정</h1> <!-- [수정 260507] [MD2605_042] [화면설계서 현행화] 관리센터_자산연결 내역안내 : 현행화작업 -> 텍스트 수정 -->
		<div class="popCont">
			<div class="transfer">
				<div class="formWrap">
					<ul class="searchFormWrap">
						<li>
							<div class="calendarForm">
								<div class="cal">
									<div class="inputList">
										<input type="tel" value="2023-01-01" title="조회 시작일" placeholder="시작일선택" readonly="readonly">
										<a href="javascript:;" class="btnCalendar" title="시작일 날짜선택" role="button"><span class="blind">날짜선택</span></a>
									</div>
								</div>
								<span class="symbol">-</span>
								<div class="cal">
									<div class="inputList">
										<input type="tel" value="2024-07-26" title="조회 종료일" placeholder="종료일선택" readonly="readonly">
										<!-- <a href="javascript:;" class="btnCalendar" title="종료일 날짜선택" role="button"><span class="blind">날짜선택</span></a> --> <!-- [삭제 260507] [MD2605_042] [화면설계서 현행화] 관리센터_자산연결 내역안내 : 현행화작업 -> 종료일 달력아이콘 삭제 -->
									</div>
								</div>
							</div>
							<div class="roundChkWrap mt15">
								<ul>
									<li>
										<span class="roundChk">
											<input type="radio" name="sample20" id="sample21" aria-label="조회기간(3개월)">
											<label for="sample21" aria-hidden="true">3개월</label>
										</span>
									</li>
									<li>
										<span class="roundChk">
											<input type="radio" name="sample20" id="sample22" aria-label="조회기간(6개월)">
											<label for="sample22" aria-hidden="true">6개월</label>
										</span>
									</li>
									<li>
										<span class="roundChk">
											<input type="radio" name="sample20" id="sample23" aria-label="조회기간(1년)">
											<label for="sample23" aria-hidden="true">1년</label>
										</span>
									</li>
									<li>
										<span class="roundChk">
											<input type="radio" name="sample20" id="sample24" aria-label="조회기간(2년)">
											<label for="sample24" aria-hidden="true">2년</label>
										</span>
									</li>
								</ul>
							</div>
						</li>
					</ul>
				</div>
			</div>
		</div>

		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn">조회</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다."><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
