<!-- ###################################### -->
<!-- ### [팝업] 당첨자 약관동의 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap fullLayerPop">
	<div class="popInner">
		<h1>당첨자 약관동의</h1>
		<div class="popCont grayPop">
			<!-- -------------------------------------- -->
			<!-- [SECTION] 상단문구 -->
			<!-- -------------------------------------- -->
			<h2 class="defTit icoEvent02">
				<strong>마이데이터 신규가입 이벤트<br>당첨을 축하드립니다</strong>
			</h2>
			<p class="subTxt">정보제공을 동의하고 당첨경품을 받으세요!</p>

			<!-- -------------------------------------- -->
			<!-- [SECTION] 입력영역 -->
			<!-- -------------------------------------- -->
			<div class="formWrap boxTypeWrap pt0">
				<div class="titListBox mt20">
					<ul>
						<li>
							<div class="formTitN"><strong>이벤트</strong></div>
							<div class="disTxtBox">
								<p>주택청약종합 고객 이벤트 하(夏)하 호(好)호 FESTIVAL</p>
							</div>
						</li>
						<li>
							<div class="formTitN"><strong>성명</strong></div>
							<div class="inputList disabled">
								<input type="text" title="성명(실명)을 입력" value="김농협" placeholder="성명(실명)을 입력하세요" readonly>
							</div>
						</li>
						<li>
							<div class="formTitN"><strong>휴대폰번호</strong></div>
							<div class="inputList">
								<input type="text" title="휴대폰번호" placeholder="‘-’없이 숫자만 입력하세요.">
							</div>
						</li>
						<li>
							<div class="formTitN"><strong>주소</strong></div>
							<div class="boxRadio">
								<div class="boxRadioInn">
									<span>
										<input name="rdo1" id="rdo11" type="radio" checked>
										<label for="rdo11">자택</label>
									</span>
								</div>
								<div class="boxRadioInn">
									<span>
										<input name="rdo1" id="rdo12" type="radio">
										<label for="rdo12">직장</label>
									</span>
								</div>
							</div>
							<div class="inputBoth01 addWrap">
								<div class="inputB01 inputList"><input type="text" title="우편번호" readonly></div>
								<div class="areaInpBtn">
									<button type="button" class="btnInpLine">주소검색</button>
								</div>
							</div>
							<div class="inputList">
								<input type="text" title="주소" placeholder="" readonly>
							</div>
							<div class="inputList">
								<input type="text" title="상세 주소" placeholder="상세 주소 입력">
							</div>
						</li>
					</ul>
				</div>
			</div>

			<!-- -------------------------------------- -->
			<!-- [SECTION] 동의영역 -->
			<!-- -------------------------------------- -->
			<div class="formWrap boxTypeWrap pt0">
				<div class="titListBox termBox">
					<ul>
						<li>
							<div class="formWrap selectAll">
								<div class="total">
									<div class="formHolder check">
										<input type="checkbox" id="type_chk01" class="chekTypeOther" checked>
										<label class="check" for="type_chk01">개인(신용)정보 수집&middot;이용&middot;제공 동의서</label>
									</div>
								</div>
							</div>
							<div class="frameBox">
								<iframe src="../../terms/3063_ms_agreement.html" width="100%" height="300px" frameborder="0"></iframe>
							</div>
						</li>
					</ul>
				</div>
			</div>
			<!-- -------------------------------------- -->
		</div>
		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" role="button">동의안함</a>
				<a href="javascript:;" class="confirmBtn" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
