<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">
<meta name="author" content="">
<meta name="content" content="">
<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>응모정보입력 | 이벤트 상세 | 이벤트 | MY</title>
<script src="../pub-assets/js/head.js"></script>
</head>
<body>
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1>이벤트 상세</h1>
		<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
		<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a>
	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] 이벤트 상세(응모정보입력) ### -->
	<!-- ###################################### -->
	<div class="container">
		<div class="formWrap mt0">
			<div class="boxTypeWrap">
				<!-- [이벤트 제목] -->
				<div class="eventViewTitle">
					<span class="title">NH마이데이터 오픈 서비스 이벤트</span>
					<div class="date">2021.08.04 ~ 2021.12.04</div>
				</div>

				<!-- [이벤트 내용] 이미지 -->
				<div class="eventImgBox">
					<img src="../../images/notice/img_event_new01.png" alt="대체 택스트 본문 내용과 똑같이 입력 필요">
				</div>

				<!-- [응모정보입력] -->
				<h2 class="boxMainTit mt20">응모정보 등록</h2>
				<div class="titListBox termBox">
					<ul>
						<li>
							<div class="txtb1">
								<strong>이름</strong>
							</div>
							<div class="inputList">
								<input type="text" title="이름" value="김농협" disabled>
							</div>
						</li>
						<li>
							<div class="txtb1">
								<strong>휴대폰번호</strong>
							</div>
							<div class="inputList"> <!-- [D] 에러인 경우 .error 추가-->
								<input type="tel" title="휴대폰번호" placeholder="'-' 없이 입력해주세요.">
								<a href="javascript:" class="btnReset" role="button">입력내용삭제</a>
							</div>
						</li>
						<li>
							<div class="formWrap selectAll">
								<div class="total">
									<div class="formHolder check">
										<input type="checkbox" id="type_chk01" class="chekTypeOther inputChecked" checked>
										<label class="check" for="type_chk01">개인정보 수집 및 이용에 동의합니다. (필수)</label>
									</div>
								</div>
							</div>
							<div class="grayBox">
								<strong class="subTit">농협은행 주식회사 귀중</strong>
								<p class="subTxt2">귀 행이 이벤트 진행을 위하여 본인의 개인정보를 수집·이용하는 경우에는 「 개인정보 보호법 」 제 15조 등 관련법령에 따라 본인의 동의가 필요합니다.</p>
							</div>
						</li>
					</ul>
				</div>

				<!-- [공유하기] -->
				<div class="shareIcoWrap mt30">
					<ul>
						<li class="event-kakao">
							<a href="javascript:;" role="button">
								<span class="event-kakao">카카오톡 공유하기</span>
							</a>
						</li>
						<li class="event-link">
							<a href="javascript:;" role="button">
								<span class="event-link">링크 복사하기</span>
							</a>
						</li>
					</ul>
				</div>
				<!-- // -->
			</div>
		</div>

		<!-- [응모하기] -->
		<div class="areaBtnDefault">
			<a href="javascript:;" class="btnPressPoint" role="button">응모하기</a>
		</div>
		<!-- // -->
	</div>
	<!-- ###################################### -->
</div>
</body>
</html>
