// [MD2504_047] 서비스 안내페이지 개선 S
//전체메인 가입전 모션
$(function(){
	$('.joinBeforeWrap').each(function(){
		var $this = $(this);
		var $titAreaHeight = $('.joinBeforeTitle').outerHeight()/2;
		var $headerHeight = $('.header').outerHeight();
		var $heightSum = $titAreaHeight;// + $headerHeight;
		$(window).on('scroll',function(){
			var $scrollTop = $('html, body').scrollTop();
			var $listOffset = $('.joinBeforeList').offset().top;
			//console.log($listOffset)
			if ($scrollTop > $heightSum) {
				$this.addClass('withFootBtn');
			}else{
				$this.removeClass('withFootBtn');
			}
			if ($scrollTop == 0) {
				$('.joinBeforeList > li').removeClass('active');
			}
		});
	});
	$(window).on('scroll', function(){
		var _scrollTop = $('html, body').scrollTop();
		var _header = $('.header h1').outerHeight();
		var _winHalf = $(window).height() / 2;
		var _sum = _scrollTop + _winHalf;
		$('.joinBeforeList > li').each(function(){
			var _thisTop = $(this).offset().top;
			console.log('section offset : '+ _thisTop);
			console.log('scrolltop : '+ _scrollTop);
			console.log('header : '+ _header);
			if (_thisTop <= _sum) {
				var _this = $(this);
				if (!_this.hasClass('active')) {
					_this.addClass('active');
				}
			}
		})
	})
})
