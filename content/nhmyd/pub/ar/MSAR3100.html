<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">
<meta name="author" content="">
<meta name="content" content="">
<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>사전안내 | 서비스 가입 | 유틸</title>
<script type="text/javascript" src="../pub-assets/js/head.js"></script>
</head>
<body>
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<h1>서비스 가입</h1>
		<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
		<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a>
	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] 사전안내 ### -->
	<!-- ###################################### -->
	<div class="container">
		<!-- -------------------------------------- -->
		<!-- [SECTION] 상단문구 -->
		<!-- -------------------------------------- -->
		<h2 class="defTit">NH마이데이터 서비스 이용을 위해 <br><strong>이용약관을 확인</strong>해주세요</h2>
		<div class="topInfo">
			<p class="infoTxt">서비스 가입 전 신중히 고민하고 필요한 서비스만 <br>가입해주세요. 이용하지 않는 서비스는 언제든지 <br>해지할 수 있어요.</p>
			<a href="https://www.mydatacenter.or.kr" target="_blank" title="외부 브라우저 열림" class="linkType1">마이데이터 가입현황 확인</a>
		</div>

		<!-- -------------------------------------- -->
		<!-- [SECTION] 가입약관 -->
		<!-- -------------------------------------- -->
		<div class="formWrap selectAll">
			<div class="total">
				<div class="formHolder check" id="essential_totalHolder">
					<input type="checkbox" id="essential_total" class="chekTypeOther">
					<label class="check" for="essential_total"> 전체동의</label>
				</div>
			</div>		
			<div class="cont">	
				<div class="formHolder check">
					<input type="checkbox" id="essential_0">
					<label class="check" for="essential_0"><em>[필수] </em>NH마이데이터 서비스 이용 약관</label>
					<a href="javascript:;" role="button" class="btnView"><span class="blind">약관보기</span></a>
				</div>
				<div class="formHolder check">
					<input type="checkbox" id="essential_1">
					<label class="check" for="essential_1"><em>[필수] </em>개인(신용)정보 수집·이용 동의서(NH마이데이터 서비스)</label>
					<a href="javascript:;" role="button" class="btnView"><span class="blind">약관보기</span></a>
				</div>
			</div>
			<div class="mt20"><a href="javascript:;" class="linkType1">개인정보 처리방침</a></div>                      
		</div>

		<!-- -------------------------------------- -->
		<!-- [SECTION] 권유직원 -->
		<!-- -------------------------------------- -->
		<div class="formWrap boxTypeWrap">
			<ul>
				<li class="addrSrch">
					<strong class="formTit">권유직원 (선택)</strong>
					<div class="inputList">
						<input type="text" class="inptText" title="이름(사번)입력" placeholder="이름(사번)을 입력해 주세요." readonly>
						<button class="btnSearch"><span class="blind">찾기</span></button>
					</div>		
				</li>
			</ul>
		</div>

		<!-- -------------------------------------- -->
		<!-- [SECTION] 추천인 -->
		<!-- -------------------------------------- -->
		<div class="formWrap boxTypeWrap">
			<ul>
				<li>
				<strong class="formTit">추천인</strong>
					<div class="inputList">
						<input type="text" title="이름(사번)입력" value="김*천" readonly>
					</div>
				</li>
			</ul>
		</div>

		<!-- -------------------------------------- -->
		<!-- [SECTION] 하단버튼 -->
		<!-- -------------------------------------- -->
		<div class="areaBtnDefault">
			<a href="javascript:;" class="btnPressPoint disabled" aria-disabled="true" role="button">가입하기</a> <!-- [D] 활성화 : 클래스명(disabled) / aria-disabled="true" 삭제 -->
		</div>
		<!-- -------------------------------------- -->
	</div>
	<!-- ###################################### -->
</div>
</body>
</html>
