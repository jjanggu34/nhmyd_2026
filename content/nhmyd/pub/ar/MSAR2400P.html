<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">

<meta name="content" content="">
<meta name="keywords" content="농협자산관리">

<title>[P] 주소 검색</title>

$(function(){
	fullLayerPop();
});
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 주소 검색 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap fullLayerPop" role="dialog">
	<div class="popInner">
		<h1>주소 검색</h1>
		<div class="popCont">
			<!-- -------------------------------------- -->
			<!-- [SECTION] 도로명 입력 -->
			<!-- -------------------------------------- -->
			<div class="formWrap">
				<ul>
					<li class="addrSrch">
						<div class="txtt2 mb15"><strong>도로명 주소 찾기</strong></div>
						<div class="inputList">
							<input type="text" title="도로명 주소 찾기" value="" placeholder="">
							<a href="javascript:" class="btnReset" role="button">입력내용삭제</a>
							<button class="btnSearch"><span class="blind">찾기</span></button>
						</div>
					</li>
				</ul>
			</div>

			<!-- -------------------------------------- -->
			<!-- [SECTION] 검색결과 -->
			<!-- -------------------------------------- -->
			<!-- [CASE] 검색결과있는경우 -->
			<div class="searchResultWrap type02">
				<ul class="searchResultList">
					<li>
						<a href="javascript:;" role="button">
							<span class="title">경기도 의왕시 청계동 657
								경기도 의왕시 성고개로 59 (포일동)</span>
							<span class="subTxt">16006 (16006)</span>
						</a>
					</li>
					<li>
						<a href="javascript:;" role="button">
							<span class="title">경기도 의왕시 청계동 657
								경기도 의왕시 성고개로 59 (포일동)</span>
							<span class="subTxt">16006 (16006)</span>
						</a>
					</li>
					<li>
						<a href="javascript:;" role="button">
							<span class="title">경기도 의왕시 청계동 657
								경기도 의왕시 성고개로 59 (포일동)</span>
							<span class="subTxt">16006 (16006)</span>
						</a>
					</li>
				</ul>
			</div>

			<!-- [CASE] 검색결과없는경우 -->
			<div class="noResultWrap">
				<p>검색 결과가 없습니다.</p>
			</div>
			<!-- -------------------------------------- -->
		</div>

		<div class="popBtnWrap">
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>

<!-- ###################################### -->
<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script type="text/javascript">
	$('.searchResultList a').click(function(){
		var $this = $(this);
		$this.closest('.searchResultList').find('li').removeClass('active')
		$this.closest('li').addClass('active')
	});
</script>
<!-- ###################################### -->
</body>
</html>
