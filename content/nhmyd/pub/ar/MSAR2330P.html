<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">
<meta name="author" content="">
<meta name="content" content="">
<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>[P] 직업 직위명 선택</title>
<script src="../pub-assets/js/head.js"></script>
<script>
	$(document).ready(function(){
		slidePopOption();
	})
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 직업 직위명 선택 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopOption">
	<div class="dim"></div>
	<div class="popInner">
		<h1>직업 직위명 선택</h1>
		<div class="popCont">
			<ul class="selectList">
				<li class="active"><button type="button" title="선택됨">고위공무원단(1&middot;2급)</button></li> <!-- [D] 선택됨  -->
				<li><button type="button">부이사관(3급)</button></li>
				<li><button type="button">서기관(4급)</button></li>
				<li><button type="button">사무관(5급)</button></li>
				<li><button type="button">주사(보)(6&middot;7급)</button></li>
				<li><button type="button">서기(보)(8&middot;9급)</button></li>
				<li><button type="button">장학관(사)</button></li>
				<li><button type="button">교육연구관(사)</button></li>
				<li><button type="button">연구직</button></li>
				<li><button type="button">지도직</button></li>
				<li><button type="button">전문(경력)관</button></li>
				<li><button type="button">미공개</button></li>
			</ul>
		</div>

		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" role="button" class="confirmBtn" >선택하기</a><!--  [D] 비활성화 시 : 클래스명(disabled) 및 aria-disabled="true" 추가 : 하단 샘플 스크립트 참고  -->
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다."><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>

<!-- ###################################### -->
<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script>
	$(document).ready(function(){
		//샘플 : 항목 선택된 상태 title 변경
		$('.selectList button').on('click',function(){
			if($(this).attr('title') == '선택됨'){
				$(this).removeAttr('title');
				$(this).parent('li').removeClass('active');
				$('.confirmBtn').addClass('disabled').attr('aria-disabled', 'true'); //선택하기 버튼 비활성화 샘플
			}else if(!$(this).attr('title')){
				$(this).attr('title', '선택됨');
				$(this).parent('li').addClass('active').siblings().removeClass('active').find('>button').removeAttr('title');
				$('.confirmBtn').removeClass('disabled').removeAttr('aria-disabled'); //선택하기 버튼 활성화 샘플
			}
		});
	})
</script>
<!-- ###################################### -->
</body>
</html>
