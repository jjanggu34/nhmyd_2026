	<div class="container">

		<!-- [SECTION] 상단영역 -->

		<div class="boxTypeWrap">
			<div class="lf_bgWrap1">

			</div>
			<div class="lf boxRadio mt10">
				<div class="boxRadioInn">
					<span>

				</div>
				<div class="boxRadioInn">
					<span>

					</span>
				</div>
			</div>
		</div>

		<!-- -------------------------------------- -->
		<!-- [SECTION] 입력영역 -->
		<!-- -------------------------------------- -->
		<div class="formWrap boxTypeWrap familyBox pt10">
			<ul>
				<li>
					<div class="fam_select_del_wrap">
						<strong class="formTit mt0">부</strong>
						<div><button type="button" class="contBtn01">삭제</button></div>
					</div>
					<div class="fieldGroup">
						<div class="inputList">
							<a href="javascript:;" title="부 생년월일 선택" aria-haspopup="true">
								<span class="selectValue placeholder">생년월일</span>
								<span class="selectBtn"></span>
							</a>
							<select name="" title="선택해주세요">
								<option value=""></option>
							</select>
						</div>
					</div>
				</li>
				<li>
					<div class="fam_select_del_wrap">
						<strong class="formTit mt0">모</strong>
						<div><button type="button" class="contBtn01">삭제</button></div>
					</div>
					<div class="fieldGroup">
						<div class="inputList">
							<a href="javascript:;" title="모 생년월일 선택" aria-haspopup="true">
								<span class="selectValue placeholder">생년월일</span>
								<span class="selectBtn"></span>

					</div>
					<div class="fieldGroup">
						<div class="inputList">
							<a href="javascript:;" title="배우자 생년월일 선택" aria-haspopup="true">
								<span class="selectValue placeholder">생년월일</span>
								<span class="selectBtn"></span>
							</a>
							<select name="" title="선택해주세요">
								<option value=""></option>
							</select>
						</div>
					</div>
				</li>
				<li>
					<div class="fam_select_del_wrap">
						<strong class="formTit mt0">자녀</strong>
						<div><button type="button" class="contBtn01">삭제</button></div>
					</div>
					<div class="fieldGroup">
						<div class="fieldGroup d-flex">
							<div class="formArray">
								<span class="chkRadio">
									<input type="radio" id="sample003" name="sample01" checked>
									<label for="sample003">남</label>
								</span>
								<span class="chkRadio">
									<input type="radio" id="sample004" name="sample01">

							</div>
							<div class="cs inputList">
								<a class="bdbNone" href="javascript:;" title="자녀 생년월일 선택" aria-haspopup="true">

							<div class="itemWrap formHolder">
								<div class="deductBtnWrap">
									<button type="button" class="minusBtn"><span class="blind">자녀수 빼기</span></button>
									<span class="deductNum"><em>0</em></span>
									<button type="button" class="plusBtn"><span class="blind">자녀수 더하기</span></button>
								</div>
							</div>
						</div>
					</div>

			<div class="listBtnMore mt20">
				<a href="javascript:;" class="btnBodyLine" role="button">+ 가족추가</a>
