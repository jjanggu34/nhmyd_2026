<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">
<meta name="author" content="">
<meta name="content" content="">
<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>[P] 차량등록</title>
<script type="text/javascript" src="../pub-assets/js/head.js"></script>
<script type="text/javascript">
$(function(){
	fullLayerPop();
});
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 차량등록 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap fullLayerPop" role="dialog">
	<div class="popInner">
		<h1>차량등록</h1>
		<div class="popCont grayPop">
			<h2 class="defTit">차량관리를 위해<br>내차 정보를 입력해주세요</h2>

			<!-- -------------------------------------- -->
			<!-- [SECTION] 차량번호 입력 -->
			<!-- -------------------------------------- -->
			<div class="formWrap boxTypeWrap">
				<div class="titListBox">
					<ul>
						<li>
							<div class="defSubTit2 borderNone"><strong>차량번호</strong></div>
							<div class="inputList">
								<input type="text" title="차량번호 입력" value="00갸1234" placeholder="">
								<a href="javascript:" class="btnReset" role="button">입력내용삭제</a>
							</div>
						</li>
					</ul>
				</div>
			</div>

			<!-- -------------------------------------- -->
			<!-- [SECTION] 동의영역 -->
			<!-- -------------------------------------- -->
			<div class="boxTypeWrap">
				<div class="formWrap selectAll mt0 pd0">
					<div class="total">
						<div class="formHolder check">
							<input type="checkbox" id="type_all01" class="chekTypeOther">
							<label class="check" for="type_all01">전체동의</label>
						</div>
					</div>
					<div class="cont">
						<div class="formHolder check">
							<input type="checkbox" id="type01">
							<label class="check" for="type01"><em>[필수]</em> 개인(신용)정보 수집·이용 동의서 (NH마이데이터 서비스(내차관리))</label>
							<a href="javascript:;" class="btnView" role="button" title="[필수] 개인(신용)정보 수집·이용 동의서 (NH마이데이터 서비스(내차관리))"><span class="blind">약관보기</span></a>
						</div>
						<div class="formHolder check">
							<input type="checkbox" id="type02">
							<label class="check" for="type02"><em>[필수]</em> 개인(신용)정보 제3자 제공 동의서(내차관리)</label>
							<a href="javascript:;" class="btnView" role="button" title="[필수] 개인(신용)정보 제3자 제공 동의서(내차시세)"><span class="blind">약관보기</span></a>
						</div>
					</div>
				</div>
			</div>
			<!-- -------------------------------------- -->
		</div>

		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
</body>
</html>
