<body>
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" role="button" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1>맞춤정보 등록</h1>
		<!-- [MD2509_104] 프로세스 진행 화면 헤더 영역 변경 -->
		<a href="javascript:;" role="button" class="btnCancle"><span class="blind">취소</span></a>
	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] 맞춤정보 등록(자동등록) ### -->
	<!-- ###################################### -->
	<div class="container">
		<!-- -------------------------------------- -->
		<!-- [SECTION] 상단영역 -->
		<!-- -------------------------------------- -->
		<div class="boxTypeWrap overUnset">
			<div class="lf_bgWrap1">
				<div class="defTit mt0">
					<h2><strong>가족 정보를<br>확인</strong>해주세요</h2>
					<div class="tooltipWrap">
						<button type="button" class="toolTipBtn" onclick="tooltipOpen($(this))"><span class="blind">등록 툴팁 열기</span></button>
						<div class="tooltipCont w100p">
							<p>맞춤정부혜택 서비스는 본인, 부모, 배우자, 자녀에 대한 맞춤혜택을 제공합니다.</p>
							<button type="button" class="close" onclick="tooltipClose($(this))"><span class="blind">툴팁 닫기</span></button>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- -------------------------------------- -->
		<!-- [SECTION] 입력영역 -->
		<!-- -------------------------------------- -->
		<div class="formWrap boxTypeWrap familyBox pt10">
			<ul>
				<li>
					<strong class="formTit mt0">본인</strong>
					<div class="fieldGroup">
						<div class="fieldGroup d-flex">
							<div class="formArray">
								<span class="chkRadio">
									<input type="radio" id="sample0034" name="sample001" checked disabled>
									<label for="sample0034">남</label>
								</span>
								<span class="chkRadio">
									<input type="radio" id="sample004" name="sample001" disabled>
									<label for="sample004">여</label>
								</span>
							</div>
							<div class="cs inputList disabled">
								<input type="text" title="생년월일" readonly value="2022.10.03">
							</div>
						</div>
					</div>
				</li>
				<li>
					<div class="fieldGroup mb10">
						<div class="fam_select_del_wrap">
							<div class="inputList">
								<a href="javascript:;" title="가족선택" aria-haspopup="true">
									<span class="selectValue placeholder">가족선택</span>
									<span class="selectBtn"></span>
								</a>
								<select title="선택해주세요">
									<option value=""></option>
								</select>
							</div>
							<div><button type="button" class="contBtn01">삭제</button></div>
						</div>
					</div>
					<div class="fieldGroup">
						<div class="fieldGroup d-flex">
							<div class="formArray">
								<span class="chkRadio">
									<input type="radio" id="sample003" name="sample02" checked disabled>
									<label for="sample023">남</label>
								</span>
								<span class="chkRadio">
									<input type="radio" id="sample004" name="sample02" disabled>
									<label for="sample024">여</label>
								</span>
							</div>
							<div class="cs inputList disabled">
								<input type="text" title="생년월일" readonly value="2022.10.03">
							</div>
						</div>
					</div>
				</li>
			</ul>
		</div>

		<!-- -------------------------------------- -->
		<!-- [SECTION] 하단버튼 -->
		<!-- -------------------------------------- -->
		<div class="areaBtnDefault">
			<a href="javascript:;" class="btnPressPoint" role="button">저장</a>
		</div>
		<!-- -------------------------------------- -->
	</div>
	<!-- ###################################### -->
</div>
