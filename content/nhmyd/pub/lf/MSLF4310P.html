<title>[P] 리콜정보</title>

$(function(){
    fullLayerPop();
});

<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>
 
<!-- ###################################### -->
<!-- ### [팝업] 리콜정보 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap fullLayerPop" role="dialog">
	<div class="popInner">
		<h1>리콜정보</h1>
		<div class="popCont grayPop">
			<div class="boxTypeWrap">
				<div class="carRecallTitle">
					<span class="carRecallNum carBookMark">대표차량(123가4567)</span><!-- [D] 대표차량 carBookMark 클래스 사용 -->
					<span class="carRecallInfo">전체 <em>2</em>건 / 미완료 <em class="pointColor">1</em>건</span>
				</div>
				<!-- [CASE] 정보가 있는 경우 -->
				<ul class="carRecallList">
					<li>
						<a href="javascript:;" role="button">
							<span class="carRecallSubject">
								<span class="title">[비엠더블유] BMW 1 Series Sport 등 57차종- 배기가스재순환창치 관련 리콜 </span>
								<span class="date">2021.11.29~</span>
							</span>
							<span><em class="tag red">미완료</em></span>
						</a>
					</li>
					<li>
						<a href="javascript:;" role="button">
							<span class="carRecallSubject">
								<span class="title">[비엠더블유] BMW 1 Series Sport 등 57차종- 배기가스재순환창치 관련 리콜 </span>
								<span class="date">2021.11.29~</span>
							</span>
							<em class="tag gray">완료</em>
						</a>
					</li>
				</ul>

				<!-- [CASE] 정보가 없는 경우 -->
				<div class="noResultWrap"><p>리콜 정보가 없습니다.</p></div>
				<!-- // -->
			</div>
			<p class="subTxt7 mt10 ar">제공:자동차리콜센터</p> <!-- [현행화_2024] 운영소스 현행화 -->
		</div>

		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
</body>
</html>
