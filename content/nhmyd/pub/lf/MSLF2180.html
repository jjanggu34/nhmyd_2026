<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>등록방식 수정 | 맞춤정부혜택 | 생활편의</title>
<script type="text/javascript" src="../pub-assets/js/head.js"></script>
</head>
<body>
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1>등록방식 수정</h1>
		<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
		<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a>
	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] 등록방식 수정 ### -->
	<!-- ###################################### -->
	<div class="container">
		<!-- -------------------------------------- -->
		<!-- [SECTION] 상단영역 -->
		<!-- -------------------------------------- -->
		<div class="boxTypeWrap pt0">
			<h2 class="defTit mt20"><strong>맞춤정부혜택에<br>사용할 정보를</strong> 관리합니다</h2>
			<div class="lfimgBg1"></div>
			<div class="areaBodyBtnFull mt10">
				<a href="javascript:;" class="btnBodyLine" role="button">가족정보 자동등록</a>
			</div>
		</div>

		<!-- -------------------------------------- -->
		<!-- [SECTION] 정보수집현황 -->
		<!-- -------------------------------------- -->
		<div class="lf boxTypeWrap">
			<div class="lf_update mb0 d-flex">
				<div>
					정보 수집현황
					<div class="tooltipWrap">
						<button type="button" class="toolTipBtn" onclick="tooltipOpen($(this))"><span class="blind">정보 수집현황 안내 툴팁 열기</span></button>
						<div class="tooltipCont">
							<p>정보를 수정하신 고객은 등록한 정보가<br />사라질 수 있습니다.</p>
							<button type="button" class="close" onclick="tooltipClose($(this))"><span class="blind">툴팁 닫기</span></button>
						</div>
					</div>
				</div>
				<div>
					<button type="button" class="updateBtn3" title="데이터 업데이트"></button>
				</div>
			</div>
			<hr class="divLine03">
			<div class="mt20">
				<ul>
					<li>
						<strong class="tit">정부24</strong>
						<!-- [CASE] 정상 -->
						<dl class="d-flex mt20">
							<dt class="pointColor9">주민등록등본</dt>
							<dd>2021.04.06</dd>
						</dl>
						<!-- [CASE] 실패 -->
						<dl class="d-flex mt20">
							<dt class="pointColor9">주민등록등본</dt>
							<dd><a href="javascript:;" class="send_fail">실패</a></dd>
						</dl>
						<!-- [CASE] 미등록 -->
						<dl class="d-flex mt20">
							<dt class="pointColor9">주민등록등본</dt>
							<dd><a href="javascript:;" class="t_send_fail">미등록</a></dd>
						</dl>
						<!-- // -->
					</li>
				</ul>
			</div>
		</div>
		<!-- -------------------------------------- -->
	</div>
	<!-- ###################################### -->
</div>
</body>
</html>
