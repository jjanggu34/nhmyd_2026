<title>직업선택 | 맞춤정보 등록 | 가족정보등록 | 맞춤정부혜택 | 생활편의</title>
<script type="text/javascript" src="../pub-assets/js/head.js"></script>
</head>
<body>
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" role="button" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1>맞춤정보 등록</h1>
		<!-- [MD2509_104] 프로세스 진행 화면 헤더 영역 변경 -->
		<a href="javascript:;" role="button" class="btnCancle"><span class="blind">취소</span></a>
	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] 맞춤정보 등록(직업선택) ### -->
	<!-- ###################################### -->
	<div class="container">
		<div class="boxTypeWrap">
			<div class="lf_bgWrap3">
				<h2 class="defTit mt0"><strong>직업을<br>선택</strong>해주세요</h2>
			</div>
			<div class="peoplePick mg0 mt20">
				<ul class="lf pickList">
					<li role="button" aria-label="직장인/사업자" title="선택시 가족정보등록 페이지로 이동">	
						<input type="radio" name="pick001" id="rdo01" checked="checked">	
						<label for="rdo01" class="rdoCheck">
							<span class="txt">
								<em class="tit">직장인/사업자</em>
							</span>
						</label>
					</li>
					<li role="button" aria-label="취업준비생/실업자" title="선택시 가족정보등록 페이지로 이동">	
						<input type="radio" name="pick001" id="rdo02">	
						<label for="rdo02" class="rdoCheck">
							<span class="txt">
								<em class="tit">취업준비생/실업자</em>
							</span>
						</label>
					</li>
					<li role="button" aria-label="대학생/대학원생" title="선택시 가족정보등록 페이지로 이동">	
						<input type="radio" name="pick001" id="rdo03">	
						<label for="rdo03" class="rdoCheck">
							<span class="txt">
								<em class="tit">대학생/대학원생</em>
							</span>
						</label>
					</li>
					<li role="button" aria-label="농업인" title="선택시 가족정보등록 페이지로 이동">	
						<input type="radio" name="pick001" id="rdo04">	
						<label for="rdo04" class="rdoCheck">
							<span class="txt">
								<em class="tit">농업인</em>
							</span>
						</label>
					</li>
					<li role="button" aria-label="임업인" title="선택시 가족정보등록 페이지로 이동">	
						<input type="radio" name="pick001" id="rdo05">	
						<label for="rdo05" class="rdoCheck">
							<span class="txt">
								<em class="tit">임업인</em>
							</span>
						</label>
					</li>
					<li role="button" aria-label="어업인" title="선택시 가족정보등록 페이지로 이동">	
						<input type="radio" name="pick001" id="rdo06">	
						<label for="rdo06" class="rdoCheck">
							<span class="txt">
								<em class="tit">어업인</em>
							</span>
						</label>
					</li>
					<li role="button" aria-label="축산업인" title="선택시 가족정보등록 페이지로 이동">	
						<input type="radio" name="pick001" id="rdo07">	
						<label for="rdo07" class="rdoCheck">
							<span class="txt">
								<em class="tit">축산업인</em>
							</span>
						</label>
					</li>
					<li role="button" aria-label="그 외" title="선택시 가족정보등록 페이지로 이동">	
						<input type="radio" name="pick001" id="rdo08">	
						<label for="rdo08" class="rdoCheck">
							<span class="txt">
								<em class="tit">그 외</em>
							</span>
						</label>
					</li>
				</ul>
			</div>
		</div>
	</div>

</div>
