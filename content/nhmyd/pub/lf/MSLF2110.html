			<ul>
				<li>
					<div class="buble_img"><img src="../../images/common/img_male02_2.png" alt="" /></div>
					<div class="buble">
						<p><span class="pointColor undertext">NH마이데이터 맞춤정부혜택</span><br />으로 우리 가족 모든 혜택을<br />알아볼 수 있어요!</p>
					</div>
				</li>
				<li>

			</ul>
