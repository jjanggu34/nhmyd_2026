<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">
<meta name="author" content="">
<meta name="content" content="">
<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>검색 | 머니 캘린더 | 소비</title>
<script src="../pub-assets/js/head.js"></script>
</head>
<body>
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1>머니 캘린더</h1>
		<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
		<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a>
	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] 검색 ### -->
	<!-- ###################################### -->
	<div class="container">
		<div class="boxTypeWrap formWrap pb10">
			<!-- -------------------------------------- -->
			<!-- [상단영역] 검색어 입력 -->
			<!-- -------------------------------------- -->
			<div class="totalBalance mt0">
				<div class="searchBox">
					<strong>거래내용을<br />검색해보세요</strong>
				</div>
			</div>
			<div class="inputList mt20 addrSrch">
				<input type="text" title="검색어 입력" value="" placeholder="2자 이상 검색 (예: 급여, 하나로마트 등)">
				<a href="javascript:" class="btnReset" role="button">입력내용삭제</a>
				<button class="btnSearch"><span class="blind">찾기</span></button>
			</div><hr class="bdT3">

			<!-- [검색날짜] -->
			<div class="filterWrap pt0">
				<div><span class="sortValue">2020.09.01 ~ 2020.09.30</span></div>
				<div><button type="button" class="sortBtn"><span class="blind">조회조건 선택 설정하기</span></button></div>
			</div>

			<!-- -------------------------------------- -->
			<!-- [결과영역] 검색결과 -->
			<!-- -------------------------------------- -->
			<!-- [검색어] -->
			<div class="filterSearch" aria-label="적요검색">
				<div class="filterSearchRes" >‘길동’ 검색결과 총 <span class="pointColor">1건</span></div>
			</div>

			<!-- [검색목록] -->
			<div class="inoutListWrap"><p class="date">7월 31일 목요일</p></div>
			<div class="cardSpendList mt0">
				<div class="inoutListWrap">
					<div class="inoutListInn">
						<ul class="inoutList">
							<li>
								<a href="javascript:;" class="link" role="button">
									<div class="isCategory">
										<div class="imgWrap icoCate">
											<span class="img">
												<img src="../../images/category/cs/ico_cate_cs01.png" alt="외식">
											</span>
										</div>
										<div class="textWrap">
											<div class="inoutTit">
												<span class="use">한솥도시락</span>
												<span class="amount cancel"><strong class="dataValue">-140,000</strong><em class="won">원</em></span>
											</div>
											<div class="inoutCont">
												<div class="timeWrap">
													<span class="time">10:30<span class="tit">카카오뱅크</span></span>
												</div>
											</div>
										</div>
									</div>
								</a>
							</li>
							<li>
								<a href="javascript:;" class="link" role="button">
									<div class="isCategory">
										<div class="imgWrap icoCate">
											<span class="img">
												<img src="../../images/category/cs/ico_cate_cs01.png" alt="외식">
											</span>
										</div>
										<div class="textWrap">
											<div class="inoutTit">
												<span class="use">한솥도시락 한솥도시락 한솥도시락 한솥도시락</span>
												<span class="amount"><em class="won">USD</em> <strong class="dataValue">80,000.113</strong></span>
											</div>
											<div class="inoutCont">
												<div class="timeWrap">
													<span class="time">10:30<span class="tit">카카오뱅크</span></span>
												</div>
											</div>
										</div>
									</div>
								</a>
							</li>
						</ul>
					</div>
				</div>
			</div>

			<!-- [거래내용없음] -->
			<div class="noResultWrap mb35">
				<p>조회할 내역이 없어요</p>
			</div>
			<!-- // -->
			<!-- -------------------------------------- -->
		</div>
	</div>
	<!-- ###################################### -->
</div>
</body>
</html>
