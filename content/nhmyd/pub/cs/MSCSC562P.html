<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">

<meta name="content" content="">
<meta name="keywords" content="농협자산관리">

<meta http-equiv="Expires" content="-1">
<title>[P] 금액 수정</title>
<script src="../pub-assets/js/head.js"></script>
<script>
	$(function(){
		slidePopConfirm();
	})
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 금액 수정 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner" >
		<h1>금액 수정</h1>
		<div class="popCont">
			<div class="cs_pop_list">
				<!-- [CASE] 원화 -->
				<div class="formWrap mt0">
					<div class="inputList"> <!-- [D] 오류일 경우 클래스명(error) 추가 -->
						<div class="inputDallorText">-</div>
						<input type="tel" title="금액" value="10,000" placeholder="금액을 입력해주세요">
						<span class="unit">원</span>
						<a href="javascript:" class="btnReset" role="button" style="display: none;">입력내용삭제</a>
					</div>
					<!-- <p class="errorTxt">1부터 999,999,999까지 입력 가능합니다.</p> -->
				</div>

				<!-- [CASE] 외화 -->
				<div class="formWrap">
					<div class="inputList error">
						<div class="inputDallorText">-</div>
						<div class="inputDallorText ml10">USA</div>
						<input type="tel" title="금액" value="8.90" placeholder="금액을 입력해주세요">
						<a href="javascript:" class="btnReset" role="button" style="display: none;">입력내용삭제</a>
					</div>
					<p class="errorTxt">1부터 999,999,999까지 입력 가능합니다.</p>
				</div>
				<!-- // -->
				
				<!-- 
				<div class="formArray mt30">
					<div class="mt10">
						<input type="checkbox" id="listAll" class="chekTypeOther" name=""><label for="listAll">앞으로 동일 이름, 금액 건은 자동 수정하기</label>
					</div>
				</div>
				-->
			</div>
		</div>

		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
</body>
</html>
