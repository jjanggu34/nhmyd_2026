<!-- ###################################### -->
<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script type="text/javascript">
	$('.nhasset .selectCerti .e li input[type="radio"]').each(function(){
		var $this = $(this);
		$this.on('change',function(){
			var _checked = $this.is(':checked');
			if (_checked) {
				var $thisIndex = $this.closest('div.e').index();
				$('.cate_SubWrap').hide();
				$(this).closest('.wrapCataWrap').find('.cate_SubWrap').eq($thisIndex).slideDown(300).find('.formTit').attr('tabindex','-1').focus();
				var $thisPos = $this.closest('.selectCerti').position().top;
				$('.popCont').animate({ scrollTop: $thisPos },{}, 300);
			}
		})
	});
	$(document).ready(function(){
		var selecWidth = $('.selectCerti').width() - 7.9;
		$('.info_area').css('width', selecWidth).hide()
		$('.e').click(function(){
			$('.info_area').css('margin-left', '0');
			$('.e > .info_area').hide();
			$(this).children('.info_area').stop().slideDown('fast')
		})
	})
</script>
