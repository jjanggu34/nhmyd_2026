<meta charset="utf-8">

<title>[P] 조회조건설정 | 머니 캘린더</title>
<script src="../pub-assets/js/head.js"></script>
<script>
	$(document).ready(function(){
		slidePopConfirm();
	})  
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 조회조건설정 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner">
		<h1>조회조건 설정</h1>
		<div class="popCont">
			<div class="popSelWrap">
				<strong class="formTit bdNone mt0 ">거래구분</strong>
				<div class="addrSelectWrap">
					<div class="boxCheck">
						<div class="boxChkInn">
							<input name="chksel" id="MSCS2500P1" type="checkbox" aria-label="거래구분(신용카드)" checked>
							<label for="MSCS2500P1" aria-hidden="true">신용카드</label> 
						</div>
						<div class="boxChkInn">
							<input name="chksel" id="MSCS2500P2" type="checkbox" aria-label="거래구분(체크카드)" checked>
							<label for="MSCS2500P2" aria-hidden="true">체크카드</label>
						</div>
						<div class="boxChkInn">
							<input name="chksel" id="MSCS2500P3" type="checkbox" aria-label="거래구분(페이결제)" checked>
							<label for="MSCS2500P3" aria-hidden="true">페이결제</label>
						</div>
						<div class="boxChkInn">
							<input name="chksel" id="MSCS2500P4" type="checkbox" aria-label="거래구분(선불카드)" checked>
							<label for="MSCS2500P4" aria-hidden="true">선불카드</label>
						</div>
						<div class="boxChkInn">
							<input name="chksel" id="MSCS2500P5" type="checkbox" aria-label="거래구분(계좌)" checked>
							<label for="MSCS2500P5" aria-hidden="true">계좌</label> 
						</div>
						<div class="boxChkInn">
							<input name="chksel" id="MSCS2500P6" type="checkbox" aria-label="거래구분(현금)" checked>
							<label for="MSCS2500P6" aria-hidden="true">현금</label>
						</div>
					</div>
				</div>
			</div>
		</div>				

		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">조회</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
</body>
</html>
