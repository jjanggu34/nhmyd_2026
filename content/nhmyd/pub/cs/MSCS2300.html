<script type="text/javascript">
	//달력 스와이프
	var swiper = new Swiper(".calenderInfoWrap", {
		spaceBetween: 10,
		slidesPerView: 1,
		observer: true,
		observeParents: true,
		a11y : false,
		effect: "fade",
		touchRatio: 0,	//touch move 비활성
		freeMode: true,
		watchSlidesProgress: true,
		on: {
			init: function () {
				$('.calenderInfoWrap .swiper-slide').attr('aria-hidden', 'true')
				$('.calenderInfoWrap .swiper-slide-active').attr('aria-hidden', 'false')
			},
			transitionEnd: function () {
				$('.calenderInfoWrap .swiper-slide').attr('aria-hidden', 'true')
				$('.calenderInfoWrap .swiper-slide-active').attr('aria-hidden', 'false')
			}
		}
	});
	var swiper2 = new Swiper(".dateItemWrap", {
		initialSlide :0, //시작슬라이드 번호 0부터 시작
		spaceBetween: 10,
		observer: true,
		observeParents: true,
		autoHeight : true,
		a11y : false,
		pagination: {
			el: ".swiper-pagination",
		},
		navigation: {
			nextEl: ".btn-month-next",
			prevEl: ".btn-month-prev",
		},
		thumbs: {
			swiper: swiper,
		},
		on: {
			init: function () {
				$('.dateItemWrap .swiper-slide').attr('aria-hidden', 'true')
				$('.dateItemWrap .swiper-slide-active').attr('aria-hidden', 'false')
			},
			transitionEnd: function () {
				$('.dateItemWrap .swiper-slide').attr('aria-hidden', 'true')
				$('.dateItemWrap .swiper-slide-active').attr('aria-hidden', 'false')
			}
		}
	});

	//달력 폴딩
	$('.carandarFolding').click(function(){
		var  $this = $(this);
		var $target = $this.closest('.wrapCalender').find('.calenderArea');
		$this.toggleClass('active');
		$(".wrapCalender").find('.btn-month-prev span').text('이전달');
		$(".wrapCalender").find('.btn-month-next span').text('다음달');
		if ($this.hasClass('active')) {
			$target.slideDown();
			$this.children('span').text('달력 접기');
			$this.attr('aria-expanded','true');
			$('.weekItem span:first-child').focus();
		}else{
			$target.slideUp();
			$this.children('span').text('달력 열기');
			$this.attr('aria-expanded','false');
		}
	});

	//전체 달수 체크
	$('.btn-month-prev').click(function(){
		console.log($('.cms.calenderArea').find('.swiper-slide').length)
	});
</script>
