<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 청구상세(해외) ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner cs wrapReceipt titMini">
		<h1><span class="blind">청구상세</span></h1>
		<div class="popCont">
			<h2>APPLE.COM(US)</h2>
			<div class="cardInfo">
				<p class="cardName">코스트코리워드현대카드(신용)</p>
				<p class="cardDate">2021.11.10 11:30:28</p>
			</div>
			<div class="formWrap">
				<ul>
					<li>
						<div class="current">
							<span class="value"><em class="won">USD</em><strong class="dataValue">8.90</strong></span>
						</div>
					</li>
				</ul>
			</div>
			<div class="infoBox">
				<ul class="detailList">
					<li>
						<span class="tit">결제방법</span>
						<span class="value">할부 3개월 (1회차)</span>
					</li>
					<li>
						<span class="tit">결제 후 할부 잔액</span>
						<span class="value">10,000원</span>
					</li>
					<li>
						<span class="tit">수수료</span>
						<span class="value">1,000원</span>
					</li>
				</ul>
			</div>
		</div>

		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">확인</a>
			</div>
		</div>
	</div>
</div>
