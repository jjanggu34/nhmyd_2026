<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 가맹점 정보 수집동의 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner">
		<h1 class="ac">앗, 추가 정보가 필요해요!</h1>
		<div class="popCont">
			<div class="cardBenefitNone type02">
				<p>혜택 많이 받는 카드를 찾으려면<br>가맹점정보를 불러와야 해요.</p>
			</div>
			<div class="popInnerCont mt30">
				<input type="checkbox" id="listAll" class="chekTypeOther" name=""><label for="listAll">오늘 다시 보지 않기</label>
			</div>
		</div>
		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="" onclick="popClose(this);return false;" role="button">취소</a>
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">가맹점정보 불러오기</a>
			</div>
		</div>
	</div>
</div>
