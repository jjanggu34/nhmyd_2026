<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">

<meta name="content" content="">

<title>[P] 검색기간 설정</title>
<script src="../pub-assets/js/head.js"></script>
<script>
	$(document).ready(function(){
		slidePopConfirm();
	})  
</script>
</head>
<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 검색기간 설정 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner">
		<h1>검색기간 설정</h1>
		<div class="popCont">
			<div class="transfer">
				<div class="formWrap">
					<ul class="searchFormWrap">
						<li>
							<div class="calendarForm">
								<div class="cal">
									<div class="inputList">
										<input type="tel" value="2021-10-01" title="조회 시작일" placeholder="시작일선택" readonly="readonly">
										<a href="javascript:;" class="btnCalendar" title="시작일 날짜선택" role="button"><span class="blind">날짜선택</span></a>
									</div>
								</div>
								<span class="symbol">-</span>
								<div class="cal">
									<div class="inputList">
										<input type="tel" value="2021-10-08" title="조회 종료일" placeholder="종료일선택" readonly="readonly">
										<a href="javascript:;" class="btnCalendar" title="종료일 날짜선택" role="button"><span class="blind">날짜선택</span></a>
									</div>
								</div>
							</div>
							<div class="roundChkWrap mt15">
								<ul>
									<li>
										<span class="roundChk">
											<input type="radio" name="MSCS2410P" id="MSCS2410P1" aria-label="검색기간(1주일)" checked>
											<label for="MSCS2410P1" aria-hidden="true">1주일</label>
										</span>
									</li>
									<li>
										<span class="roundChk">
											<input type="radio" name="MSCS2410P" id="MSCS2410P2" aria-label="검색기간(1개월)">
											<label for="MSCS2410P2" aria-hidden="true">1개월</label>
										</span>
									</li>
									<li>
										<span class="roundChk">
											<input type="radio" name="MSCS2410P" id="MSCS2410P3" aria-label="검색기간(3개월)">
											<label for="MSCS2410P3" aria-hidden="true">3개월</label>
										</span>
									</li>
									<li>
										<span class="roundChk">
											<input type="radio" name="MSCS2410P" id="MSCS2410P4" aria-label="검색기간(6개월)">
											<label for="MSCS2410P4" aria-hidden="true">6개월</label>
										</span>
									</li>
									<li>
										<span class="roundChk">
											<input type="radio" name="MSCS2410P" id="MSCS2410P5" aria-label="검색기간(1년)">
											<label for="MSCS2410P5" aria-hidden="true">1년</label>
										</span>
									</li>
								</ul>
							</div>
						</li>
					</ul>
				</div>
			</div>  
		</div>				

		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">조회</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
</body>
</html>
