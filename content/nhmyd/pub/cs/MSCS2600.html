<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">
<meta name="author" content="">
<meta name="content" content="">
<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>숨긴 내역 | 	머니 캘린더 | 소비</title>
<script src="../pub-assets/js/head.js"></script>
</head>
<body>
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1>숨긴 내역</h1>
		<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
		<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a>
	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] 숨긴 내역 ### -->
	<!-- ###################################### -->
	<div class="container">
		<!-- -------------------------------------- -->
		<!-- [업데이트영역] -->
		<!-- -------------------------------------- -->
		<div class="fullRefreshWrap fr">
			<a href="javscript:;" title="업데이트 에러, 업데이트 안내 팝업열기"><p>선택 초기화</p></a>
			<button type="button" class="updateBtn2"><span class="blind">데이터 업데이트</span></button><!-- [D] 불러오는중 .on 추가-->
		</div>

		<!-- -------------------------------------- -->
		<!-- [상단영역] 월 선택 -->
		<!-- -------------------------------------- -->
		<div class="cl boxTypeWrap">
			<div class="swiper dateSelWrap">
				<a href="javascript:;" class="btn-month-prev" role="button" tabindex="0" aria-label="이전달"><span class="blind">이전달</span></a> <!-- [2023-01-18] aria-label로 수정 -->
				<a href="javascript:;" class="btn-month-next" role="button" tabindex="0" aria-label="다음달"><span class="blind">다음달</span></a> <!-- [2023-01-18] aria-label로 수정 -->
				<div class="swiper-wrapper">
					<div class="swiper-slide">
						<div class="monthSelectArea">
							<strong class="month">7월</strong> <span class="date">(07.05~08.04)</span>	
						</div>
					</div>
				</div>
			</div>
			<div class="totalBalance mt20">
				<div class="searchBox hide">
					<strong>숨긴 내역이<br />총 <span class="pointColor">N건</span> 있어요</strong>
				</div>
			</div>
		</div>

		<!-- -------------------------------------- -->
		<!-- [목록영역] 숨긴 내역 -->
		<!-- -------------------------------------- -->
		<div class="wrapSwiperH">
			<div class="swiper allListWrap">
				<div class="swiper-wrapper">
					<div class="swiper-slide">
						<!-- [반복 등록 건] -->
						<div class="boxTypeWrap">
							<h2 class="txtt2"><strong>반복 등록 건</strong></h2>
							<div class="formWrap selectAll p0">
								<div class="d-flex">
									<div>
										<input type="radio" id="sample003" name="sample15">
										<label for="sample003">현대백화점</label>
									</div>
									<div>
										<a href="javascript:;" class="linkTxt">상세내역</a>
									</div>
								</div>
								<div class="d-flex">
									<div>
										<input type="radio" id="sample004" name="sample15" disabled>
										<label for="sample004">11번가</label>
									</div>
									<div>
										<a href="javascript:;" class="linkTxt">상세내역</a>
									</div>
								</div>
							</div>
						</div>

						<!-- [개별 등록 건] -->
						<div class="boxTypeWrap">
							<h2 class="txtt2"><strong>개별 등록 건</strong></h2>
							<!-- [날짜별 반복] -->
							<div class="inoutListWrap"><p class="date bdtNone">7월 19일 화요일</p></div>
							<div class="cardSpendList mt0">
								<div class="inoutListWrap">
									<div class="inoutListInn">
										<ul class="inoutList">
											<li>
												<div class="isCategory">
													<div class="mr10">
														<input type="checkbox" id="MSCS26001" class="chekTypeOther" aria-describedby="CON_MSCS26001">
													</div>
													<div class="textWrap" id="CON_MSCS26001">
														<div class="inoutTit">
															<span class="use">한솥도시락</span>
															<span class="amount"><strong class="dataValue">140,000</strong><em class="won">원</em></span>
														</div>
														<div class="inoutCont">
															<div class="timeWrap">
																<span class="time">10:30<span class="tit">카카오뱅크</span></span>
															</div>
														</div>
													</div>
												</div>
											</li>
											<li>
												<div class="isCategory">
													<div class="mr10">
														<input type="checkbox" id="MSCS26002" class="chekTypeOther" aria-describedby="CON_MSCS26002" checked>
													</div>
													<div class="textWrap" id="CON_MSCS26002">
														<div class="inoutTit">
															<span class="use">급여</span>
															<span class="amount"><strong class="dataValue">140,000</strong><em class="won">원</em></span>
														</div>
														<div class="inoutCont">
															<div class="timeWrap">
																<span class="time">10:30<span class="tit">카카오뱅크</span></span>
															</div>
														</div>
													</div>
												</div>
											</li>
										</ul>
									</div>
								</div>
							</div>
							<!-- // [날짜별 반복] -->
							<div class="inoutListWrap"><p class="date bdtNone">7월 18일 월요일</p></div>
							<div class="cardSpendList mt0">
								<div class="inoutListWrap">
									<div class="inoutListInn">
										<ul class="inoutList">
											<li>
												<div class="isCategory">
													<div class="mr10">
														<input type="checkbox" id="MSCS26003" class="chekTypeOther"aria-describedby="CON_MSCS26003" checked disabled>
													</div>
													<div class="textWrap" id="CON_MSCS26003">
														<div class="inoutTit">
															<span class="use">알리익스프레스</span>
															<span class="amount"><strong class="dataValue">140,000</strong><em class="won">원</em></span>
														</div>
														<div class="inoutCont">
															<div class="timeWrap">
																<span class="time">10:30<span class="tit">현대카드ZERO Edition2</span></span>
															</div>
														</div>
													</div>
												</div>
											</li>
										</ul>
									</div>
								</div>
							</div>
							<!-- // [날짜별 반복] -->
						</div>
						<!-- // -->
					</div>
				</div>
			</div>
		</div>

		<!-- -------------------------------------- -->
		<!-- [하단버튼] -->
		<!-- -------------------------------------- -->
		<div class="areaBtnDefault">
			<a href="javascript:;" class="btnPressPoint" role="button">숨기기 해제</a>
		</div>
		<!-- -------------------------------------- -->
	</div>
	<!-- ###################################### -->
</div>
</body>
</html>
