<!-- ### [팝업] 반복 내역 수정 ### -->

<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner">
		<h1>반복 내역 수정</h1>
		<div class="popCont">
			<div class="assetConnectInfo">
				<h2 class="title">해당 건의 반복 등록을 수정할까요?</h2>
				<p class="subTxt ac mt15">이번 내역과 앞으로의 내역이 수정됩니다.</p>
			</div>
		</div>

		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="" onclick="popClose(this);return false;" role="button">이번 건만 수정</a>
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">네, 수정할 게요</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
