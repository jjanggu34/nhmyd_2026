<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="utf-8" />
	<meta http-equiv="Content-Script-Type" content="text/javascript" />
	<meta http-equiv="Content-Style-Type" content="text/css" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta name="apple-mobile-web-app-title" content="NH마이데이터" />
	<meta http-equiv="imagetoolbar" content="no" />
	<meta name="robots" content="no-index,follow" />
	<meta name="title" content="" />
	<meta name="author" content="" />
	<meta name="content" content="" />
	<meta name="keywords" content="NH마이데이터" />
	<meta name="description" content="NH마이데이터" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="-1" />
	<title>Accordion | UI Guide</title>
	<script src="../pub-assets/js/head-mb-update.js"></script>
</head>
<body>
	<div class="wrapper nhasset nds">
		<!-- header -->
		<div class="header">
			<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
			<h1>Accordion</h1>
			<a href="javascript:;" class="btnGoHome" role="button"><span class="blind">Home</span></a>
		</div>
		<!-- //header -->
		<div class="container">
			<h2 class="guide-title">Notice 타입</h2>
			<div class="accordion-notice">
				<div class="accordion-notice__item">
					<button type="button" aria-expanded="false" data-acc-toggle>
						<span class="accordion-notice__title">알아두세요</span>
					</button>
					<div class="accordion-notice__body" hidden>알아두어야 할 안내 문구가 여기 들어갑니다.</div>
				</div>
			</div>
			<hr class="divider" />
			<h2 class="guide-title">Box 타입</h2>
			<div class="accordion-box">
				<div class="accordion-box__item">
					<button type="button" aria-expanded="false" data-acc-toggle>
						<div class="accordion-box__title-col">
							<div class="accordion-box__title-row"><span class="accordion-box__title">자산연결 안내</span>
							</div>
							<span class="accordion-box__sub">부가 설명 텍스트</span>
						</div>
					</button>
					<div class="accordion-box__body" hidden>본문 내용이 여기 들어갑니다.</div>
				</div>
			</div>
			<hr class="divider" />
			<h2 class="guide-title">Box 타입 (리스트 포함)</h2>
			<div class="accordion-box">
				<div class="accordion-box__item">
					<button type="button" aria-expanded="false" data-acc-toggle>
						<div class="accordion-box__title-col">
							<span class="accordion-box__badge">라벨</span>
							<div class="accordion-box__title-row"><span class="accordion-box__title">계좌 상세</span>
							</div>
						</div>
					</button>
					<div class="accordion-box__list" hidden>
						<div class="accordion-box__row"><span class="accordion-box__row-title">최근 이용</span><span
								class="accordion-box__row-data">320,000원</span></div>
						<div class="accordion-box__row"><span class="accordion-box__row-title">이번 달 합계</span><span
								class="accordion-box__row-data">1,240,000원</span></div>
					</div>
				</div>
			</div>
			<hr class="divider" />
			<h2 class="guide-title">Line 타입</h2>
			<div class="accordion-line">
				<div class="accordion-line__item">
					<button type="button" aria-expanded="false" data-acc-toggle>
						<span class="accordion-line__title">자주 묻는 질문</span>
					</button>
					<div class="accordion-line__body" hidden>답변 내용이 여기 들어갑니다.</div>
				</div>
			</div>
			<hr class="divider" />
			<h2 class="guide-title">Graybox 타입</h2>
			<div class="accordion-gray">
				<div class="accordion-gray__item">
					<button type="button" aria-expanded="false" data-acc-toggle>
						<span class="accordion-gray__title">기본형</span>
					</button>
					<div class="accordion-gray__body" hidden>내용을 입력해 주세요.</div>
				</div>
			</div>
			<div class="accordion-gray">
				<div class="accordion-gray__item">
					<button type="button" aria-expanded="false" data-acc-toggle>
						<span class="accordion-gray__title">첨부 링크형</span>
					</button>
					<div class="accordion-gray__list" hidden>
						<div class="accordion-gray__row">
							<span class="accordion-gray__row-text">이용약관.pdf</span>
							<span class="accordion-gray__row-icons"></span>
						</div>
						<div class="accordion-gray__row">
							<span class="accordion-gray__row-text">개인정보처리방침.pdf</span>
							<span class="accordion-gray__row-icons"></span>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
