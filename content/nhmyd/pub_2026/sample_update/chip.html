<!doctype html>
<html lang="ko">
    <head>
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>Chip | UI Guide</title>
    </head>
    <body>
        <div class="wrapper nhasset nds">
            <!-- header -->
            <div class="header">
                <a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
                <h1>Chip</h1>
            </div>
            <!-- //header -->
            <div class="container">
                <h2 class="guide-title">basic</h2>
                <div class="demo row">
                    <span class="chip-basic"><span class="chip-basic__text">선택필터</span><button type="button" class="chip-basic__close" aria-label="삭제"></button></span>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">single — default / active</h2>
                <div class="demo row">
                    <button type="button" class="chip-single" aria-pressed="false">전체</button>
                    <button type="button" class="chip-single chip-single--active" aria-pressed="true">이번 달</button>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">accordion — 닫힘(close)</h2>
                <div class="demo">
                    <div class="chip-accordion">
                        <div class="chip-accordion__chips">
                            <button type="button" class="chip-single chip-single--active" aria-pressed="true">메뉴</button>
                            <button type="button" class="chip-single" aria-pressed="false">메뉴</button>
                            <button type="button" class="chip-single" aria-pressed="false">메뉴</button>
                            <button type="button" class="chip-single" aria-pressed="false">메뉴</button>
                            <button type="button" class="chip-single" aria-pressed="false">메뉴</button>
                        </div>
                        <button type="button" class="chip-accordion__toggle" aria-label="펼치기" aria-expanded="false"></button>
                    </div>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">accordion — 열림(open)</h2>
                <div class="demo">
                    <div class="chip-accordion is-open">
                        <div class="chip-accordion__chips">
                            <button type="button" class="chip-single chip-single--active" aria-pressed="true">메뉴</button>
                            <button type="button" class="chip-single" aria-pressed="false">메뉴</button>
                            <button type="button" class="chip-single" aria-pressed="false">메뉴</button>
                            <button type="button" class="chip-single" aria-pressed="false">메뉴</button>
                            <button type="button" class="chip-single" aria-pressed="false">메뉴</button>
                            <button type="button" class="chip-single" aria-pressed="false">메뉴</button>
                            <button type="button" class="chip-single" aria-pressed="false">메뉴</button>
                            <button type="button" class="chip-single" aria-pressed="false">메뉴</button>
                        </div>
                        <button type="button" class="chip-accordion__toggle" aria-label="접기" aria-expanded="true"></button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
