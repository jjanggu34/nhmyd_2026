<!doctype html>
<html lang="ko">
    <head>
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>Indicator | UI Guide</title>
    </head>
    <body>
        <div class="wrapper nhasset nds">
            <!-- header -->
            <div class="header">
                <a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
                <h1>Indicator</h1>
            </div>
            <!-- //header -->
            <div class="container">
                <h2 class="guide-title">Number — stop (일시정지 아이콘)</h2>
                <p class="note">숫자 인디케이터는 이미지·콘텐츠 위에 겹쳐 쓰는 것을 전제로 반투명 검정 pill + 흰색 텍스트로 고정되어 있습니다.</p>
                <div class="demo" style="background:#eef0f2; padding:16px;">
                    <div class="indicator-number">
                        <div class="indicator-number__paging">
                            <button type="button" class="indicator-number__arrow" aria-label="이전"></button>
                            <span class="indicator-number__count"><span class="indicator-number__current">1</span><span class="indicator-number__dash" aria-hidden="true"></span><span class="indicator-number__total">3</span></span>
                            <button type="button" class="indicator-number__arrow" aria-label="다음"></button>
                        </div>
                        <button type="button" class="indicator-number__control" aria-label="일시정지"></button>
                    </div>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">Number — play (재생 아이콘)</h2>
                <div class="demo" style="background:#eef0f2; padding:16px;">
                    <div class="indicator-number">
                        <div class="indicator-number__paging">
                            <button type="button" class="indicator-number__arrow" aria-label="이전"></button>
                            <span class="indicator-number__count"><span class="indicator-number__current">1</span><span class="indicator-number__dash" aria-hidden="true"></span><span class="indicator-number__total">3</span></span>
                            <button type="button" class="indicator-number__arrow" aria-label="다음"></button>
                        </div>
                        <button type="button" class="indicator-number__control" aria-label="재생"></button>
                    </div>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">Dot — stop (일시정지 아이콘)</h2>
                <p class="note">dot 개수는 콘텐츠 슬라이드 수에 맞게 늘리거나 줄일 수 있습니다(첫 번째 dot이 활성 상태).</p>
                <div class="demo" style="background:#eef0f2; padding:16px;">
                    <div class="indicator-dot">
                        <span class="indicator-dot__item indicator-dot__item--active" aria-hidden="true"></span>
                        <span class="indicator-dot__item" aria-hidden="true"></span>
                        <span class="indicator-dot__item" aria-hidden="true"></span>
                        <span class="indicator-dot__item" aria-hidden="true"></span>
                        <span class="indicator-dot__item" aria-hidden="true"></span>
                        <span class="indicator-dot__item" aria-hidden="true"></span>
                        <span class="indicator-dot__item" aria-hidden="true"></span>
                        <span class="indicator-dot__item" aria-hidden="true"></span>
                        <span class="indicator-dot__item" aria-hidden="true"></span>
                        <span class="indicator-dot__item" aria-hidden="true"></span>
                        <button type="button" class="indicator-dot__control" aria-label="일시정지"></button>
                    </div>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">Dot — play (재생 아이콘)</h2>
                <div class="demo" style="background:#eef0f2; padding:16px;">
                    <div class="indicator-dot">
                        <span class="indicator-dot__item indicator-dot__item--active" aria-hidden="true"></span>
                        <span class="indicator-dot__item" aria-hidden="true"></span>
                        <span class="indicator-dot__item" aria-hidden="true"></span>
                        <span class="indicator-dot__item" aria-hidden="true"></span>
                        <span class="indicator-dot__item" aria-hidden="true"></span>
                        <span class="indicator-dot__item" aria-hidden="true"></span>
                        <span class="indicator-dot__item" aria-hidden="true"></span>
                        <span class="indicator-dot__item" aria-hidden="true"></span>
                        <span class="indicator-dot__item" aria-hidden="true"></span>
                        <span class="indicator-dot__item" aria-hidden="true"></span>
                        <button type="button" class="indicator-dot__control" aria-label="재생"></button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
