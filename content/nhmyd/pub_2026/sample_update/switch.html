<!doctype html>
<html lang="ko">
    <head>
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>Switch | UI Guide</title>
    </head>
    <body>
        <div class="wrapper nhasset nds">
            <!-- header -->
            <div class="header">
                <a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
                <h1>Switch</h1>
            </div>
            <!-- //header -->
            <div class="container">
                <h2 class="guide-title">Basic / Lg(52×30) — Off / On</h2>
                <div class="demo">
                    <label class="switch switch--lg">
                        <input type="checkbox" class="switch__input" />
                        <span class="switch__track"></span>
                    </label>
                    <label class="switch switch--lg">
                        <input type="checkbox" class="switch__input" checked />
                        <span class="switch__track"></span>
                    </label>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">Basic / Sm(42×24, 기본값) — Off / On</h2>
                <div class="demo">
                    <label class="switch">
                        <input type="checkbox" class="switch__input" />
                        <span class="switch__track"></span>
                    </label>
                    <label class="switch">
                        <input type="checkbox" class="switch__input" checked />
                        <span class="switch__track"></span>
                    </label>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">Basic / Xs(28×18) — Off / On</h2>
                <div class="demo">
                    <label class="switch switch--xs">
                        <input type="checkbox" class="switch__input" />
                        <span class="switch__track"></span>
                    </label>
                    <label class="switch switch--xs">
                        <input type="checkbox" class="switch__input" checked />
                        <span class="switch__track"></span>
                    </label>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">Basic — Disabled (Off / On)</h2>
                <div class="demo">
                    <label class="switch">
                        <input type="checkbox" class="switch__input" disabled />
                        <span class="switch__track"></span>
                    </label>
                    <label class="switch">
                        <input type="checkbox" class="switch__input" checked disabled />
                        <span class="switch__track"></span>
                    </label>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">Big-font — 큰글씨 모드용 텍스트 라벨 포함(55×24), Off / On / Disabled</h2>
                <div class="demo" style="vertical-align:top">
                    <label class="switch-font">
                        <input type="checkbox" class="switch-font__input" />
                        <span class="switch-font__track">
                            <span class="switch-font__thumb"></span>
                            <span class="switch-font__text">큰글</span>
                        </span>
                    </label>
                    <label class="switch-font">
                        <input type="checkbox" class="switch-font__input" checked />
                        <span class="switch-font__track">
                            <span class="switch-font__thumb"></span>
                            <span class="switch-font__text">큰글</span>
                        </span>
                    </label>
                    <label class="switch-font">
                        <input type="checkbox" class="switch-font__input" disabled />
                        <span class="switch-font__track">
                            <span class="switch-font__thumb"></span>
                            <span class="switch-font__text">큰글</span>
                        </span>
                    </label>
                </div>
            </div>
        </div>
    </body>
</html>
