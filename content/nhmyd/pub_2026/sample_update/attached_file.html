<!doctype html>
<html lang="ko">
    <head>
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>Attached File | UI Guide</title>
    </head>
    <body>
        <div class="wrapper nhasset nds">
            <!-- header -->
            <div class="header">
                <a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
                <h1>Attached File</h1>
            </div>
            <!-- //header -->
            <div class="container">
                <h2 class="guide-title">썸네일형 — Default / Disabled / Filled</h2>
                <div class="attached-thumb__item">
                    <span class="attached-thumb__icon" aria-hidden="true"></span>
                    <span class="attached-thumb__count">1 / 5</span>
                </div>

                <hr class="divider" />

                <div class="attached-thumb__item attached-thumb__item--disabled">
                    <span class="attached-thumb__icon" aria-hidden="true"></span>
                    <span class="attached-thumb__count">0 / 5</span>
                </div>

                <hr class="divider" />

                <div class="attached-thumb__item attached-thumb__item--filled">
                    <img class="attached-thumb__img" src="https://picsum.photos/96/96?grayscale" alt="첨부된 사진" />
                    <button type="button" class="attached-thumb__remove" aria-label="사진 삭제"></button>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">리스트형 (1줄)</h2>
                <div class="attached-list">
                    <div class="attached-list__divider"></div>
                    <div class="attached-list__item">
                        <span class="attached-list__name">[SAMPLE] 증빙서류.pdf</span>
                        <button type="button" class="attached-list__remove" aria-label="[SAMPLE] 증빙서류.pdf 삭제"></button>
                    </div>
                    <div class="attached-list__divider"></div>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">리스트형 (2줄)</h2>
                <div class="attached-list">
                    <div class="attached-list__divider"></div>
                    <div class="attached-list__item">
                        <span class="attached-list__name">[SAMPLE] 증빙서류_001.pdf</span>
                        <button type="button" class="attached-list__remove" aria-label="[SAMPLE] 증빙서류_001.pdf 삭제"></button>
                    </div>
                    <div class="attached-list__divider"></div>
                    <div class="attached-list__item">
                        <span class="attached-list__name">[SAMPLE] 계약서_사본.pdf</span>
                        <button type="button" class="attached-list__remove" aria-label="[SAMPLE] 계약서_사본.pdf 삭제"></button>
                    </div>
                    <div class="attached-list__divider"></div>
                </div>
            </div>
        </div>
    </body>
</html>
