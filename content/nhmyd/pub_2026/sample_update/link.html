<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>Link | UI Guide</title>
    </head>
    <body>
        <div class="wrapper nhasset nds">
            <!-- header -->
            <div class="header">
                <a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
                <h1>Link</h1>
            </div>
            <!-- //header -->
            <div class="container">
                <h2 class="guide-title">Divide — 구분선으로 나뉜 링크 목록 (2~4개)</h2>
                <p class="note">기본 2개이며, 최대 4개까지 늘릴 수 있습니다. 사이 구분선은 divider is-page 재사용.</p>
                <div class="demo">
                    <div class="link-divide">
                        <a href="javascript:;" class="link-divide__item">
                            <span class="link-divide__text">
                                <span class="link-divide__title">타이틀</span>
                                <span class="link-divide__sub">부가설명</span>
                            </span>
                            <span class="link-divide__arrow" aria-hidden="true"></span>
                        </a>
                        <hr class="divider is-page" />
                        <a href="javascript:;" class="link-divide__item">
                            <span class="link-divide__text">
                                <span class="link-divide__title">타이틀</span>
                                <span class="link-divide__sub">부가설명</span>
                            </span>
                            <span class="link-divide__arrow" aria-hidden="true"></span>
                        </a>
                    </div>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">Product — 상품명 + 라벨 + 금리</h2>
                <p class="note">라벨(label is-sm is-line is-gray)·금리 행은 옵션입니다.</p>
                <div class="demo">
                    <a href="javascript:;" class="link-product">
                        <span class="link-product__text">
                            <span class="link-product__title-row">
                                <span class="link-product__title">[SAMPLE] 상품명</span>
                                <span class="label is-sm is-line is-gray">라벨</span>
                            </span>
                            <span class="link-product__sub">부가설명</span>
                        </span>
                        <span class="link-product__rate">
                            <span class="link-product__rate--primary">최고 0%</span>
                            <span class="link-product__rate--secondary">최고 0%</span>
                        </span>
                    </a>
                </div>

                </div>
        </div>
    </body>
</html>
