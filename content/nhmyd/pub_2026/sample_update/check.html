<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>Check | UI Guide</title>
    </head>
    <body>
        <div class="wrapper nhasset nds">
            <!-- header -->
            <div class="header">
                <a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
                <h1>Check</h1>
            </div>
            <!-- //header -->
            <div class="container">
                <h2 class="guide-title">basic (sm) — default</h2>
                <div class="demo row">
                    <label class="check-basic">
                        <input type="checkbox" class="check-basic__input" />
                        <span class="check-basic__icon" aria-hidden="true"></span>
                        <span class="check-basic__label">체크</span>
                    </label>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">basic (sm) — selected</h2>
                <div class="demo row">
                    <label class="check-basic">
                        <input type="checkbox" class="check-basic__input" checked />
                        <span class="check-basic__icon" aria-hidden="true"></span>
                        <span class="check-basic__label">체크</span>
                    </label>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">basic (sm) — select-disabled</h2>
                <div class="demo row">
                    <label class="check-basic">
                        <input type="checkbox" class="check-basic__input" checked disabled />
                        <span class="check-basic__icon" aria-hidden="true"></span>
                        <span class="check-basic__label">체크</span>
                    </label>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">basic (sm) — disabled</h2>
                <div class="demo row">
                    <label class="check-basic">
                        <input type="checkbox" class="check-basic__input" disabled />
                        <span class="check-basic__icon" aria-hidden="true"></span>
                        <span class="check-basic__label">체크</span>
                    </label>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">basic (xs) — default / selected / select-disabled / disabled</h2>
                <div class="demo row">
                    <label class="check-basic is-xs">
                        <input type="checkbox" class="check-basic__input" />
                        <span class="check-basic__icon" aria-hidden="true"></span>
                        <span class="check-basic__label">체크</span>
                    </label>
                    <label class="check-basic is-xs">
                        <input type="checkbox" class="check-basic__input" checked />
                        <span class="check-basic__icon" aria-hidden="true"></span>
                        <span class="check-basic__label">체크</span>
                    </label>
                    <label class="check-basic is-xs">
                        <input type="checkbox" class="check-basic__input" checked disabled />
                        <span class="check-basic__icon" aria-hidden="true"></span>
                        <span class="check-basic__label">체크</span>
                    </label>
                    <label class="check-basic is-xs">
                        <input type="checkbox" class="check-basic__input" disabled />
                        <span class="check-basic__icon" aria-hidden="true"></span>
                        <span class="check-basic__label">체크</span>
                    </label>
                </div>

                </div>
        </div>
    </body>
</html>
