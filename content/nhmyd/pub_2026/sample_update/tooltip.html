<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>Tooltip | UI Guide</title>
    </head>
    <body>
        <div class="wrapper nhasset nds">
            <!-- header -->
            <div class="header">
                <a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
                <h1>Tooltip</h1>
            </div>
            <!-- //header -->
            <div class="container">
                <h2 class="guide-title">Basic — 타이틀 + 서브 타이틀 + 텍스트 + 리스트</h2>
                <div class="demo">
                    <div class="tooltip-card" style="width:312px;">
                        <div class="tooltip-card__header">
                            <span class="tooltip-card__title">타이틀</span>
                            <button type="button" class="tooltip-card__close" aria-label="닫기"></button>
                        </div>
                        <p class="tooltip-card__sub">서브 타이틀</p>
                        <p class="tooltip-card__body">서브 텍스트를 내용을 입력해 주세요.</p>
                        <ul class="tooltip-card__list">
                            <li class="tooltip-card__item">리스트 내용을 입력해 주세요.</li>
                            <li class="tooltip-card__item">리스트 내용을 입력해 주세요.</li>
                        </ul>
                    </div>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">Simple — 타이틀 + 닫기 버튼만 구성</h2>
                <div class="demo">
                    <div class="tooltip-card" style="width:312px;">
                        <div class="tooltip-card__header">
                            <span class="tooltip-card__title">안내</span>
                            <button type="button" class="tooltip-card__close" aria-label="닫기"></button>
                        </div>
                        <p class="tooltip-card__body">해당 항목에 대한 부가 설명입니다.</p>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
