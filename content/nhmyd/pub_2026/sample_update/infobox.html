<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>Infobox | UI Guide</title>
    </head>
    <body>
        <div class="wrapper nhasset nds">
            <!-- header -->
            <div class="header">
                <a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
                <h1>Infobox</h1>
            </div>
            <!-- //header -->
            <div class="container">
                <h2 class="guide-title">basic — 타이틀 + 본문</h2>
                <div class="demo">
                    <div class="infobox">
                        <p class="infobox__title">[SAMPLE] 안내</p>
                        <p class="infobox__body">마이데이터 서비스 이용 시 참고할 안내 문구가 여기 들어갑니다.</p>
                    </div>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">basic — 타이틀 + 본문 + 버튼</h2>
                <p class="note">타이틀·본문·버튼 모두 옵션입니다(버튼은 기본 off).</p>
                <div class="demo">
                    <div class="infobox">
                        <p class="infobox__title">[SAMPLE] 안내</p>
                        <p class="infobox__body">마이데이터 서비스 이용 시 참고할 안내 문구가 여기 들어갑니다.</p>
                        <button type="button" class="infobox__button">자세히 보기</button>
                    </div>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">outline — 본문(error)</h2>
                <div class="demo">
                    <div class="infobox infobox--outline">
                        <p class="infobox__title infobox__title--sm">[SAMPLE] 안내</p>
                        <p class="infobox__body infobox__body--error">오류 상태를 알리는 안내 문구가 여기 들어갑니다.</p>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
