<!doctype html>
<html lang="ko">
    <head>
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>Process | UI Guide</title>
    </head>
    <body>
        <div class="wrapper nhasset nds">
            <!-- header -->
            <div class="header">
                <a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
                <h1>Process</h1>
            </div>
            <!-- //header -->
            <div class="container">
                <h2 class="guide-title">1단계 진행 중</h2>
                <div class="process-step-h" role="img" aria-label="총 3단계 중 1번째 단계: 기관선택">
                    <span class="process-step-h__line"></span>
                    <div class="process-step-h__item">
                        <span class="process-step-h__num process-step-h__num--active">1</span>
                        <span class="process-step-h__label process-step-h__label--active">기관선택</span>
                    </div>
                    <div class="process-step-h__item process-step-h__item--center">
                        <span class="process-step-h__num process-step-h__num--default">2</span>
                        <span class="process-step-h__label process-step-h__label--default">약관동의</span>
                    </div>
                    <div class="process-step-h__item process-step-h__item--end">
                        <span class="process-step-h__num process-step-h__num--default">3</span>
                        <span class="process-step-h__label process-step-h__label--default">연결완료</span>
                    </div>
                </div>
                <hr class="divider" />

                <h2 class="guide-title">2단계 진행 중</h2>
                <div class="process-step-h" role="img" aria-label="총 3단계 중 2번째 단계: 약관동의">
                    <span class="process-step-h__line"></span>
                    <div class="process-step-h__item">
                        <span class="process-step-h__num process-step-h__num--disabled">1</span>
                        <span class="process-step-h__label process-step-h__label--disabled">기관선택</span>
                    </div>
                    <div class="process-step-h__item process-step-h__item--center">
                        <span class="process-step-h__num process-step-h__num--active">2</span>
                        <span class="process-step-h__label process-step-h__label--active">약관동의</span>
                    </div>
                    <div class="process-step-h__item process-step-h__item--end">
                        <span class="process-step-h__num process-step-h__num--default">3</span>
                        <span class="process-step-h__label process-step-h__label--default">연결완료</span>
                    </div>
                </div>
                <hr class="divider" />

                <h2 class="guide-title">3단계 진행 중(완료)</h2>
                <div class="process-step-h" role="img" aria-label="총 3단계 중 3번째 단계: 연결완료">
                    <span class="process-step-h__line"></span>
                    <div class="process-step-h__item">
                        <span class="process-step-h__num process-step-h__num--disabled">1</span>
                        <span class="process-step-h__label process-step-h__label--disabled">기관선택</span>
                    </div>
                    <div class="process-step-h__item process-step-h__item--center">
                        <span class="process-step-h__num process-step-h__num--disabled">2</span>
                        <span class="process-step-h__label process-step-h__label--disabled">약관동의</span>
                    </div>
                    <div class="process-step-h__item process-step-h__item--end">
                        <span class="process-step-h__num process-step-h__num--active">3</span>
                        <span class="process-step-h__label process-step-h__label--active">연결완료</span>
                    </div>
                </div>
                <hr class="divider" />
            </div>
        </div>
    </body>
</html>
