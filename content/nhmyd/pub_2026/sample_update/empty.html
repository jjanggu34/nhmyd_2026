<!doctype html>
<html lang="ko">
    <head>
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>Empty | UI Guide</title>
    </head>
    <body>
        <div class="wrapper nhasset nds">
            <!-- header -->
            <div class="header">
                <a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
                <h1>Empty</h1>
            </div>
            <!-- //header -->
            <div class="container">
                <h2 class="guide-title">result</h2>
                <div class="demo">
                    <div class="empty empty--result">
                        <span class="empty__icon" aria-hidden="true"></span>
                        <p class="empty__text">조회 결과가 없습니다.</p>
                    </div>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">result (타이틀 + 버튼 포함)</h2>
                <p class="note">아이콘(기본 on)·상단 타이틀(기본 off)·하단 텍스트버튼(기본 off)은 옵션입니다.</p>
                <div class="demo">
                    <div class="empty empty--result">
                        <span class="empty__icon" aria-hidden="true"></span>
                        <div style="display:flex; flex-direction:column; gap:12px; align-items:center; width:100%;">
                            <span style="font-size:16px; font-weight:var(--font-weight-semibold); letter-spacing:-0.32px; line-height:24px; color:var(--color-font-1);">텍스트 입력</span>
                            <p class="empty__text" style="margin:0;">조회 결과가 없습니다.</p>
                        </div>
                        <button type="button" style="font-size:14px; font-weight:var(--font-weight-medium); letter-spacing:-0.28px; color:#505050; text-decoration:underline; background:none; border:none; cursor:pointer;">버튼명</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
