<!DOCTYPE html>
<html lang="ko">

<head>
	<script src="../pub-assets/js/head-mb-update.js"></script>
	<title>[P] 조회기간 설정</title>
	<script>
		$(document).ready(function () {
			slidePopConfirm(); //TO-BE 디자인 높이 조절되는 slidePopConfirm 사용
		})  
	</script>
</head>

<body>
	<div class="wrapper nhasset"><!-- 바닥페이지 --></div>
	<div class="nhasset popWrap nds slidePopConfirm">
		<div class="dim"></div>
		<div class="popInner">
			<h1>조회 기간 선택</h1>
			<div class="popCont">
				<div class="bottomsheet-list">
					<button type="button" class="bottomsheet-list__item"><span>1년</span></button>
					<button type="button" class="bottomsheet-list__item"><span>2년</span></button>
					<button type="button" class="bottomsheet-list__item"><span>3년</span></button>
					<button type="button" class="bottomsheet-list__item"><span>4년</span></button>
					<button type="button"
						class="bottomsheet-list__item bottomsheet-list__item--selected"><span>5년</span></button>
				</div>
			</div>
			<div class="popBtnWrap">
				<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다."
					role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
			</div>
		</div>
	</div>
</body>

</html>
