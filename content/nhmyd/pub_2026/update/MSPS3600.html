<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>자산연결 완료</title>
    </head>

    <body>
        <div class="wrapper nhasset nds">
            <div class="header">
                <h1>자산연결</h1>
                <a href="javascript:;" class="btnGoHome" role="button"><span class="blind">Home</span></a>
            </div>

            <div class="container">
                <!--성공 시-->
                <div class="stack--40">
                    <div class="text-stack text-stack--lg">
                        <img src="../../images/makebetter/icon/img_agree-check_68.svg" alt="" class="result-icon" />
                        <p class="text text--h1">
                            <em class="pointColor22">김농협</em>님의 자산정보를
                            <br />
                            모두 불러왔습니다!
                        </p>
                        <!-- [CASE] 성공(일부 실패 포함) -->
                        <div class="stack--12">
                            <div class="link-divide">
                                <a href="javascript:;" class="link-divide__item" role="button">
                                    <span class="link-divide__text">
                                        <strong class="link-divide__title">연결 성공</strong>
                                        <span class="link-divide__sub">농축협 외 총 22개</span>
                                    </span>
                                    <span class="link-divide__arrow" aria-hidden="true"></span>
                                </a>
                                <hr class="divider divider--page" />
                                <a href="javascript:;" class="link-divide__item" role="button">
                                    <span class="link-divide__text">
                                        <strong class="link-divide__title">연결 실패</strong>
                                        <span class="link-divide__sub">SC제일은행 외 총 1개</span>
                                    </span>
                                    <span class="link-divide__arrow" aria-hidden="true"></span>
                                </a>
                            </div>
                            <div class="link-divide">
                                <a href="javascript:;" class="link-divide__item" role="button">
                                    <span class="link-divide__text">
                                        <strong class="link-divide__title">자산연결을 도와준 직원이 있나요?</strong>
                                    </span>
                                    <span class="btn--link">직원찾기</span>
                                </a>
                            </div>
                        </div>
                    </div>
                    <div class="infobox">
                        <p class="infobox__title--sm">
                            곧 내 자산을 한눈에 볼 수 있어요.<br />준비되면 카카오 알림톡으로 알려드릴게요.
                        </p>
                    </div>
                </div>
                <!--실패 시-->
                <div class="stack--40">
                    <div class="text-stack text-stack--lg">
                        <img src="../../images/makebetter/icon/img_error-fail_68.svg" alt="" class="result-icon" />
                        <p class="text text--h1">
                            <em class="pointColor22">김농협</em>님이 자산연결을 시도한
                            <br />
                            기관의 연결에 실패하였습니다.
                        </p>
                        <div class="link-divide">
                            <a href="javascript:;" class="link-divide__item" role="button">
                                <span class="link-divide__text">
                                    <strong class="link-divide__title">연결 실패</strong>
                                    <span class="link-divide__sub">SC제일은행 외 총 1개</span>
                                </span>
                                <span class="link-divide__arrow" aria-hidden="true"></span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="areaBtnDefault">
                <!--성공 시-->
                <a href="javascript:;" class="btnPressPoint" role="button">내 자산 한눈에 보기</a>
                <!--실패시 시-->
                <a href="javascript:;" class="btnPressPoint" role="button" style="display:none">자산연결 다시하기</a>
            </div>
        </div>
    </body>
</html>
