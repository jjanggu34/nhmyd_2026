<!doctype html>
<html lang="ko">
    <head>
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>자산연결</title>
    </head>

    <body>
        <div class="wrapper nhasset nds">
            <div class="header">
                <a href="javascript:;" role="button" class="btnBack"><span class="blind">이전화면으로</span></a>
                <h1>자산연결</h1>
                <a href="javascript:;" role="button" class="btnCancle"><span class="blind">취소</span></a>
            </div>

            <div class="container">
                <div class="process-step-h" role="img" aria-label="총 3단계 중 3번째 단계: 연결완료">
                    <span class="process-step-h__line"></span>
                    <div class="process-step-h__item">
                        <span class="process-step-h__num process-step-h__num--default">1</span>
                        <span class="process-step-h__label process-step-h__label--default">기관선택</span>
                    </div>
                    <div class="process-step-h__item process-step-h__item--center">
                        <span class="process-step-h__num process-step-h__num--default">2</span>
                        <span class="process-step-h__label process-step-h__label--default">약관동의</span>
                    </div>
                    <div class="process-step-h__item process-step-h__item--end">
                        <span class="process-step-h__num process-step-h__num--active">3</span>
                        <span class="process-step-h__label process-step-h__label--active">연결완료</span>
                    </div>
                </div>

                <div class="text-stack text-stack--lg">
                    <div class="text-stack">
                        <p class="text text--h1">
                            $김농협$님의 자산정보를
                            <br />
                            불러오기 시작했습니다!
                        </p>
                        <p class="text text--body1-medium">완료되면 알려드릴까요?</p>
                    </div>
                    <p class="text text--body2">
                        선택한 기관의 개수 및 고객님의 자산정보량에 따라
                        <br />
                        불러온 자산정보를 화면에 반영하는데
                        <br />
                        최대 5분 정도 소요됩니다
                    </p>
                </div>

                <div class="areaBtnDefault half">
                    <a href="javascript:;" class="btnPressDefault" role="button">그냥 기다릴게요</a>
                    <a href="javascript:;" class="btnPressPoint" role="button">네, 좋아요</a>
                </div>
            </div>
        </div>
    </body>
</html>
