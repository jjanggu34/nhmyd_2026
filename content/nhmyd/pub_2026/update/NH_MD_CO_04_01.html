<!doctype html>
<html lang="ko">
    <head>
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>[P] 자산/부채 통합 분석_자산연결</title>
        <script>
            $(document).ready(function () {
            	slidePopConfirm(); //TO-BE 디자인 높이 조절되는 slidePopConfirm 사용
            })
        </script>
    </head>

    <body>
        <div class="wrapper nhasset nds"><!-- 바닥페이지 --></div>
        <div class="nhasset popWrap nds slidePopConfirm">
            <div class="dim"></div>
            <div class="popInner">
                <h1>자산연결</h1>
                <div class="popCont">
                    <div class="popCont__inner">
                        <div class="asset-connect">
                            <div class="stack--field">
                                <h2 class="asset-connect__title text--h2">
                                    자산
                                    <span class="asset-connect__regular">을 연결해보세요!</span>
                                </h2>
                                <p class="asset-connect__desc text--body2">
                                    자산·부채 통합분석 서비스 이용을 위해
                                    <br />
                                    자산연결이 필요해요.
                                </p>
                            </div>
                            <div class="asset-connect__visual">
                                <img src="../../images/update/img-ally-wallet.png" alt="" />
                            </div>
                        </div>
                    </div>
                </div>
                <div class="popBtnWrap">
                    <div class="popBtn">
                        <a href="javascript:;" class="btnPressDefault" role="button">다음에</a>
                        <a href="javascript:;" class="confirmBtn" role="button">자산 연결하기</a>
                    </div>
                    <a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기" /></a>
                </div>
            </div>
        </div>
    </body>
</html>
