<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>자산&middot;부채 통합분석</title>
    </head>

    <body class="bgcolor">
        <div class="wrapper nhasset nds">
            <div class="header bgcolor">
                <a href="javascript:;" role="button" class="btnBack"><span class="blind">이전화면으로</span></a>
                <h1>자산&middot;부채 통합분석</h1>
                <a href="javascript:;" class="btnGoHome" role="button"><span class="blind">Home</span></a>
                <a href="javascript:;" class="btnAll" role="button"><span class="blind">전체메뉴</span></a>
            </div>

            <div class="container bgcolor">
                <div class="areaBtnDefault bgcolor">
                    <a href="javascript:;" class="btnPressPoint" role="button">자산·부채 통합분석 시작</a>
                </div>
            </div>
        </div>

        <script>
            // 카드1의 --point 막대(data-bar-anim)와 카드2의 게이지(data-gauge)가 화면에 스크롤되어
            // 들어올 때 각각 0 -> 목표치까지 차오르는 애니메이션을 적용합니다. 실제 채움 값은
            // .finance-preview__bar--point/.finance-preview__gauge-fill의 CSS transition이 담당하고,
            // 여기서는 트리거 시점에 is-animated 클래스만 붙입니다.
            document.addEventListener('DOMContentLoaded', function () {
                var targets = document.querySelectorAll('.finance-preview__bars[data-bar-anim], .finance-preview__gauge[data-gauge]');
                if (!targets.length) return;

                if (!('IntersectionObserver' in window)) {
                    // 구형 브라우저 폴백: 옵저버 없이 바로 채움
                    targets.forEach(function (el) { el.classList.add('is-animated'); });
                    return;
                }

                var io = new IntersectionObserver(
                    function (entries) {
                        entries.forEach(function (entry) {
                            if (!entry.isIntersecting) return;
                            entry.target.classList.add('is-animated');
                            io.unobserve(entry.target);
                        });
                    },
                    { threshold: 0.4 }
                );
                targets.forEach(function (el) { io.observe(el); });
            });
        </script>
    </body>
</html>
