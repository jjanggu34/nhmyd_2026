<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>AI 포트폴리오</title>
    </head>

    <body class="bgcolor">
        <div class="wrapper nhasset nds">
            <div class="header bgcolor" role="banner">
                <a href="javascript:;" role="button" class="btnBack"><span class="blind">이전화면으로</span></a>
                <h1>AI 포트폴리오</h1>
                <a href="javascript:;" class="btnAll" role="button"><span class="blind">전체메뉴</span></a>
            </div>

            <div class="container bgcolor" role="main">
                <div class="onboard">
                    <div class="swiper-pagination scroll__pagination onboard__dots"></div>

                    <div class="swiper-container onboard__swiper" id="fundPromoSwiper">
                        <div class="swiper-wrapper">
                            <div class="swiper-slide onboard__slide">
                                <!-- prettier-ignore -->
                                <p class="onboard__title">내 투자 성향에 맞춘 최적<br /><strong>포트폴리오를 확인</strong>해 보세요.</p>
                                <div class="onboard__visual">
                                    <div class="onboard__frame" aria-hidden="true"></div>
                                </div>
                            </div>

                            <div class="swiper-slide onboard__slide">
                                <!-- prettier-ignore -->
                                <p class="onboard__title">펀드 속 자산까지 나눠 보면<br /><strong>내 자산은 실제로 어떤 모습</strong>일까?</p>
                                <div class="onboard__visual">
                                    <!-- 가운데 뚫린 영역 -->
                                    <div class="onboard__frame" aria-hidden="true"></div>
                                </div>
                            </div>

                            <div class="swiper-slide onboard__slide">
                                <!-- prettier-ignore -->
                                <p class="onboard__title">투자하고자 하는 조건에 맞춰<br /><strong>포트폴리오를 조정</strong>해볼까?</p>
                                <div class="onboard__visual">
                                    <!-- 가운데 뚫린 영역 -->
                                    <div class="onboard__frame" aria-hidden="true"></div>
                                </div>
                            </div>

                            <div class="swiper-slide onboard__slide">
                                <!-- prettier-ignore -->
                                <p class="onboard__title">성공적인 투자를 위한 나만의 맞춤Tip! <strong>AI의 조언을 확인하세요.</strong></p>
                                <div class="onboard__visual">
                                    <!-- 가운데 뚫린 영역 -->
                                    <div class="onboard__frame" aria-hidden="true"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="areaBtnDefault bgcolor">
                    <a href="javascript:;" class="btnPressPoint" role="button">AI 포트폴리오 시작</a>
                </div>
            </div>
        </div>

        <script>
            $(document).ready(function () {
                if (typeof Swiper === 'undefined') return;
                var promoTrack = document.getElementById('fundPromoSwiper');
                if (!promoTrack) return;

                new Swiper('#fundPromoSwiper', {
                    slidesPerView: 1,
                    spaceBetween: 0,
                    loop: true,
                    autoHeight: true,
                    a11y: {
                        enabled: true,
                        prevSlideMessage: '이전 안내',
                        nextSlideMessage: '다음 안내',
                        paginationBulletMessage: '{{index}}번째 안내로 이동'
                    },
                    autoplay: { delay: 4000, disableOnInteraction: false },
                    pagination: {
                        el: '.scroll__pagination',
                        type: 'bullets',
                        clickable: true
                    }
                });
            });
        </script>
    </body>
</html>
