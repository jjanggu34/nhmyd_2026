<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>[P] AI 포트폴리오 진단 다시하기</title>
        <script>
            $(document).ready(function () {
                slidePopConfirm(); //TO-BE 디자인 높이 조절되는 slidePopConfirm 사용
            });
        </script>
    </head>

    <body>
        <div class="wrapper nhasset"><!-- 바닥페이지 --></div>
        <div class="nhasset popWrap nds slidePopConfirm">
            <div class="dim"></div>
            <div class="popInner">
                <h1>이전에 진행한 AI포트폴리오</h1>
                <div class="popCont">
                    <div class="popCont__inner">
                        <p class="text text--body2">
                            AI 포트폴리오 진단부터 다시 하시려면
                            <br />
                            다시하기를 눌러주세요.
                        </p>
                    </div>
                </div>
                <div class="popBtnWrap">
                    <div class="popBtn half">
                        <a href="javascript:;" onclick="popClose(this);return false;" role="button">다시하기</a>
                        <a href="javascript:;" class="confirmBtn" role="button">리포트 보기</a>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
