<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>[P] 성인 전환 고객안내</title>
        <script>
            $(document).ready(function () {
                slidePopConfirm(); //TO-BE 디자인 높이 조절되는 slidePopConfirm 사용
            });
        </script>
    </head>

    <body>
        <div class="wrapper nhasset"><!-- 바닥페이지 --></div>
        <div class="nhasset popWrap nds slidePopConfirm">
            <div class="dim"></div>
            <div class="popInner">
                <h1>성인 전환 고객안내</h1>
                <div class="popCont">
                    <div class="popCont__inner">
                        <div class="celebrate">
                            <div class="celebrate__glow" aria-hidden="true">
                                <!-- <div class="celebrate__mascot"></div> -->
                                <img src="../../images/update/img-ally-firecracker.png" alt="" class="celebrate__mascot" aria-hidden="true" />
                            </div>
                            <div class="stack--12">
                                <p class="text text--h2">
                                    <span class="celebrate__name">
                                        <!-- prettier-ignore -->
                                        <em>$김농협$</em>님
                                    </span>
                                    <!-- prettier-ignore -->
                                    성인<span class="celebrate__regular">이 된걸 축하해요!</span>
                                </p>
                                <p class="text text--body2 text--font3">
                                    더 넓어진 금융생활을 이어가려면
                                    <br />
                                    서비스 재동의가 필요해요
                                </p>
                            </div>
                            <div class="celebrate__info">
                                <div class="celebrate__info-body">
                                    <p class="celebrate__info-title">왜 다시 동의해야 하나요?</p>
                                    <ul class="bullet bullet--dot celebrate__info-list">
                                        <li class="bullet__item">청소년 동의는 만 19세가 되는 시점에 자동으로 만료돼요.</li>
                                        <li class="bullet__item">성인이 되면서 이용 가능한 증권·보험·대출 자산 연결을 위해 필요해요.</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="popBtnWrap">
                    <div class="popBtn">
                        <a href="javascript:;" class="confirmBtn" role="button">확인</a>
                    </div>
                    <a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button">
                        <img src="../../images/common/btn_popClose.png" alt="닫기" />
                    </a>
                </div>
            </div>
        </div>
    </body>
</html>
