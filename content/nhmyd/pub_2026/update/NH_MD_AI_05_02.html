<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>[P] AI 포트폴리오 진단 다시하기</title>
        <script>
            $(document).ready(function () {
                slidePopConfirm();
            });
        </script>
    </head>

    <body>
        <div class="wrapper nhasset"><!-- 바닥페이지 --></div>
        <div class="nhasset popWrap nds slidePopConfirm" role="dialog" aria-modal="true" aria-labelledby="popTitle">
            <div class="dim"></div>
            <div class="popInner">
                <h1 id="popTitle" class="blind">투자성향진단 결과</h1>
                <div class="popCont">
                    <div class="popCont__inner">
                        <div class="text-stack invest">
                            <p class="text text--h1">
                                투자성향진단 결과가
                                <br />
                                달라졌어요!
                            </p>
                            <p class="text text--body1-medium text--font3">
                                AI포트폴리오 진단을
                                <br />
                                다시 받아보세요.
                            </p>
                            <img class="illust" src="../../images/update/img-ally-picture-frame.png" width="188" height="130" alt="" />
                        </div>
                    </div>
                </div>
                <div class="popBtnWrap">
                    <div class="popBtn half">
                        <a href="javascript:;" onclick="popClose(this);return false;" class="confirmBtn" role="button">다음에</a>
                        <a href="javascript:;" class="confirmBtn" role="button">다시하기</a>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
