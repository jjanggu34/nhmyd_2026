<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>[P] AI 포트폴리오 진단 다시하기</title>
        <script>
            $(document).ready(function () {
                slidePopConfirm(); //TO-BE 디자인 높이 조절되는 slidePopConfirm 사용
            });
        </script>
    </head>

    <body>
        <div class="wrapper nhasset"><!-- 바닥페이지 --></div>
        <div class="nhasset popWrap nds slidePopConfirm">
            <div class="dim"></div>
            <div class="popInner">
                <h1>투자성향진단 결과가 달라졌어요!</h1>
                <div class="popCont">
                    <div class="popCont__inner">
                        <p>AI 포트폴리오 진단을 다시 받아보세요.</p>
                        <div class="mt30">
                            <input type="checkbox" id="listAll" class="chekTypeOther" name="" />
                            <label for="listAll">오늘 다시 보지 않기</label>
                        </div>
                    </div>
                </div>
                <div class="popBtnWrap">
                    <div class="popBtn">
                        <a href="javascript:;" role="button">다음에</a>
                        <a href="javascript:;" class="confirmBtn" role="button">다시하기</a>
                    </div>
                    <a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button">
                        <img src="../../images/common/btn_popClose.png" alt="닫기" />
                    </a>
                </div>
            </div>
        </div>
    </body>
</html>
