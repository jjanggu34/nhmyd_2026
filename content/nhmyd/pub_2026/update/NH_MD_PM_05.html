<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>[P] 별명설정</title>
        <script>
            $(document).ready(function () {
                slidePopConfirm();
            });
        </script>
    </head>

    <body>
        <div class="wrapper nhasset"><!-- 바닥페이지 --></div>
        <div class="nhasset popWrap nds slidePopConfirm">
            <div class="dim"></div>
            <div class="popInner">
                <h1>별명 설정</h1>
                <div class="popCont">
                    <div class="popCont__inner">
                        <div class="input-box" id="nicknameInputBox">
                            <label class="input-box__label blind" for="nicknameInput">별명</label>
                            <div class="input-box__field">
                                <input type="text" id="nicknameInput" class="input-box__input" placeholder="예) 엄마" autocomplete="off" />
                                <button type="button" class="input-box__icon is-clear" id="nicknameClear" aria-label="입력 지우기" hidden></button>
                            </div>
                            <p class="input-box__message" id="nicknameMsg">김올리님을 어떻게 부를까요?</p>
                        </div>
                        <label class="check-basic mt24">
                            <input type="checkbox" class="check-basic__input" id="nicknameAutoApply" checked />
                            <span class="check-basic__icon" aria-hidden="true"></span>
                            <span class="check-basic__label">앞으로 같은 이름에 자동으로 적용할게요</span>
                        </label>
                    </div>
                </div>
                <div class="popBtnWrap">
                    <div class="popBtn">
                        <a href="javascript:;" class="confirmBtn disabled" role="button" aria-disabled="true">확인</a>
                    </div>
                    <a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button">
                        <img src="../../images/common/btn_popClose.png" alt="닫기" />
                    </a>
                </div>
            </div>
        </div>

        <div class="toastPop nds" role="status" aria-live="polite">
            <p class="toast-basic">별명을 설정했어요!</p>
        </div>

        <script>
            $(function () {
                var $input = $('#nicknameInput');
                var $clear = $('#nicknameClear');
                var $confirmBtn = $('.popBtnWrap .confirmBtn');

                function syncConfirmBtn() {
                    var enabled = $.trim($input.val()).length > 0;
                    $confirmBtn.toggleClass('disabled', !enabled);
                    if (enabled) { $confirmBtn.removeAttr('aria-disabled'); } else { $confirmBtn.attr('aria-disabled', 'true'); }
                }

                $input.on('input', function () {
                    $clear.prop('hidden', $(this).val().length === 0);
                    syncConfirmBtn();
                });

                $clear.on('click', function () {
                    $input.val('').trigger('input').trigger('focus');
                });

                $confirmBtn.on('click', function (e) {
                    e.preventDefault();
                    if ($(this).hasClass('disabled')) return;
                    popClose(this);
                    window.setTimeout(function () {
                        toastPopup();
                    }, 200);
                });

                syncConfirmBtn();
            });
        </script>
    </body>
</html>
