<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>[P] 적요/거래메모 수집동의</title>
        <script>
            $(document).ready(function () {
                slidePopConfirm(); //TO-BE 디자인 높이 조절되는 slidePopConfirm 사용
            });
        </script>
    </head>

    <body>
        <div class="wrapper nhasset"><!-- 바닥페이지 --></div>
        <div class="nhasset popWrap nds slidePopConfirm">
            <div class="dim"></div>
            <div class="popInner">
                <h1 class="normal">
                    <strong>누구와 주고 받았는지</strong>
                    알 수 있어요
                </h1>
                <div class="popCont">
                    <div class="popCont__inner">
                        <div class="txn-preview">
                            <p class="txn-preview__caption">적요 또는 거래메모 수집·이용 동의</p>
                            <div class="txn-preview__card small">
                                <div class="select-card__logo-row">
                                    <span class="txn-preview__icon"><img src="../../images/update/ic-account-opening.svg" alt="" /></span>
                                    <div class="select-card__name-col">
                                        <p class="select-card__name">김농협</p>
                                        <p class="select-card__number">08:15 · 선불충전 · NH Pay</p>
                                    </div>
                                </div>
                                <p class="txn-preview__amount">+50,000원</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="popBtnWrap">
                    <div class="popBtn half">
                        <a href="javascript:;" class="confirmBtn" role="button">다음에</a>
                        <a href="javascript:;" class="confirmBtn" role="button">동의하기</a>
                    </div>
                    <a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button">
                        <img src="../../images/common/btn_popClose.png" alt="닫기" />
                    </a>
                </div>
            </div>
        </div>
    </body>
</html>
