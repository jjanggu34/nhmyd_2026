<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>[P] 권유직원 선택</title>
        <script>
            $(document).ready(function () {
                slidePopConfirm();
            });
        </script>
    </head>

    <body>
        <div class="wrapper nhasset"><!-- 바닥페이지 --></div>
        <div class="nhasset popWrap nds slidePopConfirm">
            <div class="dim"></div>
            <div class="popInner">
                <h1>가입에 도움을 준 직원이 있나요?</h1>                
                <div class="popCont">
                    <div class="popCont__inner">
                        <div class="tab-bar" role="tablist" aria-label="tab-bar 예시">
                            <button type="button" id="tab-bar-1" class="tab-bar__item is-active" role="tab" aria-selected="true" aria-controls="panel-bar-1" tabindex="0">이름(사번)</button>
                            <button type="button" id="tab-bar-2" class="tab-bar__item" role="tab" aria-selected="false" aria-controls="panel-bar-2" tabindex="-1">영업점</button>
                        </div>
                        <div id="panel-bar-1" class="tab-panel" role="tabpanel" aria-labelledby="tab-bar-1" tabindex="0">
                            <div class="input-box">
                                <label class="input-box__label blind" for="search-box-1">이름(사번)</label>
                                <div class="input-box__field">
                                    <input type="text" id="search-box-1" class="input-box__input" placeholder="이름 또는 사번을 입력하세요" autocomplete="off" />
                                    <button type="button" class="input-box__icon is-clear" id="searchClear1" aria-label="검색어 지우기" hidden></button>
                                    <span class="input-box__icon is-search" aria-hidden="true"></span>
                                </div>
                                <p class="input-box__message" id="searchMsg1" hidden>검색조건에 2글자 이상 입력하세요.</p>
                            </div>

                            <div class="text-stack mt32 mb0" id="searchResultWrap1" hidden>
                                <p class="text text--body1 text--font1" id="searchCount1">
                                    총
                                    <span class="text--point" id="searchCountNum1">0</span>
                                    건
                                </p>
                                <div class="bottomsheet-list bt-1" id="searchList1" role="listbox" aria-label="검색 결과"></div>
                            </div>

                            <div class="empty is-result" id="searchEmpty1" hidden>
                                <span class="empty__icon" aria-hidden="true"></span>
                                <p class="empty__text">검색결과가 없습니다</p>
                            </div>
                        </div>
                        <div id="panel-bar-2" class="tab-panel" role="tabpanel" aria-labelledby="tab-bar-2" tabindex="0" hidden>
                            <div class="input-box">
                                <label class="input-box__label blind" for="search-box-2">영업점</label>
                                <div class="input-box__field">
                                    <input type="text" id="search-box-2" class="input-box__input" placeholder="영업점을 입력하세요" />
                                    <span class="input-box__icon is-search" aria-hidden="true"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="popBtnWrap">
                    <div class="popBtn">
                        <a href="javascript:;" class="confirmBtn disabled" role="button" aria-disabled="true">선택하기</a>
                    </div>
                    <a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button">
                        <img src="../../images/common/btn_popClose.png" alt="닫기" />
                    </a>
                </div>
            </div>
        </div>

        <script>
            $(function () {
                var SAMPLE_STAFF = [
                    { name: '김수인', label: '김*인 (0640****) 신길동' },
                    { name: '김수영', label: '김*영 (1341****) 광화문금융센터 기업금융지원센터 디지털전략팀' },
                    { name: '김수정', label: '김*정 (1441****) 삼성푸른금융센터' },
                    { name: '김수현', label: '김*현 (1965****) 파주시청<출>' },
                    { name: '김수민', label: '김*민 (2841****) 압구정역' },
                    { name: '김수빈', label: '김*빈 (3312****) 강남금융센터' },
                    { name: '김수호', label: '김*호 (4127****) 여의도금융센터' },
                    { name: '김수경', label: '김*경 (5033****) 판교테크노밸리' },
                    { name: '김수아', label: '김*아 (6210****) 잠실역' },
                    { name: '김수진', label: '김*진 (7145****) 수원영통지점' },
                    { name: '김수영2', label: '김*영 (8322****) 대전둔산지점' },
                    { name: '김수완', label: '김*완 (9051****) 부산해운대지점' }
                ];

                var $input = $('#search-box-1');
                var $clear = $('#searchClear1');
                var $msg = $('#searchMsg1');
                var $resultWrap = $('#searchResultWrap1');
                var $countNum = $('#searchCountNum1');
                var $empty = $('#searchEmpty1');
                var $confirmBtn = $('.popBtnWrap .confirmBtn');
                var currentResults = [];
                var selectedIndex = -1;

                function resyncPopHeight() {
                    window.syncSlidePopConfirmHeight(false);
                }

                function syncConfirmBtn() {
                    var enabled = selectedIndex > -1;
                    $confirmBtn.toggleClass('disabled', !enabled);
                    if (enabled) { $confirmBtn.removeAttr('aria-disabled'); } else { $confirmBtn.attr('aria-disabled', 'true'); }
                }

                function renderList() {
                    window.renderBottomsheetList({
                        container: 'searchList1',
                        items: currentResults,
                        selectedIndex: selectedIndex,
                        onSelect: function (i) {
                            selectedIndex = selectedIndex === i ? -1 : i;
                            renderList();
                            syncConfirmBtn();
                            resyncPopHeight();
                        }
                    });
                }

                function updateSearch() {
                    var q = $.trim($input.val());
                    $clear.prop('hidden', q.length === 0);
                    selectedIndex = -1;
                    syncConfirmBtn();

                    if (q.length < 2) {
                        $msg.prop('hidden', q.length === 0);
                        $resultWrap.prop('hidden', true);
                        $empty.prop('hidden', true);
                        currentResults = [];
                        resyncPopHeight();
                        return;
                    }

                    $msg.prop('hidden', true);
                    currentResults = SAMPLE_STAFF.filter(function (item) { return item.name.indexOf(q) > -1; });

                    if (currentResults.length > 0) {
                        $countNum.text(currentResults.length.toLocaleString());
                        renderList();
                        $resultWrap.prop('hidden', false);
                        $empty.prop('hidden', true);
                    } else {
                        $resultWrap.prop('hidden', true);
                        $empty.prop('hidden', false);
                    }
                    resyncPopHeight();
                }

                $input.on('input', updateSearch);
                $clear.on('click', function () {
                    $input.val('').trigger('input').trigger('focus');
                });


                setTimeout(resyncPopHeight, 150);
            });
        </script>
    </body>
</html>
