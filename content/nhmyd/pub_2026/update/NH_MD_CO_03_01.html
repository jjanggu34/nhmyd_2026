<!doctype html>
<html lang="ko">
    <head>
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>[P] 자산/부채 통합 진단 서비스 이용동의</title>
        <script>
            $(document).ready(function () {
                slidePopConfirm(); //TO-BE 디자인 높이 조절되는 slidePopConfirm 사용
            });
        </script>
    </head>

    <body>
        <div class="wrapper nhasset"><!-- 바닥페이지 --></div>
        <div class="nhasset popWrap nds slidePopConfirm">
            <div class="dim"></div>
            <div class="popInner">
                <h1>자산/부채 통합 진단 서비스 이용동의</h1>
                <div class="popCont">
                    <div class="popCont__inner">
                        <div class="terms-card">
                            <div class="terms-card__header">
                                <div class="terms-card__check">
                                    <label class="check-basic">
                                        <input type="checkbox" class="check-basic__input" />
                                        <span class="check-basic__icon" aria-hidden="true"></span>
                                        <span class="terms-card__title">[필수] 전체 동의</span>
                                    </label>
                                </div>
                                <button type="button" class="terms-card__toggle" aria-label="약관 상세로 이동"></button>
                            </div>
                            <hr class="terms-card__divider" />
                            <div class="terms-card__list">
                                <div class="terms-link">
                                    <div class="terms-link__check">
                                        <label class="check-basic check-basic--xs">
                                            <input type="checkbox" class="check-basic__input" />
                                            <span class="check-basic__icon" aria-hidden="true"></span>
                                            <span class="terms-link__text">NH마이데이터 「자산/부채 통합 진단」 서비스 이용약관</span>
                                        </label>
                                    </div>
                                    <button type="button" class="terms-link__arrow" aria-label="상세보기"></button>
                                </div>
                                <div class="terms-link">
                                    <div class="terms-link__check">
                                        <label class="check-basic check-basic--xs">
                                            <input type="checkbox" class="check-basic__input" />
                                            <span class="check-basic__icon" aria-hidden="true"></span>
                                            <span class="terms-link__text">OOO 이용약관</span>
                                        </label>
                                    </div>
                                    <button type="button" class="terms-link__arrow" aria-label="상세보기"></button>
                                </div>
                            </div>
                        </div>

                        <div class="terms-card">
                            <div class="terms-card__list">
                                <div class="terms-link">
                                    <div class="terms-link__check">
                                        <label class="check-basic check-basic--xs">
                                            <input type="checkbox" class="check-basic__input" />
                                            <span class="check-basic__icon" aria-hidden="true"></span>
                                            <span class="terms-link__text">[선택] OOO 이용약관</span>
                                        </label>
                                    </div>
                                    <button type="button" class="terms-link__arrow" aria-label="상세보기"></button>
                                </div>
                                <div class="terms-link">
                                    <div class="terms-link__check">
                                        <label class="check-basic check-basic--xs">
                                            <input type="checkbox" class="check-basic__input" />
                                            <span class="check-basic__icon" aria-hidden="true"></span>
                                            <span class="terms-link__text">[선택] OOO 이용약관</span>
                                        </label>
                                    </div>
                                    <button type="button" class="terms-link__arrow" aria-label="상세보기"></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="popBtnWrap">
                    <div class="popBtn">
                        <a href="javascript:;" class="confirmBtn disabled" role="button" aria-disabled="true">시작하기</a>
                    </div>
                    <a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button">
                        <img src="../../images/common/btn_popClose.png" alt="닫기" />
                    </a>
                </div>
            </div>
        </div>

        <script>
            $(function () {
                // [필수] 전체 동의 카드(첫 번째 .terms-card)의 개별 약관을 모두 체크해야
                // 하단 버튼이 활성화됩니다(NH_MD_PM_05/MSAR3110P_01과 동일한 관례).
                var $requiredCard = $('.terms-card').eq(0);
                var $requiredChecks = $requiredCard.find('.terms-card__list .check-basic__input');
                var $requiredMaster = $requiredCard.find('.terms-card__header .check-basic__input');
                var $confirmBtn = $('.popBtnWrap .confirmBtn');

                function syncConfirmBtn() {
                    var enabled = $requiredChecks.length > 0 && $requiredChecks.filter(':checked').length === $requiredChecks.length;
                    $confirmBtn.toggleClass('disabled', !enabled);
                    if (enabled) { $confirmBtn.removeAttr('aria-disabled'); } else { $confirmBtn.attr('aria-disabled', 'true'); }
                }

                // 전체동의(마스터) 체크박스는 update-ui.js의 initTermsSelectAll()이 네이티브
                // addEventListener로 개별 항목의 checked 값을 동기화합니다. 그 처리와 실행 순서가
                // 꼬이지 않도록, 같은 change 이벤트 틱이 다 끝난 다음 틱(setTimeout 0)에 최종
                // checked 상태를 다시 읽어 버튼 상태를 맞춥니다.
                $requiredChecks.add($requiredMaster).on('change', function () {
                    setTimeout(syncConfirmBtn, 0);
                });

                syncConfirmBtn();
            });
        </script>
    </body>
</html>
