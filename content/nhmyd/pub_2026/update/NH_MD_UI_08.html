<!doctype html>
<html lang="ko">
    <head>
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>[P] 자산연결</title>
        <script>
            $(document).ready(function () {
            	slidePopConfirm(); //TO-BE 디자인 높이 조절되는 slidePopConfirm 사용
            })
        </script>
    </head>

    <body>
        <div class="wrapper nhasset"><!-- 바닥페이지 --></div>
        <div class="nhasset popWrap nds slidePopConfirm">
            <div class="dim"></div>
            <div class="popInner">
                <h1>자산연결</h1>
                <div class="popCont">
                    <div class="popCont__inner">
                        <div class="text-stack center pb8">
                            <p class="text text--h2"><span>김농협님</span> <strong>신한투자증권</strong><span class="fwN">에 자산이 있는 것 같아요</span></p>
                            <p class="text text--body2">딱 한 곳만 먼저 연결해 볼까요?</p>
                        </div>
                        <div class="text-stack center">
                            <img src="../../images/makebetter/icon/img_agree-check_68.svg" alt="" class="result-icon">
                            <p class="text text--body1-medium">신한투자증권</p>
                        </div>
                    </div>
                </div>
                <div class="popBtnWrap">
                    <div class="popBtn half">
                        <a href="javascript:;" class="btnPressDefault" role="button">추천기관 연결</a>
                        <a href="javascript:;" class="btnPressPoint" role="button">기관 1개 연결</a>
                    </div>
                    <a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button">
                        <img src="../../images/common/btn_popClose.png" alt="닫기" />
                    </a>
                </div>
            </div>
        </div>
    </body>
</html>
