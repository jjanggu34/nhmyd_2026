<body>
  <div class="wrapper nhasset"><!-- 바닥페이지 --></div>

  <!-- ###################################### -->
  <!-- ### [팝업] [P] 인증방식 선택(인증서 없음) ### -->
  <!-- ###################################### -->
  <div class="nhasset popWrap fullLayerPop">
    <div class="popInner bgWhite mbType"> <!-- [수정 260706] [MD2604_036] 신용점수 올리기 서비스 內 인증프로세스 추가 : class="mbType" 추가 -->
      <h1>인증방식 선택</h1>
      <div class="popCont posRelative">
   
        <div class="fullyWrap ">
          <!-- -------------------------------------- -->
          <!-- [SECTION] 인증 보안 페이지로 이동 -->
          <!-- -------------------------------------- -->
          <div class="nhassetAuthWrap" role="group" >
            <h2 class="sectionTitle">NH인증서</h2>
            <p class="sectionDesc">금융, 일상업무도 간편하게!</p>
              <a href="javascript:;" class="bgIco icoPlus" aria-label="인증 보안 페이지로 이동" role="button"></a>
          </div>
          <!-- -------------------------------------- -->
        </div>
        <a href="javascript:;" class="authChangeBtn" role="button">다른 인증서로 인증하기</a>
      </div>
      <!-- -------------------------------------- -->
      <!-- [SECTION] 버튼영역 -->
      <!-- -------------------------------------- -->
      <div class="popBtnWrap">
        <div class="popBtn">
          <a href="javascript:;" class="confirmBtn disabled" role="button" aria-disabled="true">인증하기</a><!-- [D] 활성화 시 aria-disabled="true" / 클래스명 disabled 삭제 --->
        </div>
        <a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button">
          <img src="../../images/common/btn_popClose.png" alt="닫기" />
        </a>
      </div>
      <!-- -------------------------------------- -->
    </div>
  </div>
