<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script type="text/javascript">
	//샘플 : 케이스 화면 정의
	var _parameter = new URL(window.location.href).searchParams.get('pageID');
	$(document).ready(function(){
		var a = [
			'공통(MSCO1600P)', 
			'조회조건설정_은행업권(MSASC231P)', 
			'조회조건설정_전금업권(MSASC232P)', 
			'검색기간설정(MSCS2410P)',
			'데이터전송관리(MSPS5111P)',
			'자산연결내역안내(MSPS6000P)',
			'머니캘린더(MSCS2500P)'
		]; // 케이스 명
		var b = [
			'MSCO1600P', 
			'MSASC231P',
			'MSASC232P',
			'MSCS2410P',
			'MSPS5111P',
			'MSPS6000P',
			'MSCS2500P'
		]; // 함수 명
		var num = a.length; // 케이스 수
		uiCaseMenu(a,b,num);
		if(_parameter) $('.guide_select > .option > button[data-val="uiCase'+_parameter+'"]').trigger('click');
		else uiCaseMSCO1600P();
		slidePopConfirm();
	});

	//샘플 : 케이스 : 공통
	function uiCaseMSCO1600P(){uiCase(1,'조회설정')}

	//샘플 : 케이스 : 조회조건설정_은행업권
	function uiCaseMSASC231P(){uiCase(2, '조회조건 설정')}

	//샘플 : 케이스 : 조회조건설정_전금업권
	function uiCaseMSASC232P(){uiCase(3, '조회조건 설정')}

	//샘플 : 케이스 : 검색기간설정
	function uiCaseMSCS2410P(){uiCase(4, '검색기간 설정')}

	//샘플 : 케이스 : 데이터전송관리
	function uiCaseMSPS5111P(){uiCase(5,'조회설정')}

	//샘플 : 케이스 : 자산연결내역안내
	function uiCaseMSPS6000P(){uiCase(6,'조회기간 설정')}

	//샘플 : 케이스 : 머니캘린더
	function uiCaseMSCS2500P(){uiCase(7,'조회조건 설정')}

	//샘플 : 케이스
	function uiCase(a, b){
		var _txt = ['1주일', '1개월', '3개월', '6개월', '1년'];
		$('.popInner > h1').text(b);
		$('.transfer').show(); //조회설정(전체)
		$('.popSelWrap').hide();  //거래구분(머니캘린더)
		$('[name="sample20"]').closest('.roundChkWrap').find('li:last-child').show();
		$('.searchFormWrap > li:nth-child(1) ~ li').hide();
		$('.searchFormWrap > li:nth-child(1) > .formTit').show();
		$('.subTxt2').show().text('※ 조회기간은 최대 3개월까지만 설정 가능합니다.');

		if(a == 1){
			_txt = ['1주일', '1개월', '2개월', '3개월'];
			$('[name="sample20"]').closest('.roundChkWrap').find('li:last-child').hide();
		}

		if(a == 2 || a == 3){
			$('.searchFormWrap > li:last-child').show();
			$('.subTxt2').hide();
			if(a == 2) $('.searchFormWrap > li:nth-child(2)').show().next().hide();
			else $('.searchFormWrap > li:nth-child(3)').show().prev().hide();
		}

		if(a == 4){
			$('.searchFormWrap > li:nth-child(1) > .formTit').hide();
			$('.subTxt2').hide();
		}

		if(a == 5){
			_txt = ['1개월', '3개월', '6개월', '1년'];
			$('[name="sample20"]').closest('.roundChkWrap').find('li:last-child').hide();
			$('.searchFormWrap > li:nth-child(1) > .formTit').hide();
			$('.subTxt2').text('※ 조회기간은 최대 1년까지만 설정 가능합니다.');
		}

		if(a == 6){
			_txt = ['3개월', '6개월', '1년', '2년'];
			$('[name="sample20"]').closest('.roundChkWrap').find('li:last-child').hide();
			$('.searchFormWrap > li:nth-child(1) > .formTit').hide();
			$('.subTxt2').hide();
		}

		if(a == 7){
			$('.transfer').hide();
			$('.popSelWrap').show();
		}

		//조회기간 셋팅
		$('[name="sample20"]').each(function(i, obj){
			$(obj).attr('aria-label','조회기간('+_txt[i]+')').next().text(_txt[i]);
			if(_txt[i] == '3개월') $(obj).prop('checked',true);
			else $(obj).prop('checked',false);
		})

		//팝업 높이값 재정의
		var _height = $('.popWrap:visible .popInner h1, .popWrap:visible .popInner h2').outerHeight() + $('.popWrap:visible .popInner .popCont').outerHeight() + $('.popWrap:visible .popInner .popBtnWrap').height();
		$('.popWrap:visible .popInner').height(_height);
	}
</script>
