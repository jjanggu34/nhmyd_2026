<head>

<style>
.nhasset .balanceReview.morkup{position:relative;margin: 0}
.nhasset .balanceReview.morkup .swiper-container{height:100%}
.nhasset .balanceReview.morkup .swiper-slide {display:flex;flex-direction:column;flex: 0 0 auto;margin-top:24px;box-shadow: none;border-radius: 0;height:auto}
.nhasset .balanceReview.morkup .swiper-slide.active .morkupCont .slideDownImg{position:absolute;transform:translate3d(0,0,0);backface-visibility:hidden;animation:slideDown var(--dur,5s) 1s linear forwards}
.nhasset .balanceReview.morkup .swiper-control{margin-top:6px; width: 100%}
.nhasset .balanceReview.morkup .swiper-pagination .swiper-pagination-bullet{width:8px;height:8px;margin:0 4px;background-color:var(--border-color)}
.nhasset .balanceReview.morkup .swiper-pagination .swiper-pagination-bullet-active{width:16px;height:8px;border-radius:10px;background-color:var(--point1)}
.nhasset .balanceReview.morkup .swiper-slide .lookTit{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;align-items:center;min-height:88px;max-height:88px}
.nhasset .balanceReview.morkup .swiper-slide .lookTit strong,.nhasset .balanceReview.morkup .swiper-slide .lookTit p{margin-top: 0;flex: 0 0 100%}
.nhasset .balanceReview.morkup .swiper-slide .morkupInner{position: relative;display:flex;justify-content:center;flex:auto;height:406px}
.nhasset .balanceReview.morkup .swiper-slide .morkupInner .morkupFrame{position:absolute;overflow:hidden;display:inline-block;margin: 0 6px;width:220px;height:406px;border: 4px solid #4a4a4a;border-radius:32px;animation: slideUp 1s ease-out forwards;opacity:0;transform:scale(1);z-index: 10}
.nhasset .balanceReview.morkup .swiper-slide .morkupInner .morkupFrame:before{content: ''; position:absolute;top:9px;left:50%;transform:translateX(-50%);width:60px;height:10px;border-radius:999px;border:1px solid #4a4a4a;background-color: #000;z-index: 10}
.nhasset .balanceReview.morkup .simpilTxt{ text-align: center; font-size: var(--fontSize12); font-weight: 500; color: var(--color4)}

@media screen and (max-height : 800px ){
  .nhasset .balanceReview.morkup .swiper-control{margin-top: calc(6px * 0.75)}
  .nhasset .balanceReview.morkup .swiper-slide{margin-top: calc(24px * 0.75)}
  .nhasset .balanceReview.morkup .swiper-slide .morkupInner{height: calc(406px * 0.8)}
  .nhasset .balanceReview.morkup .swiper-slide .morkupInner .morkupFrame:before{width:calc(60px * 0.8)}
  .nhasset .balanceReview.morkup .swiper-slide .morkupInner .morkupFrame{ width:calc(220px * 0.8) ;height:calc(406px * 0.8)}
  .nhasset .balanceReview.morkup .swiper-slide .lookTit{min-height: calc(88px * 0.8);max-height: calc(88px * 0.8)}
  .nhasset .balanceReview.morkup .mb24{margin-bottom:calc(24px * 0.75) !important}
  .nhasset .lookSwiper.balanceReview.morkup .lookTit span, .nhasset .lookSwiper.balanceReview.morkup .lookTit strong{font-size: calc(var(--fontSize22) * 0.7)}
  .nhasset .lookSwiper.balanceReview.morkup .lookTit .fs14{font-size:calc( var(--fontSize14) * 0.8) !important}}
  .nhasset .balanceReview.morkup .simpilTxt{margin-top: calc(16px * 0.75); text-align: center;font-size:calc( var(--fontSize12) * 0.7);font-weight: 500; color: var(--color4);}
@media screen and  (max-height : 653px ){
  .nhasset .balanceReview.morkup .swiper-control{margin-top: calc(6px * 0.65)}
  .nhasset .balanceReview.morkup .swiper-slide{margin-top: calc(24px * 0.65)}
  .nhasset .balanceReview.morkup .swiper-slide .morkupInner{height: calc(406px * 0.7)}
  .nhasset .balanceReview.morkup .swiper-slide .morkupInner .morkupFrame:before{width: calc(60px * 0.7);}
  .nhasset .balanceReview.morkup .swiper-slide .morkupInner .morkupFrame{ width: calc(220px * 0.7) ; height:calc(406px * 0.7)}
  .nhasset .balanceReview.morkup .swiper-slide .lookTit{min-height: calc(88px * 0.7); max-height: calc(88px * 0.7)}
  .nhasset .balanceReview.morkup .mb24{margin-bottom: calc(24px * 0.65)!important}
  .nhasset .lookSwiper.balanceReview.morkup .lookTit span, .nhasset .lookSwiper.balanceReview.morkup .lookTit strong{font-size:calc(var(--fontSize22) * 0.65)}
  .nhasset .lookSwiper.balanceReview.morkup .lookTit .fs14{font-size:calc(var(--fontSize14) * 0.65)!important}}
  .nhasset .balanceReview.morkup .simpilTxt{margin-top: calc(16px * 0.65); text-align: center;font-size:calc( var(--fontSize12) * 0.65);font-weight: 500; color: var(--color4);}
</style>
</head>
<body>
  <div class="wrapper nhasset bgWhite">
    <!-- header -->
    <div class="header">
      <a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
      <h1><img  src="../../images/makebetter/logo_tit_mydata.svg" class="mt0" alt="NH마이데이터"></h1><!-- 2025-10-21 타이틀 이미지 변경 -->
      <a href="javascript:;" class="btnGoHome" role="button"><span class="blind">Home</span></a><!-- 2025-10-27 가입 전 홈 버튼 추가 요청 -->
    </div>
    <!-- //header -->

    <!-- ###################################### -->
    <!-- ### NH마이데이터 ### -->
    <!-- ###################################### -->
    <div class="container bgWhite">
    <!-- 2025-11-19 디자인 수정 요청 -->
      <div class="lookSwiper balanceReview morkup">
        <div class="swiper-container">
          <div class="swiper-wrapper">
            <div class="swiper-slide">
              <h3 class="lookTit mb24">
                <strong>흩어진 내자산 정보를 모아주는<br>생활금융파트너</strong >
              </h3>
              <div class="morkupWrap">
                <div class="morkupInner">
                  <div class="morkupFrame">
                    <div class="morkupCont">
                      <img src="../../images/makebetter/banner/img_morkup_01.png" alt="흩어진 내자산 정보를 모아주는 생활금융파트너" class="slideDownImg" style="--dur:12.3s">
                    </div>
                  </div>
                </div>
              </div>
              <p class="simpilTxt">준법감사인 심의필 2025-2619(2025.4.28~2026.12.31)</p>
            </div>
            <div class="swiper-slide">
              <h3 class="lookTit mb24">
                <strong >자산 모아보기</strong >
                  <p class="fs14 -medium color3">당신의 자산 A to Z<br>현황부터 연금까지</p>
              </h3>
              <div class="morkupWrap">
                <div class="morkupInner">
                  <div class="morkupFrame">
                    <div class="morkupCont">
                      <img src="../../images/makebetter/banner/img_morkup_02.png" alt="" class="slideDownImg" style="--dur:19.8s">
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="swiper-slide">
              <h3 class="lookTit mb24">
                <strong >소비 모아보기</strong >
                  <p class="fs14 -medium color3">줄일 수 있는건 줄여보자고요!<br>소비흐름을 한눈에</p>
              </h3>
              <div class="morkupWrap">
                <div class="morkupInner">
                  <div class="morkupFrame">
                    <div class="morkupCont">
                      <img src="../../images/makebetter/banner/img_morkup_03.png" alt="" class="slideDownImg" style="--dur:11.5s">
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="swiper-slide">
              <h3 class="lookTit mb24">
                <strong >밸런스진단</strong >
                  <p class="fs14 -medium color3">내 자산의 균형을 찾아주는<br>스마트 진단!</p>
              </h3>
              <div class="morkupWrap">
                <div class="morkupInner">
                  <div class="morkupFrame">
                    <div class="morkupCont">
                      <img src="../../images/makebetter/banner/img_morkup_04.png" alt="" class="slideDownImg" style="--dur:9.3s">
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="swiper-slide">
              <h3 class="lookTit mb24">
                <strong >금융플래너</strong >
                  <p class="fs14 -medium color3">자동이체, 각종 금융일정,<br>연체방어까지 착착착!</p>
              </h3>
              <div class="morkupWrap">
                <div class="morkupInner">
                  <div class="morkupFrame">
                    <div class="morkupCont">
                      <img src="../../images/makebetter/banner/img_morkup_05.png" alt="" class="slideDownImg" style="--dur:8.2s">
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="swiper-slide">
              <h3 class="lookTit mb24">
                <strong >보고서</strong >
                  <p class="fs14 -medium color3">세무사처럼 자세한<br>나만의 컨설팅 브리핑</p>
              </h3>
              <div class="morkupWrap">
                <div class="morkupInner">
                  <div class="morkupFrame">
                    <div class="morkupCont">
                      <img src="../../images/makebetter/banner/img_morkup_06.png" alt="" class="slideDownImg" style="--dur:9.6s" >
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="swiper-slide">
              <h3 class="lookTit mb24">
                <strong >헬스케어</strong >
                  <p class="fs14 -medium color3">건강은 가장 소중한<br>내 자산!</p>
              </h3>
              <div class="morkupWrap">
                <div class="morkupInner">
                  <div class="morkupFrame">
                    <div class="morkupCont">
                      <img src="../../images/makebetter/banner/img_morkup_07.png" alt="" class="slideDownImg"  style="--dur:6.3s">
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="swiper-control">
            <div class="swiper-pagination"></div>
          </div>
   
        </div>
      </div>
    <!-- // 2025-11-19 디자인 수정 요청 -->
      <div class="areaBtnDefault">
        <a href="javascript:;" class="btnPressPoint" role="button">서비스 가입하기</a>
      </div>
    </div>
  </div>

  <script>
    var swiper = new Swiper('.lookSwiper .swiper-container', {
      slidesPerView: '1',
      // spaceBetween: 12,
      centeredSlides: true,
      observer: true,
      observeParents: true,
      loop: true,
      // autoplay: {
      //   delay: 5000, 
      //   disableOnInteraction: false,      // 유저가 터치해도 재시작
      //   pauseOnMouseEnter: true           // 마우스 올라가면 일시정지
      // },
      pagination: {
        el: '.swiper-pagination',
        type: 'bullets',
        clickable: true,
        bulletElement: 'a',
      },
      navigation: {
        nextEl: '.swiper-button-next',
        prevEl: '.swiper-button-prev',
      },

      observer: true,
      observeParents: true,

      on: {
        init: function () {
          $('.lookSwiper .swiper-slide').attr('aria-hidden', 'true');
          $('.lookSwiper .swiper-slide-active').attr('aria-hidden', 'false');
        },
        slideChangeTransitionEnd: function (index) {
          var $shareBannerBtn = $('.lookSwiper .swiper-pagination');
          $shareBannerBtn.find('a').attr('title', '');
          $shareBannerBtn.find('a').eq(this.activeIndex).attr('title', '선택됨');
          $('.lookSwiper .swiper-slide').attr('aria-hidden', 'true');
          $('.lookSwiper .swiper-slide-active').attr('aria-hidden', 'false');

          $('.swiper-slide').removeClass('active');
          if (!$('.swiper-slide').eq(this.activeIndex).hasClass('once')) {
            $('.swiper-slide').eq(this.activeIndex).addClass('active');
          } else if ($('.swiper-slide').hasClass('slideR3')) {
            $('.swiper-slide').eq(this.activeIndex).addClass('once');
          }
        },
      },
    });
  </script>
</body>
</html>
