<body>
<div class="wrapper nhasset bgWhite">
  <!-- header -->
  <div class="header">
    <a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
    <h1 class="fs18 -medium">NH마이데이터</h1><!-- 2025-10-21 타이틀 이미지 변경, 2025-11-27 텍스트로 재 변경 -->
    <a href="javascript:;" class="btnGoHome" role="button"><span class="blind">Home</span></a><!-- 2025-10-27 가입 전 홈 버튼 추가 요청 -->
  </div>
  <!-- //header -->

  <!-- ###################################### -->
  <!-- ### NH마이데이터 ### -->
  <!-- ###################################### -->
  <div class="container bgWhite">
    <div class="lookSwiper balanceReview morkup">
      <div class="swiper-container">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <h3 class="lookTit mb24">
              <strong>흩어진 내자산 정보를 모아주는<br>생활금융파트너</strong>
            </h3>
            <div class="morkupWrap">
              <div class="morkupInner">
                <div class="morkupFrame">
                  <div class="morkupCont">
                    <img src="../../images/makebetter/banner/img_morkup_01.png" alt="NH마이데이터 안내 이미지" class="slideDownImg" style="--dur:12.3s">
                  </div>
                </div>
              </div>
            </div>
            <p class="simpilTxt">준법감사인 심의필 2025-5973(2025.12.2~2026.11.18)</p><!-- 2025-12-02 심의필 확정 -->
          </div>
          <div class="swiper-slide">
            <h3 class="lookTit mb24">
              <strong>자산모아보기</strong>
                <p class="fs14 -medium color3">당신의 자산 A to Z<br>현황부터 연금까지</p>
            </h3>
            <div class="morkupWrap">
              <div class="morkupInner">
                <div class="morkupFrame">
                  <div class="morkupCont">
                    <img src="../../images/makebetter/banner/img_morkup_02.png" alt="자산모아보기 안내 이미지" class="slideDownImg" style="--dur:19.8s">
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="swiper-slide">
            <h3 class="lookTit mb24">
              <strong>소비모아보기</strong>
                <p class="fs14 -medium color3">줄일 수 있는건 줄여보자고요!<br>소비흐름을 한눈에</p>
            </h3>
            <div class="morkupWrap">
              <div class="morkupInner">
                <div class="morkupFrame">
                  <div class="morkupCont">
                    <img src="../../images/makebetter/banner/img_morkup_03.png" alt="소비모아보기 안내 이미지" class="slideDownImg" style="--dur:11.5s">
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="swiper-slide">
            <h3 class="lookTit mb24">
              <strong>밸런스진단</strong>
                <p class="fs14 -medium color3">내 자산의 균형을 찾아주는<br>스마트 진단!</p>
            </h3>
            <div class="morkupWrap">
              <div class="morkupInner">
                <div class="morkupFrame">
                  <div class="morkupCont">
                    <img src="../../images/makebetter/banner/img_morkup_04.png" alt="밸런스진단 안내 이미지" class="slideDownImg" style="--dur:9.3s">
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="swiper-slide">
            <h3 class="lookTit mb24">
              <strong>금융플래너</strong>
                <p class="fs14 -medium color3">자동이체, 각종 금융일정,<br>연체방어까지 착착착!</p>
            </h3>
            <div class="morkupWrap">
              <div class="morkupInner">
                <div class="morkupFrame">
                  <div class="morkupCont">
                    <img src="../../images/makebetter/banner/img_morkup_05.png" alt="금융플래너 안내 이미지" class="slideDownImg" style="--dur:8.2s">
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="swiper-slide">
            <h3 class="lookTit mb24">
              <strong>보고서</strong>
                <p class="fs14 -medium color3">세무사처럼 자세한<br>나만의 컨설팅 브리핑</p>
            </h3>
            <div class="morkupWrap">
              <div class="morkupInner">
                <div class="morkupFrame">
                  <div class="morkupCont">
                    <img src="../../images/makebetter/banner/img_morkup_06.png" alt="보고서 안내 이미지" class="slideDownImg" style="--dur:9.6s" >
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="swiper-slide">
            <h3 class="lookTit mb24">
              <strong>헬스케어</strong>
                <p class="fs14 -medium color3">건강은 가장 소중한<br>내 자산!</p>
            </h3>
            <div class="morkupWrap">
              <div class="morkupInner">
                <div class="morkupFrame">
                  <div class="morkupCont">
                    <img src="../../images/makebetter/banner/img_morkup_07.png" alt="헬스케어 안내 이미지" class="slideDownImg"  style="--dur:6.3s">
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>
        <div class="swiper-control">
          <div class="swiper-pagination"></div>
        </div>
      </div>
    </div>

    <div class="areaBtnDefault">
      <a href="javascript:;" class="btnPressPoint" role="button">서비스 가입하기</a>
    </div>
  </div>
</div>

<script>
  var swiper = new Swiper('.lookSwiper .swiper-container', {
    slidesPerView: '1',
    // spaceBetween: 12,
    centeredSlides: true,
    observer: true,
    observeParents: true,
    loop: true,
    // autoplay: {
    //   delay: 5000, 
    //   disableOnInteraction: false,      // 유저가 터치해도 재시작
    //   pauseOnMouseEnter: true           // 마우스 올라가면 일시정지
    // },
    pagination: {
      el: '.swiper-pagination',
      type: 'bullets',
      clickable: true,
      bulletElement: 'a',
    },
    navigation: {
      nextEl: '.swiper-button-next',
      prevEl: '.swiper-button-prev',
    },
    observer: true,
    observeParents: true,
    on: {
      init: function () {
        $('.lookSwiper .swiper-slide').attr('aria-hidden', 'true');
        $('.lookSwiper .swiper-slide-active').attr('aria-hidden', 'false');
      },
      slideChangeTransitionEnd: function (index) {
        var $shareBannerBtn = $('.lookSwiper .swiper-pagination');
        $shareBannerBtn.find('a').attr('title', '');
        $shareBannerBtn.find('a').eq(this.activeIndex).attr('title', '선택됨');
        $('.lookSwiper .swiper-slide').attr('aria-hidden', 'true');
        $('.lookSwiper .swiper-slide-active').attr('aria-hidden', 'false');

        $('.swiper-slide').removeClass('active');
        if (!$('.swiper-slide').eq(this.activeIndex).hasClass('once')) {
          $('.swiper-slide').eq(this.activeIndex).addClass('active');
        } else if ($('.swiper-slide').hasClass('slideR3')) {
          $('.swiper-slide').eq(this.activeIndex).addClass('once');
        }
      },
    },
  });
</script>
</body>
</html>
