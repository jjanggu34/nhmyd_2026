<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">
<meta name="author" content="">
<meta name="content" content="">
<meta name="keywords" content="농협자산관리">
<meta name="description" content="농협자산관리">

<meta http-equiv="Expires" content="-1">
<title>철회완료 | 연결자산관리 | 설정관리</title>
<script src="../pub-assets/js/head.js"></script>
</head>
<body class="nhd_pay"><!-- NH Pay일 경우 nhd_pay 클래스 -->
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<h1>연결자산관리</h1>
		<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
		<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a>
	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] 철회완료 ### -->
	<!-- ###################################### -->
	<div class="container">
		<!-- -------------------------------------- -->
		<!-- [SECTION] 완료문구 -->
		<!-- -------------------------------------- -->
		<!-- [CASE] 성공 -->
		<div class="assetCancleConfirmWrap">
			<div class="title">자산연결 해제 및 삭제를<br>완료하였습니다</div>
		</div>
		<!-- [CASE] 실패 -->
        <div class="assetCancleConfirmWrap cnNone">
			<div class="title">잠시 후 다시 시도해주세요</div>
		</div>

		<!-- -------------------------------------- -->
		<!-- [SECTION] 결과목록 -->
		<!-- -------------------------------------- -->
		<div class="boxTypeWrap listBoxWrap mt30">
			<div class="listNum">
				<span>성공</span>
				<span>실패</span>
			</div>

			<!-- [CASE] 성공 -->
			<div class="connLine">
				<div class="totalTitWrap dib">
					<h2 class="listTitWrap noneTogg dib">
						<span class="titL w100p">
							<span class="imgWrap">
								<img src="../../images/logos/AAEM0000.png" alt="" class="imgLogo">
							</span>
							<span class="accTit">우리은행</span>
						</span>
						<span class="titR">
							<em class="tag bgGray">해제성공</em>
							<em class="tag bgGray">삭제성공</em>
						</span>
					</h2>
				</div>
			</div>

			<!-- [CASE] 실패 -->
			<div class="assetTotalList toggleWrap connLine">
				<div class="totalTitWrap">
					<a href="javascript:;" class="toggleBtn" aria-expanded="false" role="button">
						<h2 class="listTitWrap">
							<span class="titL">
								<span class="imgWrap">
									<img src="../../images/logos/AAEO0000.png" alt="" class="imgLogo">
								</span>
								<span class="accTit">국민은행</span>
							</span>
							<span class="titR">
								<span class="connectStatus noConn">실패</span>
							</span>
						</h2>
					</a>
				</div>
				<div class="totalAccList toggleCont" style="display:none">
					<p class="garyBox">응답지연(80002E10)</p>
				</div>
			</div>
			<!-- // -->
		</div>

		<!-- -------------------------------------- -->
		<!-- [SECTION] 하단버튼 -->
		<!-- -------------------------------------- -->
		<div class="areaBtnDefault">
			<a href="javascript:;" class="btnPressPoint" role="button">확인</a>
		</div>
		<!-- -------------------------------------- -->
	</div>
	<!-- ###################################### -->
</div>

<!-- ###################################### -->
<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script>
	//샘플 : 케이스 화면 정의
	$(document).ready(function(){
		var a = [
			'성공(MSPS4140)', 
			'실패(MSPS4140_1)'
			]; // 케이스 명
		var b = [
			'MSPS4140', 
			'MSPS41401'
			]; // 함수 명
		var num = a.length; // 케이스 수
		uiCaseMenu(a,b,num);
		uiCaseMSPS4140();
	});

	//샘플 : 케이스 : 성공
	function uiCaseMSPS4140(){uiCase(1)}

	//샘플 : 케이스 : 실패
	function uiCaseMSPS41401(){uiCase(2)}

	//샘플 : 케이스 
	function uiCase(a){
		$('.assetCancleConfirmWrap').hide().filter(':nth-child('+a+')').show();
		$('.listBoxWrap > .listNum > span').hide().filter(':nth-child('+a+')').show();
		$('.listBoxWrap > .connLine').show();
		if(a == 2) {
			$('.listBoxWrap > .connLine:not(.toggleWrap)').hide();
		}
	}
</script>
<!-- ###################################### -->
</body>
</html>
