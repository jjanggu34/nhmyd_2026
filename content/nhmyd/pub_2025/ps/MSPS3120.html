<!-- ###################################### -->
<script type="text/javascript">
	//샘플 : 상단으로 이동 업권선택 화면만 재정의
	//업권 탭메뉴 첫번째인 상태에서 탑버튼 선택 시 : 페이지 상단 이동
	//업권 탭메뉴 두번째 이상인 상태에서 탑버튼 선택 시 : 첫번째메뉴로 이동
	$(document).off('click', '.goTopBtn2').on('click', '.goTopBtn2' , function(){
		var _index = $('.anchorSubject li.selected').index();
		if(_index == 0) $('html,body').animate({ scrollTop: '0' }, 300);
		else $('.anchorSubject li:eq(0) a').trigger('click');
	});

	//샘플 : 업권선택 검색영역
	function anchorSearch_return() {
		$('.anchorListdWrap').removeClass('anchorSearch');
		$('.areaBtnDefault.statSearch').hide();
		$('.areaBtnDefault.statNormal').show();
		$('html, body').scrollTop(0)
	}

	//샘플 : 업권선택 앵커이동
	function anchorWrap() {
		var $thisPoTop = $('.anchorSubjectWrap').offset().top;
		var $thisPoTop2 = $('.anchorSearchArea').offset().top;
		var $heightHeader = $('.header').outerHeight();

		$('.anchorListdWrap').each(function(){
			$('.anchorListdWrap h3.tit').attr('tabindex','-1');
			var $winHeight = $(window).outerHeight();
			var $heightHeader = $('.header').outerHeight();
			var $heightTab = $('.anchorSubject').outerHeight();
		});

		$('.anchorSubject a').click(function(){
			var $this = $(this);
			var $thisAttr = $this.attr('anchor-title');
			$('.wrap_bank_check').each(function(){
				var $thisTarget = $(this);
				var $targetPo = $(this).offset().top;
				var $heightHeader = $('.header').outerHeight();
				var $heightTab = $('.anchorSubjectWrap').outerHeight();
				var $hightM = $heightHeader + $heightTab;
				if ($(this).attr('anchor-cont') == $thisAttr ) {
					$(this).addClass('active');
					$('html, body').stop().animate({scrollTop:$targetPo - $hightM + 15},400,function(){
						$('.anchorSubject > li').removeClass('selected');
						$this.parent('li').addClass('selected');
						$thisTarget.find('h3.tit').focus();
					});
				}
			});
		});

		$('.anchorListdWrap').each(function(){
			$(window).on('scroll',function(){
				$('.wrap_bank_check').each(function(){
					var $targetPo = $(this).offset().top;
					var $heightHeader = $('.header').outerHeight();
					var $heightTab = $('.anchorSubjectWrap').outerHeight();
					var $hightM = $heightHeader + $heightTab;
					var $thisCur = $targetPo - $hightM ;
					var $scrollTop = $('html, body').scrollTop();
					var $thisAttr = $(this).attr('anchor-cont');
					var $targetAttr = $('anchorSubject a').attr('anchor-title');
					var $ulListNum = $('.anchorSubject > li').length -1;
					if ($thisCur <= $scrollTop ) {
						$('.anchorSubject > li > a').each(function(){
							if ($(this).attr('anchor-title') == $thisAttr ) {
								$('.anchorSubject > li').removeClass('selected');
								$('.anchorSubject > li a').attr('aria-selected','false');
								$(this).parent('li').addClass('selected');
								$(this).attr('aria-selected','true');
								$('.anchorSubject > li.selected').each(function(){var $thisIndex = $(this).index();if ($ulListNum > $thisIndex) {var $thispo_left = $(this).position().left;$('.anchorSubjectWrap').scrollLeft($thispo_left)}else{var $thisWidth = $(this).outerWidth();var $thispo_left = $(this).position().left;$('.anchorSubjectWrap').scrollLeft($thispo_left + $thisWidth)}
								});
							}
						});
					}
				});

				$('.anchorSubjectWrap').each(function(){
					var $this = $(this);
					var $scTop = $('html, body').scrollTop() + $heightHeader;
					if ($thisPoTop < $scTop) {
						$('.anchorSubjectWrap').addClass('hasSticky');
					}else{
						$('.anchorSubjectWrap').removeClass('hasSticky');
					}
				});
			});
		});
	}

	$(document).ready(function(){
		//샘플 : 탭버튼 ARIA 속성 제거
		setTimeout(function(){
			var _wrap = $('.tabWrap.type01');
			_wrap.find('ul, li , a').removeAttr('role');
			_wrap.find('a').removeAttr('aria-selected');
		},1000);

		//샘플 : 기관명 검색 영역
		$('.noResultWrap').hide();
		$('.anchorSearchArea input[type="text"]').click(function(){
		}).on('focusin',function(){
			$('.anchorListdWrap').addClass('anchorSearch');
			$('.goTopBtn2').hide();
		}).on('focusout',function(){
			$('.anchorListdWrap').removeClass('anchorSearch');
			$('.goTopBtn2').show();
		});

		//샘플 : 검색 버튼 클릭이벤트 : 데이터 없음
		$('.btnSearch').on('click',function(){
			$('.anchorListdWrap, .joinGroup, .areaBtnDefault.statNormal').hide();
			$('.noResultWrap, .areaBtnDefault.statSearch').show();
		});

		//샘플 : 검색 시 노출되는 하단 고정 버튼 클릭 이벤트 : 기본 상태로 돌아옴
		$(document).on('click','.areaBtnDefault.statSearch a', function(){
			$('.anchorSearchArea input[type="text"]').val('')
			$('.anchorListdWrap, .joinGroup, .areaBtnDefault.statNormal').show();
			$('.noResultWrap, .areaBtnDefault.statSearch').hide();
		});

		//샘플 : 기관 선택 이벤트
		$('.wrap_bank_check ul input[type="checkbox"]').each(function(){
			$(this).on('change',function(){
				var $count_all = $('.wrap_bank_check ul input[type="checkbox"]:checked').length;
				var $count = $(this).closest('.wrap_bank_check').find('ul input[type="checkbox"]:checked').length;
				var $tab_id = $(this).closest('.wrap_bank_check').attr('anchor-cont');
				var $btn = $('.areaBtnDefault.statNormal .btnPressPoint');

				//기관 수 제한
				if ($count_all > 50) {
					alert('연결 가능한 기관 수를 초과하였습니다.<br>기관 선택은 최대 50개 까지 입니다.');
					$(this).prop('checked',false);
					$chek_count = 50; 
				}
				
				//기관 수 적용 : 업권탭
				if ($count > 0) $('.anchorSubject').find('[anchor-title="'+$tab_id+'"] .count').text($count);
				else $('.anchorSubject').find('[anchor-title="'+$tab_id+'"] .count').text('');

				//기관 수 적용 : 버튼
				if ($count_all > 0){
					if($btn.hasClass('disabled')) $btn.removeClass('disabled').removeAttr('aria-disabled');
					$btn.text('선택한 기관 '+$count_all+'개 연결하기');
				}else{
					$btn.addClass('disabled').attr('aria-disabled','true').text('선택한 기관이 없습니다');
				}
			});
		});

		anchorWrap();
	});
</script>
