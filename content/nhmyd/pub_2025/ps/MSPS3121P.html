<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner">
		<h1>가입기관 불러오기</h1>
		<div class="popCont">
			<div class="transfer">
				<p class="defSubTit2"><strong>고객님이 보유한 상품이 있는 기관<br>
				<span class="pointColor">(은행, 저축은행, 증권, 카드)</span>을 선택합니다. </strong></p>
				<div class="grayBgLine mt5">
					<dl class="infoDl">
						<dd class="defTxtGry">계좌 통합 관리 서비스(금융기관 공동의 서비스로 금융결제원에서 관련 시스템을 운영)를 통해 거래하는 금융기관 정보를 조회합니다.</dd>
					</dl>
					
				</div>
			</div>
		</div>
		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">불러오기</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
