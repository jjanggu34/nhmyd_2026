<body class="nhd_pay"><!-- NH Pay일 경우 nhd_pay 클래스 -->
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1>자산정보 조회 내역</h1>
		<a href="javascript:;" class="btnNav"><span>전체메뉴</span></a>
	</div>
	<!-- //header -->

	<!-- ###################################### -->
	<!-- ### [내용] 자산정보 조회 내역 ### -->
	<!-- ###################################### -->
	<div class="container">
		<!-- -------------------------------------- -->
		<!-- [SECTION] 자산정보 -->
		<!-- -------------------------------------- -->
		<div class="boxTypeWrap">
			<div class="agencyDetail">
				<span class="imgWrap">
					<img src="../../images/logos/AAER0000.png" alt="" class="imgLogo">
					<div class="subInfoWrap">
						<div class="bankName">신한 주거래 미래설계통장</div>
						<span class="subInfo">신한은행 110110110110110</span>
					</div>
				</span>
			</div>
		</div>

		<!-- -------------------------------------- -->
		<!-- [SECTION] 수집내역정보 -->
		<!-- -------------------------------------- -->
		<!-- [CASE] 내역있음 -->
		<div class="boxTypeWrap">
			<!-- [조회기간선택] -->
			<div class="stList boxType">
				<a href="javascript:;" title="조회기간 선택" aria-haspopup="true">
					<span class="selectValue">2022.03.30 ~ 2222.06.30</span>
					<span class="selectBtn"></span>
				</a>
				<select name="" title="선택해주세요">
					<option value=""></option>
				</select>
			</div>
			<!-- [목록] -->
			<ul class="listTypeTable">
				<li>
					<dl>
						<dt>조회일자</dt>
						<dd>YYYY.MM.DD hh:mm:ss</dd>
					</dl>
					<dl>
						<dt>조회구분</dt>
						<dd>수신계좌 기본정보 표기(정기)</dd>
					</dl>
					<dl>
						<dt>성공여부</dt>
						<dd>성공</dd>
					</dl>
				</li>
				<li>
					<dl>
						<dt>조회일자</dt>
						<dd>YYYY.MM.DD hh:mm:ss</dd>
					</dl>
					<dl>
						<dt>조회구분</dt>
						<dd>수신계좌 기본정보 표기(정기)</dd>
					</dl>
					<dl>
						<dt>성공여부</dt>
						<dd><button type="button" class="linkType1 error">실패</button></dd>
					</dl>
				</li>
			</ul>
			<!-- [더보기] -->
			<div class="listMoreBtn mt5">
				<a href="javascript:;" title="항목 더보기">더보기</a>
			</div>
			<!-- // -->
		</div>

		<!-- [CASE] 내역없음 -->
		<div class="nolistBox">
			<div class="noResultWrap"><p>조회 내역이 없습니다.</p></div>
		</div>
		<!-- // -->
		<!-- -------------------------------------- -->
	</div>
	<!-- ###################################### -->
</div>
</body>
</html>
