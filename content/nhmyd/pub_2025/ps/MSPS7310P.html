<!-- ### [팝업] 권유직원 확인 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap fullLayerPop">
	<div class="popInner">
		<h1>권유직원 찾기</h1>
		<div class="popCont pb0">
			<!-- // -->
			<div class="mesArea1 img1">
				<p>
					<strong>선택하신 권유직원을 확인해주세요</strong>
					<span>등록 후에는 권유직원을 변경할 수 없습니다</span>
				</p>
			</div>
			<!-- // -->
			<div class="wrapTblDefault">
				<table>
					<caption>권유직원 정보(지점, 직원)</caption>
					<colgroup>
						<col style="width:30%">
						<col style="width:auto">
					</colgroup>
					<tbody>
						<tr>
							<th scope="row">지점</th>
							<td>의왕내손</td>
						</tr>
						<tr>
							<th scope="row">직원</th>
							<td>김*원(11111****)</td>
						</tr>
					</tbody>
				</table>
			</div>
			<!-- // -->
		</div>
		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" role="button">다시 선택</a>
				<a href="javascript:;" class="confirmBtn" role="button">등록</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
