<!-- ### [팝업] NH인증서 이용동의  ### -->

<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner">
		<h1>이용동의</h1>
		<div class="popCont">
			<div class="formWrap selectAll mt0 pt0">
				<div class="total">
					<div class="formHolder check">
						<input type="checkbox" id="type_all01" checked="checked" class="chekTypeOther">
						<label class="check" for="type_all01">전체동의</label>
					</div>
				</div>
				<div class="cont" >
					<div class="formHolder check ">
						<input type="checkbox" id="type01" checked="checked">
						<label class="check" for="type01"><em>[필수]</em> NH모바일인증서 서비스 이용약관</label>
						<a href="javascript:;" class="btnView" role="button" title="[필수]NH모바일인증서 서비스 이용약관 보기"></a>
					</div>
					<div class="formHolder check">
						<input type="checkbox" id="type02" checked="checked">
						<label class="check" for="type02"><em>[필수]</em> 개인(신용)정보 수집·이용 동의서<br>(NH인증서)</label>
						<a href="javascript:;" class="btnView" role="button" title="[필수]개인(신용)정보 수집·이용 동의서 (NH인증서) 보기"></a>
					</div>
				</div>
			</div>

		</div>
		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">확인</a>
			</div>
			<a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/makebetter/icon/ico_close16_24.svg" alt="닫기"></a>
		</div>
	</div>
