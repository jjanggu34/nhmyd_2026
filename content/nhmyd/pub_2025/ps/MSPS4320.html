			 </div>

			<!-- [CASE] 성공 -->
			<div class="connLine">
				<div class="totalTitWrap">
					<h2 class="listTitWrap noneTogg">
						<span class="titL">
							<span class="imgWrap">

							</span>
							<span class="accTit">우리은행</span>
						</span>
						<span class="titR">
							<span class="connectStatus sucessConn">성공</span>
						</span>
					</h2>
				</div>
			</div>
			<!-- [CASE] 실패 -->
			<div class="assetTotalList toggleWrap connLine">
				<div class="totalTitWrap">
					<a href="javascript:;" class="toggleBtn"> 
						<h2 class="listTitWrap">
							<span class="titL">
								<span class="imgWrap">
									<img src="../../images/logos/AAFO0000.png" alt="" class="imgLogo">
								</span>
								<span class="accTit">현대카드</span>
							</span>
							<span class="titR">
								<span class="connectStatus noConn">실패</span>
							</span>
						</h2>
					</a>
				</div>
				<div class="totalAccList toggleCont" style="display:none">
					<p class="garyBox">응답지연(80002E10)</p>
				</div>
			</div>
			<!-- // -->
			<div class=" connLine">
				<div class="totalTitWrap">
					<h2 class="listTitWrap noneTogg">
						<span class="titL">
							<span class="imgWrap">
								<img src="../../images/logos/AAEO0000.png" alt="" class="imgLogo">
							</span>
							<span class="accTit">국민은행</span>
						</span>
						<span class="titR">
							<span class="connectStatus sucessConn">성공</span>
						</span>
					</h2>
				</div>
			</div>
			<!-- // -->
			<div class="connLine">
				<div class="totalTitWrap">
					<h2 class="listTitWrap noneTogg">
						<span class="titL">
							<span class="imgWrap">
								<img src="../../images/logos/PBAAVN0000.png" alt="" class="imgLogo">
							</span>
							<span class="accTit">국민건강보험공단</span>
						</span>
						<span class="titR">
							<span class="connectStatus sucessConn">성공</span>
						</span>
					</h2>
				</div>
			</div>
			<!-- // -->
		</div>

		<!-- -------------------------------------- -->
		<!-- [SECTION] 하단버튼 -->
		<!-- -------------------------------------- -->
		<div class="areaBtnDefault">
			<a href="javascript:;" class="btnPressPoint" role="button">확인</a>

<!-- ###################################### -->
<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script>
	//샘플 : 케이스 화면 정의
	$(document).ready(function(){
		var a = [
			'성공(MSPS4320)', 
			'실패(MSPS4320_1)'
			]; // 케이스 명
		var b = [
			'MSPS4320', 
			'MSPS43201'
			]; // 함수 명
		var num = a.length; // 케이스 수
		uiCaseMenu(a,b,num);
		uiCaseMSPS4320();
	});

	//샘플 : 케이스 : 성공
	function uiCaseMSPS4320(){uiCase(1)}

	//샘플 : 케이스 : 실패
	function uiCaseMSPS43201(){uiCase(2)}

	//샘플 : 케이스 
	function uiCase(a){
		$('.confirmMsg').hide().filter(':nth-child('+a+')').show();
		$('.listBoxWrap > .listNum > span').show();
		$('.listBoxWrap > .connLine').show();
		if(a == 2) {
			$('.listBoxWrap > .listNum > span:first-child').hide();
			$('.listBoxWrap > .connLine:not(.toggleWrap)').hide();
		}
	}
</script>
<!-- ###################################### -->
</body>
</html>
