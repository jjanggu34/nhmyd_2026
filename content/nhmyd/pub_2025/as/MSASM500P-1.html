<script>
  $(document).ready(function () {
    fullLayerPop();
  });
</script>

<body>
  <div class="wrapper nhasset"><!-- 바닥페이지 --></div>
  <!-- ###################################### -->
  <!-- ### [팝업] [P] 즐겨찾기 설정 ### -->
  <!-- ###################################### -->
  <div class="nhasset popWrap fullLayerPop">
    <div class="popInner">
      <h1>즐겨찾기 설정</h1>
      <div class="popCont fontFixed"><!-- 2025-12-15 폰트 고정 요청 -->
        <div class="infoBanner">
          <div class="favAccount">
            <span>자주 쓰는 계좌를 <br> 즐겨찾기 해보세요!</span>
            <p class="mt12"> 즐겨찾기 설정한 계좌는 목록 상단에 고정되어<br>편하게 잔액을 확인하실 수 있습니다.<br>(최대 5개까지 설정 가능) </p>
          </div>
        </div>
        <hr class="divLine mt24 mb24">
        <!-- ### 즐겨 찾기 가능한 계좌가 없을 때 CASE ### -->
        <div class="mbAccListWrap mainAsset empty mt8 ac">
          <strong class="">즐겨찾기 가능한 계좌가 없어요</strong>
          <p class="mt12 color3 fs16">
            계좌를 연결하고 관리해보세요
          </p>
          <a href="javascript:;" class="displayB mt24 mb6 undeLine color3 -medium">자산연결</a>
        </div>
      </div>
      <!-- ### 즐겨 찾기 가능한 계좌가 없을 때 CASE ###  -->
      </div>
      <div class="popBtnWrap">
        <a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button" >
          <img src="../../images/common/btn_popClose.png" alt="닫기">
        </a>
        </div>
    </div>
  </div>

  <!-- ###################################### -->
  <!-- ### [샘플] 스크립트 ### -->

  <script></script>
