		categorySwipe()
	})

<body class="nhd_pay"><!-- NH Pay일 경우 nhd_pay 클래스 -->
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 권유직원 찾기 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap fullLayerPop">
	<div class="popInner">
		<h1>권유직원 찾기</h1>
		<div class="popCont">
			<h2 class="defTit">NH마이데이터 서비스를<br><strong>소개한 직원이 있다면 입력</strong>해주세요</h2>

			<!-- -------------------------------------- -->
			<!-- [SECTION] 검색영역 -->
			<!-- -------------------------------------- -->
			<div class="formWrap">
				<ul>
					<li>
						<div class="formArray mt20">
							<span class="chkRadio">
								<input type="radio" id="sample003" name="sample01" checked>
								<label for="sample003">이름(사번)으로 찾기</label>
							</span>
							<span class="chkRadio">
								<input type="radio" id="sample004" name="sample01">
								<label for="sample004">영업점으로 찾기</label>
							</span>
						</div>
					</li>
					<li class="addrSrch">
						<div class="inputList">
							<input type="text" title="이름(사번)" id='inputStaffInfo' placeholder="이름(사번)을 입력해 주세요.">
							<a href="javascript:" class="btnReset" role="button">입력내용삭제</a>
							<button class="btnSearch"><span class="blind">찾기</span></button>
						</div>
					</li>
				</ul>	
			</div>	

			<!-- -------------------------------------- -->
			<!-- [SECTION] 검색결과 -->
			<!-- -------------------------------------- -->
			<div id="searchResultWrap">
				<!-- [CASE] 검색결과있을경우 -->
				<div class="searchResultWrap">
					<p class="srPara">전체 <strong>00</strong>건이 검색되었습니다.</p>
					<ul class="searchResultList selectType">
						<li>
							<a href="javascript:;" class="link" role="button" title="항목을 선택하고 해당 창을 닫습니다.">
								<span class='title'>안양남지점</span>
								<span class='items'>김*원 (1111****)</span>
							</a>
						</li>
						<li>
							<a href='javascript:;' class="link" role="button" title="항목을 선택하고 해당 창을 닫습니다.">
								<span class='title'>안양남지점</span>
								<span class='items'>김*원 (1111****)</span>
							</a>
						</li>
					</ul>
				</div>

				<!-- [CASE] 검색결과없을경우 -->
				<div class="noResultWrap">
					<p>검색 결과가 없습니다.</p>
				</div>
				<!-- // -->
			</div>
			<!-- -------------------------------------- -->
		</div>
		<div class="popBtnWrap">
			<a href="javascript:;" onclick="popup_cfLayerClose(); return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기"></a>
		</div>
	</div>
</div>
<!-- ###################################### -->
</body>
</html>
