<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 투자기준설정 다시하기 안내 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner"><!-- 2025-08-28 기획 디자인 변경 -->
		<div class="popCont pt28 pb0 -icon -img2"><!-- 콘텐츠 아이콘 있을 때 -->
      <div class="subTit">
        <strong>투자성향진단 결과가<br>달라졌어요!</strong>
      </div>
      <p class="txtInfo">최적 포트폴리오 기준을<br>다시 설정해 보세요.</p>
      <div class="checkWrap">
        <input type="checkbox" id="fcheck01" class="chekTypeOther">
        <label class="check" for="fcheck01">하루동안 보지 않기</label>
      </div>
    </div>

		<div class="popBtnWrap">
			<div class="popBtn"><!-- 2025-08-28 기획 디자인 변경 -->
				<a href="javascript:;" class="" onclick="popClose(this);return false;" role="button">다음에</a>
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">다시하기</a>
			</div>      
		</div>
	</div>
</div>
