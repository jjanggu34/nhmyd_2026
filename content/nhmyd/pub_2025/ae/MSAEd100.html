<!DOCTYPE html >
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="NH마이데이터" />
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">
<meta name="author" content="">
<meta name="content" content="">
<meta name="keywords" content="NH마이데이터">
<meta name="description" content="NH마이데이터">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>자산 밸런스진단 | 자산관리</title>
<script type="text/javascript" src="../pub-assets/js/head-mb.js"></script>
</head>
<body>
  <div class="wrapper nhasset bgWhite">
    <!-- header -->
    <div class="header">
      <a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
      <h1>자산 밸런스진단</h1>
      <a href="javascript:;" class="btnAll" role="button"><span class="blind">전체메뉴</span></a>
    </div>
    <!-- //header -->

    <!-- ###################################### -->
    <!-- ### 자산 밸런스진단 ### -->
    <!-- ###################################### -->
    <div class="container bgWhite">
      <div class="lookSwiper balanceReview">
        <div class="swiper-container">
          <div class="swiper-wrapper">
            <div class="swiper-slide">
              <h3 class="lookTit">
                <strong >내 투자 성향에 맞춘<br /> 최적 포트폴리오를<br />확인해 보세요.</strong >
              </h3>
              <!-- 2025-10-16 클래스 추가-->
              <div class="balanceReviewAuto">
                <img class="assetBalanceImg" src="../../images/makebetter/banner/img_banner_01.png" alt="포트폴리오" />
              </div>
              <!-- // 2025-10-16 클래스 추가-->
            </div>
            <div class="swiper-slide">
              <h3 class="lookTit">
                <span>01</span>
                <strong>성공적인 투자를 위한 첫 걸음,<br />현재 투자 가능한<br />나의 자산은 얼마일까?</strong>
              </h3>
              <!-- 2025-10-16 클래스 추가-->
              <div class="balanceReviewAuto">
                <img class="assetBalanceImg" src="../../images/makebetter/banner/img_banne_02.png" alt="자산" />
              </div>
              <!-- 2025-10-16 // 클래스 추가-->
            </div>
            <div class="swiper-slide">
              <h3 class="lookTit">
                <span>02</span>
                <strong>투자하고자 하는<br />스타일에 맞춰<br />포트폴리오를 조정해볼까?</strong>
              </h3>
              <!-- 2025-10-16 클래스 추가-->
              <div class="balanceReviewAuto">
                <img class="assetBalanceImg" src="../../images/makebetter/banner/img_banner03.png" alt="투자" />
              </div>
              <!-- // 2025-10-16 클래스 추가-->
            </div>
            <div class="swiper-slide">
              <h3 class="lookTit">
                <span>03</span>
                <strong>성공적인<br />투자를 위한 TIP!<br />전문가의 조언을 확인해보세요.</strong>
              </h3>
              <!-- 2025-10-16 클래스 추가-->
              <div class="balanceReviewAuto">
                <img class="assetBalanceImg" src="../../images/makebetter/banner/img_banner_04.png" alt="조언" />
              </div>
              <!-- // 2025-10-16 클래스 추가-->
            </div>
          </div>
        </div>
        <div class="swiper-control">
          <div class="swiper-pagination"></div>
        </div>
      </div>

      <div class="areaBtnDefault">
        <a href="javascript:;" class="btnPressPoint" role="button">밸런스진단 시작</a>
      </div>
    </div>
  </div>

  <script>
    var swiper = new Swiper('.lookSwiper .swiper-container', {
      slidesPerView: '1',
      // spaceBetween: 12,
      centeredSlides: true,
      observer: true,
      observeParents: true,
      loop: true,
      autoplay: {
        delay: 6000,
        disableOnInteraction: false,      // 유저가 터치해도 재시작
        pauseOnMouseEnter: true           // 마우스 올라가면 일시정지
      },
      pagination: {
        el: '.swiper-pagination',
        type: 'bullets',
        clickable: true,
        bulletElement: 'a',
      },
      navigation: {
        nextEl: '.swiper-button-next',
        prevEl: '.swiper-button-prev',
      },
      // 2025-11-19 iOS 픽스 테스트 //////////////
      observer: true,
      observeParents: true,
      ///////////////////////////////////////////
      on: {
        init: function () {
          $('.lookSwiper .swiper-slide').attr('aria-hidden', 'true');
          $('.lookSwiper .swiper-slide-active').attr('aria-hidden', 'false');
        },
        slideChangeTransitionEnd: function (index) {
          var $shareBannerBtn = $('.lookSwiper .swiper-pagination');
          $shareBannerBtn.find('a').attr('title', '');
          $shareBannerBtn.find('a').eq(this.activeIndex).attr('title', '선택됨');
          $('.lookSwiper .swiper-slide').attr('aria-hidden', 'true');
          $('.lookSwiper .swiper-slide-active').attr('aria-hidden', 'false');

          $('.swiper-slide').removeClass('active');
          if (!$('.swiper-slide').eq(this.activeIndex).hasClass('once')) {
            $('.swiper-slide').eq(this.activeIndex).addClass('active');
          } else if ($('.swiper-slide').hasClass('slideR3')) {
            $('.swiper-slide').eq(this.activeIndex).addClass('once');
          }
        },
      },
    });
  </script>
</body>
</html>
