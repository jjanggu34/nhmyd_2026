<title>[P] 내 자산 안심 알림 옵션 변경 완료</title>
<script src="../pub-assets/js/head-mb.js"></script>
<script>
	$(document).ready(function(){
		slidePopConfirm(); //TO-BE 디자인 높이 조절되는 slidePopConfirm 사용
	})  
</script>

<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- ###################################### -->
<!-- ### [팝업] 내 자산 안심 알림 옵션 변경 완료 ### -->
<!-- ###################################### -->
<div class="nhasset popWrap slidePopConfirm">
	<div class="dim"></div>
	<div class="popInner -icon"><!-- 상단 아이콘 있을 때 -->
		<h1 class="-check">알림 계좌를 변경했어요</h1>
		<div class="popCont">
      <p class="txtInfo">
        변경하신 계좌정보는 변경일로부터<br>
        7일이 지난 다음 설정하신 요일부터 적용돼요.<br>
        새로운 기준에 따라 자산을 비교해 알려드릴게요.       
      </p>
		</div>
		<div class="popBtnWrap">
			<div class="popBtn">
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">확인</a>
			</div>
		</div>
	</div>
</div>
<!-- ###################################### -->
