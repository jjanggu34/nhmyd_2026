<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Script-Type" content="text/javascript" />
<meta http-equiv="Content-Style-Type" content="text/css" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-title" content="NH마이데이터" />
<meta http-equiv="imagetoolbar" content="no" />
<meta name="robots" content="no-index,follow" />
<meta name="title" content="" />
<meta name="author" content="" />
<meta name="content" content="" />
<meta name="keywords" content="NH마이데이터" />
<meta name="description" content="NH마이데이터" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="-1" />
<title>금융상품 상세(예금) | 금융소득확인 | 금융소득 모니터링</title>
<script src="../pub-assets/js/head-mb.js"></script>
</head>
<body>
<div class="wrapper nhasset">
  <!-- header -->
  <div class="header">
    <a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
    <h1>금융소득 확인</h1>
    <a href="javascript:;" class="btnAll" role="button"><span class="blind">전체메뉴</span></a>
  </div>
  <!-- //header -->

  <!-- ############################################ -->
  <!-- ### [내용] 금융소득  확인 ### -->
  <!-- ############################################ -->
  <div class="container bgWhite">
    <!-- 직접등록한 상품명 -->
    <div class="incomeNotice icoPay mt24">
      <strong>직접등록한 예금 상품명</strong>
    </div>
    <!-- -------------------------------------- -->
    <!-- [SECTION]사용자 등록 금융소득 내용 -->
    <!-- -------------------------------------- -->
    <div class="boxTypeWrap -line mt24">
      <dl class="mbCiBox gridMainSide mt0">
        <dt class="h5">발생 이자소득</dt>
        <dd class="h5 pointColor"><span>450,000</span>원</dd>
      </dl>
      <hr class="divLine mt12 mb12">
      <dl class="mbCiBox gridMainSide">
        <dt>현재 잔액(원금)</dt>
        <dd class="ar"><span>11,000,000</span>원</dd>
        <dt>계좌 개설일</dt>
        <dd class="ar">2022.12.29</dd>
        <dt>계좌 만기일</dt>
        <dd class="ar">2025.12.28</dd>
      </dl>
      <!--  펼치기 토글 -->
      <div class="moreInfoWrap toggleWrap">
        <div class="moreInfo toggleCont" style="display: none">
          <dl class="mbCiBox gridMainSide">
            <dt>금리</dt>
            <dd class="ar"><span>4.31</span>%</dd>
            <dt>내가 지정한 소득 발생일</dt>
            <dd class="ar">2022.12.29</dd>
            <dt>소득 발생일</dt>
            <dd class="ar">2022.12.28</dd>
          </dl>
        </div>
        <hr class="divLine mt24 mb0">
        <button type="button" class="cs moreOpenBtn toggleBtn bdNone mt16" aria-expanded="false" role="button" >
          <span class="toggleTxt13">펼치기</span>
        </button>
      </div>
      <!-- // 펼치기 토글 -->
    </div>
    <!-- -------------------------------------- -->

    <!-- -------------------------------------- -->
    <!-- [SECTION] 버튼영역 -->
    <!-- -------------------------------------- -->
    <div class="areaBtnDefault">
      <a href="javascript:;" class="btnPressDefault" role="button">삭제</a>
      <a href="javascript:;" class="btnPressPoint" role="button">나의 금융소득 수정</a>
    </div>
    <!-- -------------------------------------- -->
  </div>
  <!-- ###################################### -->
</div>

<!-- ###################################### -->
<!-- ### [샘플] 스크립트 ### -->
<!-- ###################################### -->
<script></script>
<!-- ###################################### -->
</body>
</html>
