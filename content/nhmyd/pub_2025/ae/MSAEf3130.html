<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="NH마이데이터">
<meta http-equiv="imagetoolbar" content="no">
<meta name="robots" content="no-index,follow">
<meta name="title" content="">
<meta name="author" content="">
<meta name="content" content="">
<meta name="keywords" content="NH마이데이터">
<meta name="description" content="NH마이데이터">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="-1">
<title>직접등록한 금융상품 등록/수정(간편등록) | 금융소득확인 | 금융소득 모니터링</title>
<script src="../pub-assets/js/head-mb.js"></script>
</head>
<body>
  <div class="wrapper nhasset">
    <!-- header -->
    <div class="header">
      <a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
      <h1>금융소득 확인</h1>
      <a href="javascript:;" class="btnAll" role="button"><span class="blind">전체메뉴</span></a>
    </div>
    <!-- //header -->

    <div class="container bgWhite">
    <!-- ############################################ -->
    <!-- ### [내용] 직접등록한 금융상품 등록/수정(간편등록) ### -->
    <!-- ############################################ -->
      <!-- ### 탭 버튼 (모양만 탭)### -->
      <div class="incomeMonHeader">
        <div class="sortTabs">
          <div class="sortlist col2">
            <button class="sortItem" title="상세등록">상세등록</button>
            <button class="sortItem active" title="간편등록(현재)">간편등록</button><!-- [D] 선택된 값 active 클래스 추가 -->
          </div>
        </div>
      </div>
      <!-- ### // 탭 버튼 ### -->

      <div class="financeIncomeWrap">
        <!-- 2025-10-10 디자인 변경 -->
        <div class="formWrap mt12">
          <!-- 예금/적금/배당 선택 버튼 radio 2025-10-10 수정 -->
          <h3 class="fs14 -medium color3">금융소득 구분</h3>
          <div class="boxRadio mt12">
            <div class="boxRadioInn">
              <span>
                <input type="radio" name="FboxRadio01" id="FboxRadio0101" aria-label="금융소득 구분(예금)">
                <label for="FboxRadio0101" aria-hidden="true">예금</label>
              </span>
            </div>
            <div class="boxRadioInn">
              <span>
                <input type="radio" name="FboxRadio01" id="FboxRadio0102" aria-label="금융소득 구분(적금)">
                <label for="FboxRadio0102" aria-hidden="true">적금</label>
              </span>
            </div>
            <div class="boxRadioInn">
              <span>
                <input type="radio" name="FboxRadio01" id="FboxRadio0103" aria-label="금융소득 구분(배당)">
                <label for="FboxRadio0103" aria-hidden="true">배당</label>
              </span>
            </div>
          </div>
          <!-- // 예금/적금/배당 선택 버튼 radio -->
          <!--  소득 발생일 -->
          <h3 class="fs14 -medium color3 mt32">소득 발생일</h3>
          <div class="calendarForm mt12">
            <div class="inputList">
              <input type="text" value="2025.12.28" title="소득 발생일" placeholder="소득 발생일"><!-- 2025-11-10 readonly 추가 요청, 2025-11-17 다시 삭제 요청 -->
              <a href="javascript:;" class="btnCalendar" role="button"><span class="blind">소득 발생일 선택</span></a>
            </div>
          </div>
          <!-- //  소득 발생일 -->
          <!-- 금융소득명 -->
          <h3 class="fs14 -medium color3 mt32">금융소득명</h3>
          <div class="titListBox">
            <div class="inputList mt12">
              <input type="text" title="금융소득명" value="" placeholder="직접 등록하는 금융소득명">
              <a href="javascript:" class="btnReset" role="button">입력내용삭제</a>
            </div>
          </div>
          <!-- // 금융소득명 -->
          <!-- 통화종류 -->
          <h3 class="fs14 -medium color3 mt32">통화종류</h3>
          <div class="inputList mt12">
            <a href="javascript:;" title="통화종류 선택" aria-haspopup="true">
              <span class="selectValue">원</span>
              <span class="selectBtn"></span>
            </a>
            <select name="" title="선택해주세요">
              <option value=""></option>
            </select>
          </div>
          <!-- // 통화종류 -->

          <!-- 발생한 금융소득 -->
          <h3 class="fs14 -medium color3 mt32">발생한 금융소득</h3>
          <div class="inputList unitMan mt12">
            <input type="tel" title="금융소득 금액" value="" placeholder="금융소득 금액">
            <span class="unit">원</span><!-- 2025-11-07 올원가이드에 따른 위치 변경 -->
            <a href="javascript:" class="btnReset" role="button">입력내용삭제</a>
          </div>
          <!-- // 발생한 금융소득 -->
          <!-- 발생한 금융소득 에러일 때 -->
          <div class="inputList unitMan mt12 error"><!-- [D] 에러 시 error 클래스 추가  -->
            <input type="tel" title="금융소득 금액" value="" placeholder="금융소득 금액">
            <span class="unit">원</span><!-- 2025-11-07 올원가이드에 따른 위치 변경 -->
            <a href="javascript:" class="btnReset" role="button">입력내용삭제</a>
          </div>
          <p class="errorTxt mt12">1천원~10억원 사이의 금액을 입력해 주세요</p><!-- 에러 시 메세지 추가 -->
          <!-- //발생한 금융소득 에러일 때 -->

          <!-- 발생한 금융소득 금액 추가 -->
          <div class="addBtnWrap mt12">
            <a href="javascript:;" class="btn -tertiary -sm" role="button" title="10만원 추가">+10만</a>
            <a href="javascript:;" class="btn -tertiary -sm" role="button" title="50만원 추가">+50만</a>
            <a href="javascript:;" class="btn -tertiary -sm" role="button" title="100만원 추가">+100만</a>
            <a href="javascript:;" class="btn -tertiary -sm" role="button" title="500만원 추가">+500만</a>
          </div>
          <!-- // 발생한 금융소득 금액 추가 -->
        </div>
      </div>

      <!-- -------------------------------------- -->
      <!-- [SECTION] 버튼영역 -->
      <!-- -------------------------------------- -->
      <div class="areaBtnDefault">
        <!-- 금융소득 입력 전 (비활성) -->
        <a href="javascript:;" class="btnPressPoint disabled" role="button" aria-disabled="true">나의 금융소득 저장</a><!-- [D] 활성화 aria-disabled="false" / 클래스명 disabled 삭제 -->
        <!-- // 금융소득 입력 전 (비활성) -->
        <!-- 금융소득 입력 후 (활성) -->
        <!-- <a href="javascript:;" class="btnPressPoint" role="button" aria-disabled="false">나의 금융소득 저장</a> -->
        <!-- // 금융소득 입력 후 (활성) -->
      </div>
      <!-- -------------------------------------- -->
    </div>
    <!-- ###################################### -->
  </div>

  <!-- ###################################### -->
  <!-- ### [샘플] 스크립트 ### -->
  <!-- ###################################### -->
<script>
</script>
  <!-- ###################################### -->
</body>
</html>
