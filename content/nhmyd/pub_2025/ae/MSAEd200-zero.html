<script>
document.addEventListener('DOMContentLoaded', () => {

  const percentageData = [
    { label: "현금", percent: 0.9 }, { label: "국내주식", percent: 2.1 }, { label: "해외선진국주식", percent: 96.3 },

  ];
  const percentageDataZero = [
    { label: "현금", percent: 0.0 }, { label: "국내주식", percent: 0.0 }, { label: "해외선진국주식", percent: 0.0 },

  ];

  const convertedData = createChartData(percentageData);
  const doughnutChartInstance = new DoughnutChart("doughnutChart", convertedData, {
    totalFrames: 60, colorType: 'type1', minimumSlicePercent: 5, sizeFactor: 1, thicknessRatio: 0.5, width: 180, height: 180, lazyLoad: false // 이 옵션을 추가하여 바로 그리지 않도록 설정
  });
  const convertedDataZero = createChartData(percentageDataZero);
  const doughnutChartInstanceZero = new DoughnutChart("doughnutChartZero", convertedDataZero, {

  });
});
