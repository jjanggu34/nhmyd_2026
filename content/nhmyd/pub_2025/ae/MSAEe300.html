<head>
<meta charset="utf-8">

<title>내 자산 안심 알림서비스 | 금융자산분석</title>
<script src="../pub-assets/js/head-mb.js"></script>
</head>
<body>
<div class="wrapper nhasset">
	<!-- header -->
	<div class="header">
		<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1>내 자산 안심 알림서비스</h1>
		<a href="javascript:;" class="btnCancle"><span class="blind">취소</span></a>
	</div>
	<!-- //header -->

	<!-- ############################################ -->
	<!-- ### [내용] 내 자산 안심 알림서비스 정보입력 ### -->
	<!-- ############################################ -->
	<div class="container bgWhite">
		<!-- -------------------------------------- -->
		<!-- [SECTION] 정보입력 현재 스텝 -->
		<!-- -------------------------------------- -->
        <div class="infoStep1" role="img" aria-label="정보입력: 총 2단계 중 2번째 단계">
            <ol>
                <li>
                    <i aria-hidden="true">1</i>
                    <span>정보입력</span>
                </li>
                <li><li aria-current="step"> <!-- [D] 현재 스텝 li : aria-current="step" 노출 -->
                    <i aria-hidden="true">2</i>
                    <span>자산선택</span>
                </li>
            </ol>
        </div>         

		<!-- -------------------------------------- -->
		<!-- [SECTION] 안내 배너 -->
		<!-- -------------------------------------- -->
		<div class="infoBanner"> <!-- [D] t* : 폰트크기 및 스타일 재정의 -->
			<div class="img2"> <!-- [D] img* : 아이콘 및 BG 색상정의 -->
				<span>알림받을 자산을<br>선택해주세요</span>
                <p>이제 거의 다 왔어요!</p>
			</div>
		</div>

		<!-- -------------------------------------- -->
		<!-- [SECTION] 계좌선택 -->
		<!-- -------------------------------------- -->
		 <div class="formWrap">
			<div class="boxRadio wrapType2">
				<div class="boxRadioInn">
					<span>
						<input type="radio" name="FboxRadio01" id="FboxRadio0101" aria-label="계좌 선택(전체 계좌 선택)">
						<label for="FboxRadio0101" aria-hidden="true">전체 계좌 선택</label>
					</span>
				</div>
				<div class="boxRadioInn">
					<span>
						<input type="radio" name="FboxRadio01" id="FboxRadio0102" aria-label="계좌 선택(특정 계좌 선택)">
						<label for="FboxRadio0102" aria-hidden="true">특정 계좌 선택</label>
					</span>
				</div>
			</div>
		 </div>
         <hr class="divLine mt32">
        <!-- -------------------------------------- -->

		<!-- -------------------------------------- -->
		<!-- [SECTION] 버튼영역 -->
		<!-- -------------------------------------- -->
        <div class="areaBtnDefault">
            <a href="javascript:;" class="btnPressPoint disabled" role="button" aria-disabled="true">확인</a><!-- [D] 비활성화 시 class="disabled" / aria-disabled="true" 추가 -->
        </div>
		<!-- -------------------------------------- -->
	</div>
	<!-- ###################################### -->
</div>

<!-- ###################################### -->
<!-- ### [샘플] 스크립트 ### -->

</script>

</body>
