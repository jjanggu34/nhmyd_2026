<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="apple-mobile-web-app-title" content="NH마이데이터" />
<meta http-equiv="imagetoolbar" content="no" />
<meta name="robots" content="no-index,follow" />

<title>발생 금융소득 상세(적금)-외화 case| 금융소득확인 | 금융소득 모니터링</title>
<script src="../pub-assets/js/head-mb.js"></script>
</head>
<body>
<div class="wrapper nhasset">
  <!-- header -->
  <div class="header">
    <a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
    <h1>금융소득 확인</h1>
    <a href="javascript:;" class="btnAll" role="button"><span class="blind">전체메뉴</span></a>
  </div>
  <!-- //header -->

  <div class="container bgWhite">
    <!-- ############################################ -->
    <!-- ### [내용] 발생 금융소득 상세(적금) -외화 case ### -->
    <!-- ############################################ -->
    <div class="financeIncomeWrap">
      <!--  마이데이터에서 불러온 상품명-->
      <ul class="mbAccList">
        <li class="mbAccListItem pd0 pt12 bdNone">
          <span class="mbCiWrap">
            <img src="../../images/makebetter/logos/AAAZ0000.svg" class="mbCi" alt="NH농축협 Ci" />
          </span>
          <dl class="mbAccItem">
            <dt class="mbAccTitWrap">
              <span class="mbAccTit ellipsis">나의 적금 통장</span>
              <!-- <em class="iconNew"><span class="blind">New</span></em>[D] New일 때" -->
            </dt>
            <dd class="mbAccNum -regular">3021234123412</dd>
          </dl>
        </li>
      </ul>
      <!-- // 마이데이터에서 불러온 상품명 -->

      <div class="boxTypeWrap -line mt16">
        <dl class="mbCiBox gridMainSide mt0">
          <dt class="h5">발생 이자소득</dt>
          <dd class="h5 pointColor"><span>450,000</span>원</dd>
        </dl>
        <hr class="divLine mt12 mb12">
        <dl class="mbCiBox gridMainSide">
          <dt>월 납입액</dt>
          <dd class="ar">USD <span>743.24</span></dd>
          <dd class="balanceSub"><span>1,000,000</span>원</dd>
          <dt>계좌 개설일</dt>
          <dd class="ar">2022.12.29</dd>
          <dt>계좌 만기일</dt>
          <dd class="ar">2025.12.28</dd>
        </dl>
        <!--  펼치기 토글 -->
        <div class="moreInfoWrap toggleWrap">
          <div class="moreInfo toggleCont" style="display: none">
            <dl class="mbCiBox gridMainSide">
              <dt>금리</dt>
              <dd class="ar"><span>4.31</span>%</dd>
              <dt>총 납입횟수</dt>
              <dd class="ar"><span>31</span>회</dd>
              <dt>소득 발생일</dt>
              <dd class="ar">2025.12.28</dd>
            </dl>
            <!-- 환율정보 -->
            <dl class="bgAsis balanceItem mt16">
              <dt class="balanceItemTitle">환율정보</dt>
              <dd class="balanceItemValue">1USD(미국달러) = <span>1,480</span>원</dd>
              <dd class="balanceItemSub">기준일 <span class="ml8">2025.07.03</span></dd>
            </dl>
            <!-- // 환율정보 -->
          </div>
          <hr class="divLine mt24 mb0">
          <button type="button" class="cs moreOpenBtn toggleBtn bdNone mt16" aria-expanded="false" role="button" >
            <span class="toggleTxt13">펼치기</span>
          </button>
        </div>
        <!-- // 펼치기 토글 -->
      </div>
    </div>

    <!-- -------------------------------------- -->
    <!-- [SECTION] 버튼영역 -->
    <!-- -------------------------------------- -->
    <div class="areaBtnDefault">
      <a href="javascript:;" class="btnPressPoint" role="button" aria-disabled="false">나의 금융소득 수정</a>
    </div>
    <!-- -------------------------------------- -->
    <!-- ###################################### -->
  </div>
</div>

<!-- ###################################### -->

<!-- ###################################### -->
<script></script>
<!-- ###################################### -->
</body>
</html>
