<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-title" content="농협자산관리" />
<meta name="robots" content="no-index,follow">
<title>[TEMPLATE] 신규/개선 화면 시작 템플릿 (Popup / Bottom Sheet)</title>

<!-- ================================================================
     [손대지 않는 영역] 레거시 팝업 프레임 — popup_01_confirm.html 등
     실제 검증된 include 세트 + of-mock.local.js(로컬 QA 전용, OF 브릿지 모킹)
     ================================================================ -->
<script src="../../claude/of-mock.local.js"></script>
<script src="../nhmyd/js/jquery-1.9.1.min.js"></script>
<script src="../nhmyd/js/jquery-ui.min.js"></script>
<script src="../nhmyd/js/jquery.ui.touch-punch.min.js"></script>
<script src="../nhmyd/js/common_ui.js"></script>
<script src="../nhmyd/js/swiper.min.js"></script>
<script src="../nhmyd/js/nhasset-ui.js"></script>
<link type="text/css" rel="stylesheet" href="../nhmyd/css/swiper.min.css">
<link type="text/css" rel="stylesheet" href="../nhmyd/css/nh_base.css">
<link rel="stylesheet" type="text/css" href="../nhmyd/css/nh_layout.css">
<link rel="stylesheet" type="text/css" href="../nhmyd/css/nh_comm.css">
<link rel="stylesheet" type="text/css" href="../nhmyd/css/nhasset_logos.css">
<link rel="stylesheet" type="text/css" href="../nhmyd/css/nhasset_com.css">
<link rel="stylesheet" type="text/css" href="../nhmyd/css/nhasset_cont.css">
<link rel="stylesheet" type="text/css" href="../nhmyd/css/nhasset_myd.css">
<link rel="stylesheet" type="text/css" href="../nhmyd/css/nhasset_myd_mb.css">
<link rel="stylesheet" type="text/css" href="../nhmyd/css/ms_style.css">

<!-- [신규 작업 영역] NDS 컴포넌트 CSS -->
<link rel="stylesheet" type="text/css" href="assets/css/nds.css?v=59">

<script>
	// [손대지 않는 영역] slidePopConfirm()은 nhasset-ui.js의 popOpenRun을 통해
	// .popWrap > .popInner 구조와 OF.exeStatus 감지에 그대로 의존합니다.
	$(document).ready(function(){
		slidePopConfirm();
	})
</script>
</head>
<body>
<!-- [안내] wrapper/header/container(빈 값)/popWrap·dim·popInner·slidePopConfirm 은
     팝업의 열림 동작과 OF 연동을 담당하는 레거시 뼈대이므로 그대로 둡니다.
     실제 작업은 popInner 안쪽의 "nds-scope" div 내부만 채우면 됩니다. -->
<div class="wrapper nhasset">
	<div class="header">
		<a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
		<h1><a href="javascript:;" role="text">[TEMPLATE] 팝업 호출 화면</a></h1>
		<a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
	</div>
	<div class="container"></div>

	<!-- 팝업 본체 : popWrap / dim / popInner 는 레거시 그대로 -->
	<div class="nhasset popWrap slidePopConfirm">
		<div class="dim"></div>
		<div class="popInner">

			<!-- [중요] common_ui.js의 slidePopConfirm()이 popInner 높이를 계산할 때
			     아래 3개를 실제로 찾아서 픽셀 높이를 더합니다 (jQuery selector 기준):
			       - .popInner h1 (또는 h2) → 타이틀 높이
			       - .popCont               → 본문 높이
			       - .popBtnWrap .popBtn    → 버튼 영역 높이
			     이 클래스들을 빼면 높이 계산이 NaN이 되어 팝업이 열리지 않습니다(0px로 접힘).
			     그래서 h1 / popCont / popBtnWrap+popBtn 은 "기능 훅"으로 반드시 남기고,
			     시각 스타일만 NDS 클래스를 나란히 붙여서 처리합니다. -->
			<!-- [중요] NDS 실제 bottomsheet은 좌우 24px 패딩(spacing-24)이 기본값입니다.
			     popCont/popBtnWrap은 레거시 클래스라 기본 패딩이 없어서, assets/css/nds.scoped.css의
			     .nds .popCont / .nds .popBtnWrap 규칙에서 12/24/32px 값을 한 번만
			     정의해 적용합니다(이전엔 파일마다 인라인으로 중복 기재했었음). -->
			<div class="nds" style="padding-top:20px;">
				<h1 class="bottomsheet__title ac mt0" style="padding:0 24px;">[SAMPLE] 팝업 타이틀</h1>
				<div class="popCont">
					<p>[SAMPLE] 안내 메시지가 들어가는 영역입니다. 부가 설명 문구도 이 안에 넣습니다.</p>
					<div class="card card--gap-24" style="margin-top:16px;">
						<span class="card__eyebrow">[SAMPLE] 참고 정보</span>
						<p class="card__guide-text">필요 시 카드/뱃지 등 다른 NDS 컴포넌트도 이 안쪽에 함께 쓸 수 있습니다.</p>
					</div>
				</div>
				<div class="popBtnWrap">
					<button type="button" class="popBtn btn btn--primary btn--full btn--lg">확인</button>
				</div>
			</div>

		</div>
	</div>
	<!-- //팝업 본체 -->
</div>
</body>
</html>
