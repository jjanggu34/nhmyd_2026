<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="no-index,follow">
<title>[SAMPLE] 동의 팝업 (NDS Bottomsheet + Tooltip)</title>
<script src="../../../claude/of-mock.local.js"></script>
<script src="../../nhmyd/js/jquery-1.9.1.min.js"></script>
<script src="../../nhmyd/js/jquery-ui.min.js"></script>
<script src="../../nhmyd/js/jquery.ui.touch-punch.min.js"></script>
<script src="../../nhmyd/js/common_ui.js"></script>
<script src="../../nhmyd/js/swiper.min.js"></script>
<script src="../../nhmyd/js/nhasset-ui.js"></script>
<link type="text/css" rel="stylesheet" href="../../nhmyd/css/swiper.min.css">
<link type="text/css" rel="stylesheet" href="../../nhmyd/css/nh_base.css">
<link rel="stylesheet" type="text/css" href="../../nhmyd/css/nh_layout.css">
<link rel="stylesheet" type="text/css" href="../../nhmyd/css/nh_comm.css">
<link rel="stylesheet" type="text/css" href="../../nhmyd/css/nhasset_logos.css">
<link rel="stylesheet" type="text/css" href="../../nhmyd/css/nhasset_com.css">
<link rel="stylesheet" type="text/css" href="../../nhmyd/css/nhasset_cont.css">
<link rel="stylesheet" type="text/css" href="../../nhmyd/css/nhasset_myd.css">
<link rel="stylesheet" type="text/css" href="../../nhmyd/css/nhasset_myd_mb.css">
<link rel="stylesheet" type="text/css" href="../../nhmyd/css/ms_style.css">
<link rel="stylesheet" type="text/css" href="../assets/css/nds.scoped.css?v=53">
<script>
  $(document).ready(function(){ slidePopConfirm(); });
</script>
</head>
<body>
<div class="wrapper nhasset">
  <div class="header">
    <a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
    <h1><a href="javascript:;" role="text">[SAMPLE] 동의 팝업 호출 화면</a></h1>
    <a href="javascript:;" class="btnGoHome" role="button"><span>Home</span></a>
  </div>
  <div class="container"></div>

  <!-- 팝업 본체 : popWrap/dim/popInner 는 레거시 그대로 -->
  <div class="nhasset popWrap slidePopConfirm">
    <div class="dim"></div>
    <div class="popInner">
      <!-- [중요] h1 / .popCont / .popBtnWrap .popBtn 기능 훅 유지 (slidePopConfirm 높이 계산용) -->
      <div class="nds-scope" style="padding-top:20px;">
        <h1 class="bottomsheet__title ac mt0" style="padding:0 24px;">[SAMPLE] 자산 정보 제공 동의</h1>
        <div class="popCont">
          <p style="margin-bottom:12px;">아래 정보를 마이데이터 서비스 제공을 위해 활용합니다.</p>

          <!-- Tooltip card -->
          <div class="tooltip-card" style="margin-bottom:16px;">
            <div class="tooltip-card__header">
              <span class="tooltip-card__title">수집 항목</span>
              <button type="button" class="tooltip-card__close" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
            </div>
            <ul class="tooltip-card__list">
              <li class="tooltip-card__item">계좌 잔액 및 거래내역</li>
              <li class="tooltip-card__item">카드 이용내역</li>
            </ul>
          </div>

          <!-- check-survey 동의 -->
          <label class="check-survey">
            <div class="check-survey__box">
              <span class="check-survey__icon"><img src="../assets/img/icon/check-24.svg" width="20" height="20" alt="체크" style="vertical-align:middle;"></span>
              <span class="check-survey__text">[SAMPLE] 개인(신용)정보 수집·이용에 동의합니다</span>
            </div>
          </label>
        </div>
        <div class="popBtnWrap">
          <button type="button" class="popBtn btn btn--primary btn--full btn--lg">동의하고 계속하기</button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
